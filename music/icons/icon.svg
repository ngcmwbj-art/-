<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ミュージックのアイコン（自作）。夕やけ色の地に、ガラスの丸と白い音符。
       角は丸めていません（端末が自動で丸めます） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe55"/>
      <stop offset=".52" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ee2f6c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".26" cy=".16" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".46"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="note" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g id="mark">
    <!-- ガラスの丸 -->
    <circle cx="256" cy="256" r="172" fill="url(#glass)" stroke="url(#edge)" stroke-width="7" filter="url(#soft)"/>
    <!-- 上のふちの光 -->
    <path d="M118 214a146 146 0 0 1 276 0c-40-34-90-52-138-52s-98 18-138 52z" fill="#fff" opacity=".2"/>
    <!-- 連桁でつながった八分音符 -->
    <g fill="#fff" filter="url(#note)" transform="translate(256 262) scale(.66) translate(-261 -254)">
      <ellipse cx="176" cy="358" rx="58" ry="44" transform="rotate(-20 176 358)"/>
      <ellipse cx="346" cy="326" rx="58" ry="44" transform="rotate(-20 346 326)"/>
      <path d="M208 142l196-36v220h-26V176l-144 27v157h-26z"/>
    </g>
  </g>
</svg>
