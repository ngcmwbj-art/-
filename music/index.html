<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミュージック</title>
<meta name="description" content="ファイルの音楽を入れるだけで、通信なしで聴ける自分用の音楽プレイヤー。">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ミュージック">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/coverflow.css">
</head>
<body>

<div id="app" class="app">

  <!-- ライブラリ：一覧が全面に広がり、その上に、すりガラスのバーが浮かぶ -->
  <div id="main" class="main">
    <div id="pages" class="pages"></div>
    <header id="navbar" class="navbar"></header>

    <div class="dock">
      <!-- いま流れている曲（押すと再生中の画面が開く） -->
      <div id="mini" class="mini glass" hidden>
        <button type="button" id="mini-open" class="mini-open" aria-label="再生中の画面を開く">
          <span class="mini-art"><span data-ic="note-large"></span><img id="mini-art" alt="" hidden></span>
          <span class="mini-text">
            <span id="mini-title" class="mini-title"></span>
            <span id="mini-artist" class="mini-artist"></span>
          </span>
        </button>
        <button type="button" id="mini-play" class="mini-btn" aria-label="再生"><span id="mini-play-ic" data-ic="play"></span></button>
        <button type="button" id="mini-next" class="mini-btn" aria-label="次の曲"><span data-ic="next"></span></button>
      </div>

      <nav id="tabbar" class="tabbar glass" aria-label="ならべ方">
        <button type="button" class="tab" data-tab="playlists"><span class="tab-ic" data-ic="playlists"></span><span class="tab-label">プレイリスト</span></button>
        <button type="button" class="tab" data-tab="artists"><span class="tab-ic" data-ic="artists"></span><span class="tab-label">アーティスト</span></button>
        <button type="button" class="tab" data-tab="songs"><span class="tab-ic" data-ic="songs"></span><span class="tab-label">曲</span></button>
        <button type="button" class="tab" data-tab="albums"><span class="tab-ic" data-ic="albums"></span><span class="tab-label">アルバム</span></button>
        <button type="button" class="tab" data-tab="more"><span class="tab-ic" data-ic="more"></span><span class="tab-label">その他</span></button>
      </nav>
    </div>
  </div>

  <!-- 再生中の画面（下からせり上がる） -->
  <section id="np" class="np" hidden aria-label="再生中">
    <div id="np-bg" class="np-bg" aria-hidden="true"></div>

    <header id="np-top" class="np-top">
      <button type="button" id="np-back" class="gbtn" aria-label="一覧にもどる"><span data-ic="chevron-down"></span></button>
      <span id="np-count" class="np-count"></span>
      <button type="button" id="np-flip" class="gbtn" aria-label="再生する順番を見る" aria-pressed="false"><span data-ic="list"></span></button>
    </header>

    <div id="np-stage" class="np-stage">
      <div id="np-scale" class="np-scale">
        <div id="np-card" class="np-card">
          <div id="np-front" class="np-face np-front">
            <div class="np-art-ph" data-ic="note-large" aria-hidden="true"></div>
            <img id="np-art" class="np-art" alt="" hidden>
            <div id="np-lyrics" class="np-lyrics" hidden></div>
          </div>
          <div id="np-backface" class="np-face np-backface" aria-hidden="true">
            <div id="np-queue" class="np-queue"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="np-panel">
      <div class="np-titles" aria-live="polite">
        <div id="np-title" class="np-title"></div>
        <div class="np-sub"><span id="np-artist" class="np-artist"></span><span id="np-album" class="np-album"></span></div>
      </div>

      <div class="np-scrub">
        <div id="np-scrub" aria-label="再生位置"></div>
        <div class="np-times">
          <span id="np-elapsed" class="np-time">0:00</span>
          <span id="np-remain" class="np-time">-0:00</span>
        </div>
      </div>

      <div class="np-controls">
        <button type="button" id="np-prev" class="np-btn" aria-label="前の曲"><span data-ic="prev"></span></button>
        <button type="button" id="np-play" class="np-btn np-btn-play" aria-label="再生"><span id="np-play-ic" data-ic="play"></span></button>
        <button type="button" id="np-next" class="np-btn" aria-label="次の曲"><span data-ic="next"></span></button>
      </div>

      <div id="np-volume" class="np-volume" hidden>
        <span class="np-vol-ic" data-ic="speaker-low" aria-hidden="true"></span>
        <div id="np-vol" class="slider-vol" aria-label="音量"></div>
        <span class="np-vol-ic" data-ic="speaker-high" aria-hidden="true"></span>
      </div>

      <div class="np-modes">
        <button type="button" id="np-shuffle" class="gbtn" aria-label="シャッフル" aria-pressed="false"><span data-ic="shuffle"></span></button>
        <button type="button" id="np-lyrics-btn" class="gbtn" aria-label="歌詞" aria-pressed="false" hidden><span data-ic="lyrics"></span></button>
        <button type="button" id="np-repeat" class="gbtn" aria-label="リピート"><span data-ic="repeat"></span></button>
      </div>
    </div>
  </section>

  <!-- 横向きにしたときのジャケットの流れ -->
  <div id="coverflow" class="coverflow" hidden></div>

  <!-- お知らせ・選択肢などの窓 -->
  <div id="overlays"></div>

  <!-- 起動中の表示（JavaScript が動きだしたら消える） -->
  <div id="boot" class="boot" aria-hidden="true"></div>
</div>

<!-- ファイル選び。accept に拡張子も並べてあるのは、パソコンで音楽ファイルだけを見せるため（iPhone では外す） -->
<input id="file-input" class="file-input" type="file" multiple tabindex="-1" aria-hidden="true"
  accept="audio/*,.mp3,.m4a,.m4b,.mp4,.aac,.flac,.ogg,.oga,.opus,.wav,.wave,.aif,.aiff,.aifc,.caf">
<input id="dir-input" class="file-input" type="file" multiple webkitdirectory tabindex="-1" aria-hidden="true">

<audio id="audio" preload="auto"></audio>

<noscript><p style="padding:2em">このアプリは JavaScript が必要です。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
