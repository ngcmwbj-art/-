<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf5e9">
  <title>はたけパズル</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 上のバー：タイトル -->
    <header class="topbar">
      <h1 class="title" data-msg="title"></h1>
    </header>

    <main>
      <!-- パズル画面 -->
      <section id="screen-puzzle" class="screen active">
        <div class="score-row">
          <div class="score-box">
            <span class="label" data-msg="puzzle.score"></span>
            <span id="score" class="num">0</span>
          </div>
          <div id="combo" class="combo"></div>
          <div class="score-box">
            <span class="label" data-msg="puzzle.best"></span>
            <span id="best" class="num">0</span>
          </div>
        </div>
        <div id="board" class="board"></div>
        <div id="tray" class="tray">
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ダイアログ（ゲームオーバーなどで使い回す） -->
  <div id="modal" class="modal-bg hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 class="modal-title"></h2>
      <div class="modal-body"></div>
      <div class="modal-buttons"></div>
    </div>
  </div>

  <!-- データが読めなかったとき（ファイルを直接開いた場合など） -->
  <div id="load-error" class="load-error" hidden>
    <p>データを読み込めませんでした。</p>
    <p>このゲームは JSON ファイルを読み込むため、<br>ローカルサーバー経由で開いてください。<br>（README.md を参照）</p>
  </div>

  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
