<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf5e9">
  <title>はたけパズル</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 上のバー：タイトルと、季節・資源の表示 -->
    <header class="topbar">
      <div class="title-row">
        <h1 class="title" data-msg="title"></h1>
        <div class="corner-btns">
          <button id="sound-btn" class="icon-btn" type="button"></button>
          <button id="help-btn" class="icon-btn" type="button">？</button>
        </div>
      </div>
      <div class="hud">
        <span id="hud-season" class="hud-item season"></span>
        <span id="hud-water-box" class="hud-item gauge water">
          <span id="hud-water-icon"></span><span class="hud-label" data-msg="hud.water"></span><b id="hud-water">0</b>
        </span>
        <span id="hud-fertilizer-box" class="hud-item gauge fertilizer">
          <span id="hud-fertilizer-icon"></span><span class="hud-label" data-msg="hud.fertilizer"></span><b id="hud-fertilizer">0</b>
        </span>
        <span class="hud-item"><span id="hud-coin-icon"></span><b id="hud-coins">0</b></span>
      </div>
    </header>

    <main>
      <!-- パズル画面 -->
      <section id="screen-puzzle" class="screen active">
        <div class="score-row">
          <div class="score-box">
            <span class="label" data-msg="puzzle.score"></span>
            <span id="score" class="num">0</span>
          </div>
          <div class="score-mid">
            <div id="combo" class="combo"></div>
            <div class="mini-btns">
              <button id="undo-btn" class="mini-btn" type="button" data-msg="puzzle.undo" hidden></button>
              <button id="shuffle-btn" class="mini-btn" type="button" data-msg="puzzle.shuffle" hidden></button>
            </div>
          </div>
          <div class="score-box">
            <span class="label" data-msg="puzzle.best"></span>
            <span id="best" class="num">0</span>
          </div>
        </div>
        <!-- 次の目標（畑で次に必要なこと）を1行で -->
        <button id="goal" class="goal" type="button"></button>
        <div id="board" class="board"></div>
        <div id="tray" class="tray">
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
      </section>

      <!-- 畑画面（中身は js/farm.js が組み立てる） -->
      <section id="screen-farm" class="screen">
        <div id="farm"></div>
      </section>

      <!-- 図鑑画面（中身は js/zukan.js が組み立てる） -->
      <section id="screen-zukan" class="screen">
        <div id="zukan"></div>
      </section>
    </main>
  </div>

  <!-- 画面切り替えのタブ -->
  <nav class="tabs">
    <button class="tab active" data-screen="puzzle"><span class="tab-icon">🧩</span><span data-msg="tabs.puzzle"></span></button>
    <button class="tab" data-screen="farm"><span class="tab-icon">🌱</span><span data-msg="tabs.farm"></span><span class="badge"></span></button>
    <button class="tab" data-screen="zukan"><span class="tab-icon">📖</span><span data-msg="tabs.zukan"></span></button>
  </nav>

  <!-- お知らせ -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ダイアログ（ゲームオーバーなどで使い回す） -->
  <div id="modal" class="modal-bg hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 class="modal-title"></h2>
      <div class="modal-body"></div>
      <div class="modal-buttons"></div>
    </div>
  </div>

  <!-- データが読めなかったとき（ファイルを直接開いた場合など） -->
  <div id="load-error" class="load-error" hidden>
    <p>データを読み込めませんでした。</p>
    <p>このゲームは JSON ファイルを読み込むため、<br>ローカルサーバー経由で開いてください。<br>（README.md を参照）</p>
  </div>

  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/howto.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/zukan.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
