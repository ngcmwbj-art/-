  // 横転：車体の前後の軸まわりに回す。横から見ると側面が縦につぶれ、屋根や車の底が見えてくる
  const TRUCK_DEPTH = 40;
  function drawRolling(sp) {
    const phi = sp.roll, c = Math.cos(phi), s = Math.sin(phi), D = TRUCK_DEPTH;
    const support = 26 * Math.abs(c) + (D / 2) * Math.abs(s);   // 地面から車体の中心までの高さ
    ctx.translate(sp.x + TRUCK_W / 2, sp.y - support);
    ctx.rotate(sp.angle);
    // 高さ h（中心から上向き）・奥行き z の点が、画面のどこに来るか
    const Y = (h, z) => -(h * c) + z * s;
    const band = (x0, x1, h, fill, stroke) => {
      const y0 = Y(h, -D / 2), y1 = Y(h, D / 2);
      ctx.fillStyle = fill;
      ctx.fillRect(x0 - TRUCK_W / 2, Math.min(y0, y1), x1 - x0, Math.abs(y1 - y0));
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.strokeRect(x0 - TRUCK_W / 2, Math.min(y0, y1), x1 - x0, Math.abs(y1 - y0)); }
    };
    if (s > 0.03) {
      // 上の面：キャブの屋根と、上から見た荷台（トマト）
      band(61, 86, 26, '#e9ecec', '#c3c9cb');
      band(86, 95, 8, '#dfe3e3');
      band(2, 60, 6, '#d6dada', '#aeb5b8');
      const y0 = Y(6, -D / 2 + 4), y1 = Y(6, D / 2 - 4);
      ctx.fillStyle = '#7d8386';
      ctx.fillRect(5 - TRUCK_W / 2, Math.min(y0, y1), 52, Math.abs(y1 - y0));
      const n = Math.min(sp.load, 12);
      ctx.fillStyle = '#e0392b';
      for (let i = 0; i < n; i++) {
        const tx = 10 + (i % 6) * 8.5 - TRUCK_W / 2, tz = (i < 6 ? -1 : 1) * D * 0.18;
        ctx.beginPath(); ctx.ellipse(tx, Y(6, tz), 3.6, Math.max(1, 3.6 * Math.abs(s)), 0, 0, Math.PI * 2); ctx.fill();
      }
      if (sp.mud) { ctx.globalAlpha = 0.6 * sp.mud; ctx.fillStyle = '#4f341b'; ctx.fillRect(62 - TRUCK_W / 2, Math.min(Y(26, -D / 2), Y(26, D / 2)), 10, Math.abs(D * s) * 0.6); ctx.globalAlpha = 1; }
    } else if (s < -0.03) {
      // 車の底：シャシーと車軸、4本のタイヤ
      band(4, 94, -17, '#2c2c2c');
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      for (const wx of [20, 78]) {
        ctx.beginPath(); ctx.moveTo(wx - TRUCK_W / 2, Y(-18, -D / 2)); ctx.lineTo(wx - TRUCK_W / 2, Y(-18, D / 2)); ctx.stroke();
        for (const z of [-D / 2 + 5, D / 2 - 5]) {
          const ya = Y(-22, z - 5), yb = Y(-22, z + 5);
          ctx.fillStyle = '#141414';
          ctx.fillRect(wx - 10 - TRUCK_W / 2, Math.min(ya, yb), 20, Math.max(1.5, Math.abs(yb - ya)));
        }
      }
      ctx.fillStyle = '#3d3d3d';
      ctx.fillRect(40 - TRUCK_W / 2, Math.min(Y(-18, -4), Y(-18, 4)), 30, Math.max(1, Math.abs(8 * s)));
      if (sp.mud) { ctx.globalAlpha = 0.7 * sp.mud; ctx.fillStyle = '#5f4124'; ctx.fillRect(4 - TRUCK_W / 2, Math.min(Y(-17, -D / 2), Y(-17, D / 2)), 90, Math.abs(D * s) * 0.5); ctx.globalAlpha = 1; }
    }
    // 側面：手前の面（c > 0）か、裏返った向こう側の面（c < 0）
    if (Math.abs(c) > 0.03) {
      ctx.save();
      ctx.translate(0, (c > 0 ? D / 2 : -D / 2) * s);
      ctx.scale(1, c);
      ctx.translate(-TRUCK_W / 2, 26);
      drawTruckBody(sp);
      ctx.restore();
    }
  }

  // ---- ゴースト（タイムアタックの自己ベストの走り） ----
  function ghostFrame(t) {
    const f = ghost.f, n = f.length / 3;
    const x = t / ghost.dt;
    const i = Math.min(n - 1, Math.floor(x)), j = Math.min(n - 1, i + 1), u = Math.min(1, x - i);
    return { cam: f[i * 3] + (f[j * 3] - f[i * 3]) * u, y: f[i * 3 + 1] + (f[j * 3 + 1] - f[i * 3 + 1]) * u, a: (f[i * 3 + 2] + (f[j * 3 + 2] - f[i * 3 + 2]) * u) / 100 };
  }
  // ゴーストがその地点を通った時刻
  function ghostTimeAt(c) {
    const f = ghost.f, n = f.length / 3;
    if (c <= f[0]) return 0;
    if (c >= f[(n - 1) * 3]) return ghost.t;
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (f[mid * 3] <= c) lo = mid; else hi = mid; }
    const c0 = f[lo * 3], c1 = f[hi * 3];
    return (lo + (c1 > c0 ? (c - c0) / (c1 - c0) : 0)) * ghost.dt;
  }
  function drawGhost() {
    if (mode !== 'ta' || !ghost || state === 'title' || state === 'over') return;
    const g = ghostFrame(state === 'goal' ? goalTime : runTime);
    const sx = g.cam - cam + TRUCK_X;
    if (sx > -TRUCK_W && sx < W) {
      ctx.save();
      ctx.globalAlpha = 0.38;
      drawTruck({ x: sx, y: g.y, angle: g.a, pivot: 0, wob: 0, squash: 0, dent: 0, flat: false, load: TOMATO_MAX, shadow: false });
      ctx.restore();
      label('ベスト', sx + TRUCK_W / 2, g.y - 72, '12px ' + FONT, 'rgba(255,251,234,.85)', 'center', 'rgba(27,34,22,.6)', 3);
    } else {
      const dm = Math.round((g.cam - cam) / PX_PER_M);
      const ahead = dm > 0;
      label(ahead ? `ベストの軽トラ ${dm} m 先 ▶` : `◀ ベストの軽トラ ${-dm} m 後ろ`, ahead ? W - 14 : 14, GROUND - 96,
        '13px ' + FONT, 'rgba(255,251,234,.9)', ahead ? 'right' : 'left', 'rgba(27,34,22,.75)', 3);
    }
  }

  function drawRipples() {
    const t = truck.fallT - truck.splashT;
    const x = truckX + TRUCK_W / 2, y = WATER_Y + 1;
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      const k = t * 1.2 - i * 0.25;
      if (k <= 0 || k > 1) continue;
      ctx.strokeStyle = `rgba(220,205,180,${0.6 * (1 - k)})`;
      ctx.beginPath(); ctx.ellipse(x, y, 20 + k * 70, 2 + k * 4, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // 夜はあたりを暗くして、ヘッドライトで前を照らす
  function drawNight() {
    const n = env.night;
    if (n <= 0.01) return;
    ctx.fillStyle = `rgba(8,12,35,${n * 0.42})`;
    ctx.fillRect(-20, -(VH - H) - camY - 20, W + 40, VH + 40);
    if (n < 0.3 || truck.falling) return;
    const hx = truckX + TRUCK_W - 2, hy = truck.y - 22;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(hx, 0, hx + 340, 0);
    g.addColorStop(0, `rgba(255,236,170,${0.34 * n})`);
    g.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(hx, hy - 3); ctx.lineTo(hx + 340, hy - 46); ctx.lineTo(hx + 340, hy + 70); ctx.lineTo(hx, hy + 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(255,240,190,${0.5 * n})`;
    ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ボコボコになった車体：へこみの影、窓のひび、荷台のゆがみ
  function drawDents() {
    ctx.strokeStyle = 'rgba(80,85,90,.75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(78, -26); ctx.quadraticCurveTo(82, -22, 78, -17);
    ctx.moveTo(67, -22); ctx.quadraticCurveTo(71, -19, 68, -15);
    ctx.moveTo(30, -29); ctx.quadraticCurveTo(34, -24, 29, -19);
    ctx.moveTo(8, -30); ctx.quadraticCurveTo(12, -26, 9, -21);
    ctx.stroke();
    ctx.fillStyle = 'rgba(80,85,90,.25)';
    ctx.beginPath(); ctx.ellipse(80, -21, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(32, -24, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    // 窓のひび
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(80, -40); ctx.lineTo(76, -44); ctx.lineTo(72, -42);
    ctx.moveTo(80, -40); ctx.lineTo(83, -35);
    ctx.moveTo(80, -40); ctx.lineTo(75, -36); ctx.lineTo(70, -37);
    ctx.moveTo(80, -40); ctx.lineTo(79, -47);
    ctx.stroke();
  }

  function drawParts() {
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * (p.tomato || p.stick ? 3 : 1)));
      ctx.fillStyle = p.col;
      ctx.beginPath();
      if (p.stick) {
        // 泥のしぶき：飛んでいる間は伸び、着いたら平たくつぶれる
        if (p.flat) ctx.ellipse(p.x - cam, p.y, p.r * 1.5, p.r * 0.5, 0, 0, Math.PI * 2);
        else ctx.ellipse(p.x - cam, p.y, p.r, p.r * (1 + Math.min(1.2, Math.abs(p.vy) / 500)), Math.atan2(p.vy, p.vx) - Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
        if (!p.flat && p.r > 3.5) { ctx.fillStyle = 'rgba(255,235,210,.35)'; ctx.beginPath(); ctx.arc(p.x - cam - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.3, 0, Math.PI * 2); ctx.fill(); }
      } else { ctx.arc(p.x - cam, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
      if (p.tomato) { ctx.fillStyle = '#3f8a2a'; ctx.fillRect(p.x - cam - 1.5, p.y - p.r - 1, 3, 2); }
    }
    ctx.globalAlpha = 1;
  }

  // 縁取りつきの文字（空・雲・田んぼのどこでも読める）
  function label(text, x, y, font, fill, align = 'left', stroke = 'rgba(27,34,22,.85)', lw = 5) {
    ctx.font = font;
    ctx.textAlign = align;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawHUD() {
    if (state === 'title' || state === 'over') return;
    const m = meters();
    const t = state === 'goal' ? goalTime : runTime;
    // 2段ジャンプで軽トラが左上の表示に重なるときは、表示を薄くして軽トラを見せる
    const truckTop = truck.y + (VH - H) + camY - 70;
    ctx.globalAlpha = clamp((truckTop - 55) / 70, 0.25, 1);
    if (mode === 'ta') {
      label(fmtTime(t), 22, 56, '44px ' + FONT, '#fffbea', 'left', 'rgba(27,34,22,.85)', 7);
      let sub, col = '#fffbea';
      if (state === 'goal') { sub = 'ゴール!'; col = '#f2b33d'; }
      else sub = `ゴールまで ${fmtM(Math.max(0, GOAL_M - m))} m`;
      label(sub, 24, 82, '15px ' + FONT, col, 'left', 'rgba(27,34,22,.85)', 4);
      if (ghost) {
        const diff = (state === 'goal' ? goalTime : runTime) - ghostTimeAt(cam);
        const w = ctx.measureText(sub).width;
        label(`ベスト比 ${diff >= 0 ? '+' : '−'}${Math.abs(diff).toFixed(2)}`, 36 + w, 82, '15px ' + FONT,
          diff > 0.005 ? '#ff8f7a' : '#a8e27f', 'left', 'rgba(27,34,22,.85)', 4);
      }
      drawProgress(Math.min(1, m / GOAL_M));
    } else {
      const ms = fmtM(m);
      label(ms, 22, 56, '44px ' + FONT, '#fffbea', 'left', 'rgba(27,34,22,.85)', 7);
      const numW = ctx.measureText(ms).width;
      label('m', 28 + numW, 56, '22px ' + FONT, '#fffbea');
      let sub, subCol = '#fffbea';
      if (best <= 0) sub = 'はじめての走行';
      else if (m <= best) sub = 'ベストまで あと ' + fmtM(best - m) + ' m';
      else { sub = 'ベスト更新中 +' + fmtM(m - best) + ' m'; subCol = '#f2b33d'; }
      label(sub + '  ' + fmtTime(t), 24, 82, '15px ' + FONT, subCol, 'left', 'rgba(27,34,22,.85)', 4);
    }
    drawTires();
    ctx.globalAlpha = 1;
    drawSpeedo();

    if (banner) {
      const bt = banner.t;
      const a = Math.min(1, bt / 0.3);
      const pop = reduceMotion ? 1 : 1 + Math.max(0, bt - 1.35) * 1.6;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.translate(W / 2, 150);
      ctx.scale(pop, pop);
      label(banner.text, 0, 0, bold(44), banner.color, 'center', 'rgba(27,34,22,.9)', 8);
      if (banner.sub) label(banner.sub, 0, 30, '18px ' + FONT, '#f2b33d', 'center', 'rgba(27,34,22,.9)', 5);
      ctx.restore();
    }
    const top = VH - H;
    let py = truck.y + top + camY - 76;
    if (slip > 0 && state === 'play') { label('スリップ! 減速', TRUCK_X + TRUCK_W / 2, py, '20px ' + FONT, '#ffb49f', 'center'); py -= 24; }
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.t / 0.3);
      label(p.text, TRUCK_X + TRUCK_W / 2, py - (1.1 - p.t) * 30, '18px ' + FONT, p.color, 'center');
      ctx.globalAlpha = 1;
      py -= 24;
    }
  }

  // タイヤの残り（ボコボコ道に乗るたび1つ減る）
  function drawTires() {
    const x0 = 24, y0 = mode === 'ta' ? 112 : 106;
    label('タイヤ', x0, y0 + 5, '13px ' + FONT, '#fffbea', 'left', 'rgba(27,34,22,.85)', 4);
    const shakeX = tireFlash > 0 && !reduceMotion ? Math.sin(tireFlash * 40) * 2 : 0;
    for (let i = 0; i < BUMP_LIMIT; i++) {
      const cx = x0 + 60 + i * 22 + shakeX, cy = y0;
      const ok = i < BUMP_LIMIT - bumpHits;
      ctx.fillStyle = 'rgba(27,34,22,.85)';
      ctx.beginPath(); ctx.arc(cx, cy, 9.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = ok ? '#2a2a2a' : '#5b2a22';
      ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = ok ? '#c9cfd1' : '#e2543a';
      ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();
      if (!ok) {
        ctx.strokeStyle = '#e2543a';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx - 6, cy - 6); ctx.lineTo(cx + 6, cy + 6); ctx.stroke();
      }
    }
    // 荷台のトマトの数（エンドレスは配達スコアも）
    const tx = x0 + 60 + BUMP_LIMIT * 22 + 16;
    ctx.fillStyle = 'rgba(27,34,22,.85)';
    ctx.beginPath(); ctx.arc(tx, y0, 9.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e0392b';
    ctx.beginPath(); ctx.arc(tx, y0 + 1, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3f8a2a';
    ctx.fillRect(tx - 3, y0 - 7, 6, 2.5);
    label('×' + tomatoes, tx + 12, y0 + 5, '15px ' + FONT, tomatoes <= 5 ? '#ff8f7a' : '#fffbea', 'left', 'rgba(27,34,22,.85)', 4);
    if (mode === 'endless') {
      label(`スコア ${fmtM(score)}`, tx + 48, y0 + 5, '15px ' + FONT, '#f2b33d', 'left', 'rgba(27,34,22,.85)', 4);
    }
  }

  // タイムアタックの進み具合（画面上の中央）
  function drawProgress(f) {
    const x0 = 260, x1 = 540, y = 36;
    ctx.fillStyle = 'rgba(27,34,22,.7)';
    ctx.beginPath(); ctx.roundRect(x0 - 8, y - 9, x1 - x0 + 16, 18, 9); ctx.fill();
    ctx.fillStyle = 'rgba(246,239,217,.25)';
    ctx.fillRect(x0, y - 2, x1 - x0, 4);
    ctx.fillStyle = '#f2b33d';
    ctx.fillRect(x0, y - 2, (x1 - x0) * f, 4);
    for (let i = 1; i < 10; i++) { ctx.fillStyle = 'rgba(246,239,217,.4)'; ctx.fillRect(x0 + (x1 - x0) * i / 10 - 0.5, y - 5, 1, 10); }
    // ゴール旗
    ctx.fillStyle = '#e2543a';
    ctx.fillRect(x1, y - 14, 2, 16);
    ctx.beginPath(); ctx.moveTo(x1 + 2, y - 14); ctx.lineTo(x1 + 14, y - 10); ctx.lineTo(x1 + 2, y - 6); ctx.fill();
    // 軽トラの点
    ctx.fillStyle = '#fffbea';
    ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * f, y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e0392b';
    ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * f, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // 右下の速度計（0〜120 km/h）
  function drawSpeedo() {
    const k = kmh(vel);
    const cx = W - 70, cy = VH - 18, r = 46;
    ctx.fillStyle = 'rgba(27,34,22,.72)';
    ctx.beginPath(); ctx.arc(cx, cy, r + 8, Math.PI, 0); ctx.closePath(); ctx.fill();
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI + (i / 12) * Math.PI;
      const r0 = i % 2 === 0 ? r - 9 : r - 5;
      ctx.strokeStyle = i >= 10 ? '#e2543a' : 'rgba(246,239,217,.8)';
      ctx.lineWidth = i % 2 === 0 ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.stroke();
    }
    // 巡航速度の目印（減速していると針が下がる）
    if (state === 'play') {
      const ca = Math.PI + Math.min(1, kmh(speed) / 120) * Math.PI;
      ctx.fillStyle = 'rgba(246,239,217,.6)';
      ctx.beginPath(); ctx.arc(cx + Math.cos(ca) * (r + 3), cy + Math.sin(ca) * (r + 3), 2.5, 0, Math.PI * 2); ctx.fill();
    }
    const slowed = state === 'play' && vel < speed * 0.9;
    const na = Math.PI + Math.min(1, k / 120) * Math.PI;
    ctx.strokeStyle = slowed ? '#ff8f7a' : '#f2b33d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(na) * (r - 6), cy + Math.sin(na) * (r - 6));
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = slowed ? '#ff8f7a' : '#fffbea';
    ctx.textAlign = 'center';
    ctx.font = '18px ' + FONT;
    ctx.fillText(String(k), cx, cy - 16);
    ctx.font = '10px ' + FONT;
    ctx.fillStyle = 'rgba(246,239,217,.7)';
    ctx.fillText('km/h', cx, cy - 4);
  }

  function draw() {
    ctx = mainCtx;
    env = envAt(state === 'title' ? 350 : cam / PX_PER_M);
    ctx.save();
    ctx.translate(0, VH - H);
    if (shake > 0 && !reduceMotion) ctx.translate(rand(-6, 6) * shake * 2, rand(-6, 6) * shake * 2);
    drawSky();
    drawMountains(0.08, 205, 50, env.mtnFar, 0);
    drawMountains(0.18, 228, 34, env.mtnNear, 3);
    drawFarField();
    ctx.translate(0, camY);
    drawRoad();
    drawMarkers();
    drawHazards();
    drawGhost();
    drawTruck(mainTruckSpec());
    if (truck.falling && truck.pit) {
      ctx.save();
      ctx.translate(0, -(truck.pit.lv || 0));
      if (truck.y + (truck.pit.lv || 0) > WATER_Y) drawPitWater();
      if (truck.splashed) drawRipples();
      ctx.restore();
    }
    drawBoars();
    drawParts();
    drawNight();
    drawCallouts();
    drawStepWarning();
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,250,235,${flash * 2})`;
      ctx.fillRect(0, 0, W, VH);
    }
    drawHUD();
  }

  // ---- タイトルの障害物アイコン ----
  function drawIcons() {
    const saveCam = cam;
    for (const c of document.querySelectorAll('canvas[data-icon]')) {
      ctx = c.getContext('2d');
      const kind = c.dataset.icon;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.translate(0, 44 - GROUND);   // 道の表面を y=44 に
      cam = 0;
      if (kind === 'gap') { roadStrip(-4, 30); roadStrip(92, 124); mudPit(30, 92, 3); }
      else if (kind === 'puddle') { roadStrip(-4, 124); drawPuddle(26, 70); }
      else if (kind === 'bump') { roadStrip(-4, 124); drawBumps(8, 104, 7); }
      else if (kind === 'boar') { roadStrip(-4, 124); drawBoar(64, GROUND, 1, 0); }
    }
    cam = saveCam;
    ctx = mainCtx;
  }

  // ---- ループ ----
  let last = performance.now();
  let simMode = false;   // 試運転用：true の間はループが更新しない
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!simMode && !paused) update(dt);
    clock += dt;
    draw();
    requestAnimationFrame(frame);
  }

  // 試運転用のフック（URL末尾が #debug のときだけ）
  if (location.hash === '#debug') {
    window.__kt = {
      get state() { return state; }, get truck() { return truck; }, get obs() { return obs; },
      get cam() { return cam; }, get speed() { return speed; }, get vel() { return vel; }, get slip() { return slip; },
      get stats() { return stats; }, get paused() { return paused; }, get bumpHits() { return bumpHits; },
      get runTime() { return runTime; }, get goalTime() { return goalTime; }, get mode() { return mode; },
      get tomatoes() { return tomatoes; }, get score() { return score; }, get steps() { return steps; },
      get audio() { return { state: ac && ac.state, music: musicBus && +musicBus.gain.value.toFixed(2), step: mStep }; },
      suspendAudio() { return ac && ac.suspend(); }, get clock() { return clock; },
      TRUCK_X, TRUCK_W, W, JUMP_V, GRAV, meters, press, release, start, update, draw, setPaused,
      set sim(v) { simMode = v; }, set best(v) { best = v; },
    };
  }

  // ---- ページが新しい版に差し替わっても、走っている途中から続けられるようにする ----
  function snapshotRun() {
    if (state !== 'play' || truck.falling || truck.dead) return { mode };
    return {
      mode,
      run: {
        cam, speed, vel, runTime, nextX, slip, tomatoes, score, scoreM, lastRefill, bumpHits, lastMile, passedBest, seasonIdx, recT,
        truck: { y: truck.y, vy: truck.vy, grounded: truck.grounded, airJumps: truck.airJumps, spilled: truck.spilled },
        obs: JSON.parse(JSON.stringify(obs)), steps: JSON.parse(JSON.stringify(steps)),
        stats: { ...stats }, ghostRec: ghostRec.slice(), rngState: rng.getState ? rng.getState() : null,
      },
    };
  }
  function restoreRun(run) {
    rng = mode === 'ta' ? seeded(TA_SEED) : Math.random;
    if (run.rngState !== null && rng.setState) rng.setState(run.rngState);
    reset();
    cam = run.cam; speed = run.speed; vel = run.vel; runTime = run.runTime; nextX = run.nextX; slip = run.slip;
    tomatoes = run.tomatoes; score = run.score; scoreM = run.scoreM; lastRefill = run.lastRefill; bumpHits = run.bumpHits;
    lastMile = run.lastMile; passedBest = run.passedBest; seasonIdx = run.seasonIdx; recT = run.recT;
    Object.assign(truck, run.truck);
    obs = run.obs || []; steps = run.steps || []; stats = { ...stats, ...run.stats }; ghostRec = run.ghostRec || [];
    state = 'play';
    titleEl.hidden = true;
    truckX = TRUCK_X;
    renderPad();
    // 一時停止した状態で戻す。「再開」で続きから走れる
    setPaused(true);
    $('pauseM').textContent = `新しい版に更新しました。${mode === 'ta' ? fmtTime(runTime) + ' ／ ' : ''}${fmtM(meters())} m 地点から続けられます`;
  }
  function boot(data) {
    if (!data || !data.run) return;
    mode = data.mode === 'ta' ? 'ta' : 'endless';
    setMode(mode);
    try { restoreRun(data.run); } catch (e) { reset(); state = 'title'; titleEl.hidden = false; }
  }
  reset();
  setMode(mode);
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(snapshotRun); } catch (e) {} }
  if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);
  resize();
  renderTitleBest();
  drawIcons();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawIcons);
  requestAnimationFrame(frame);
})();
</script>
