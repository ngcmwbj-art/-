<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>軽トラ走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap">
<style>
/* 画面いっぱいのゲーム。キャンバスの上にHTMLのメニューを重ねる。色は夕方の田んぼ道で統一（単一テーマ） */
:root {
  --night: #1b2216;       /* ページの地：暗いあぜの土色 */
  --panel: #26301d;
  --panel-edge: #4b5a36;
  --ink: #f6efd9;         /* 文字：わら色がかった白 */
  --muted: #bdb79c;
  --accent: #f2b33d;      /* 稲穂の黄色 */
  --accent-deep: #a8700f;
  --danger: #e2543a;      /* トマトの赤 */
  --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-pixel: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-pixel);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
[hidden] { display: none !important; }

.app {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.app.portrait { justify-content: flex-start; padding-top: max(24px, env(safe-area-inset-top, 0px)); }
.stage {
  position: relative;
  container-type: size;
  overflow: hidden;
  touch-action: none;
  background: #8fd0e8;
  border-radius: 8px;
  box-shadow: 0 14px 50px rgba(0, 0, 0, .5);
}
.stage.compact { border-radius: 0; box-shadow: none; }
canvas { display: block; width: 100%; height: 100%; }

/* ---- 右上のボタン ---- */
.tools {
  position: absolute;
  top: 2.2cqh;
  right: 1.6cqw;
  display: flex;
  gap: 1cqw;
  z-index: 3;
}
.icon-btn {
  width: max(34px, 5.4cqw);
  height: max(34px, 5.4cqw);
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--ink);
  background: rgba(27, 34, 22, .55);
  border: 2px solid rgba(246, 239, 217, .35);
  border-radius: 10px;
  cursor: pointer;
}
.icon-btn svg { width: 55%; height: 55%; }
.icon-btn:hover { background: rgba(27, 34, 22, .75); }
.icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---- 重ねるメニュー ---- */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4cqh 5cqw;
  box-sizing: border-box;
}
.btn {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(16px, 3.4cqw, 30px);
  letter-spacing: .08em;
  color: #2a1d08;
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  padding: .42em 1.5em;
  cursor: pointer;
  box-shadow: 0 .18em 0 var(--accent-deep);
}
.btn:active { transform: translateY(.14em); box-shadow: 0 .04em 0 var(--accent-deep); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.btn.ghost {
  color: var(--ink);
  background: transparent;
  box-shadow: inset 0 0 0 2px rgba(246, 239, 217, .45);
}

/* タイトル：左に寄せて、右側の軽トラと空を見せる */
#title {
  justify-content: flex-start;
  background: linear-gradient(90deg, rgba(27, 34, 22, .88) 0%, rgba(27, 34, 22, .7) 50%, rgba(27, 34, 22, 0) 80%);
}
.title-col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2.2cqh;
  max-width: 64cqw;
}
.eyebrow {
  margin: 0;
  font-size: clamp(10px, 1.7cqw, 15px);
  letter-spacing: .3em;
  color: var(--accent);
}
.logo {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(36px, 10cqw, 104px);
  line-height: .95;
  letter-spacing: -.01em;
  color: var(--ink);
  margin: 0;
  transform: skewX(-9deg);
  transform-origin: left bottom;
  text-shadow: .045em .045em 0 var(--danger), .09em .09em 0 rgba(0, 0, 0, .35);
}
.legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.1cqh 2.4cqw;
}
.legend li { display: flex; align-items: center; gap: 1.2cqw; min-width: 0; }
.legend canvas {
  flex: none;
  width: clamp(40px, 7.2cqw, 70px);
  height: auto;
  aspect-ratio: 5 / 3;
  background: rgba(143, 208, 232, .18);
  border-radius: 6px;
}
.legend span { font-size: clamp(10px, 1.55cqw, 14px); color: var(--muted); line-height: 1.35; }
.legend b { display: block; color: var(--ink); font-weight: normal; font-size: 1.12em; }

/* モード選択 */
.modes { display: flex; gap: 1.8cqw; flex-wrap: wrap; }
.mode {
  display: grid;
  gap: .2em;
  justify-items: start;
  text-align: left;
  min-width: 12em;
  font-family: var(--font-pixel);
  font-size: clamp(10px, 1.55cqw, 14px);
  color: var(--ink);
  background: rgba(27, 34, 22, .6);
  border: 2px solid rgba(246, 239, 217, .35);
  border-radius: 14px;
  padding: .7em 1.1em .75em;
  cursor: pointer;
  box-shadow: 0 .3em 0 rgba(0, 0, 0, .35);
}
.mode:active { transform: translateY(.2em); box-shadow: 0 .1em 0 rgba(0, 0, 0, .35); }
.mode:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.mode.selected { background: var(--accent); border-color: var(--accent); color: #2a1d08; box-shadow: 0 .3em 0 var(--accent-deep); }
.mode-name { font-family: var(--font-display); font-weight: 900; font-size: 1.75em; letter-spacing: .05em; line-height: 1.1; }
.mode-desc { opacity: .8; }
.mode-best { font-variant-numeric: tabular-nums; }
.mode-best b { font-weight: normal; }
.howto { margin: 0; font-size: clamp(10px, 1.5cqw, 14px); color: var(--muted); }
.howto kbd {
  font-family: inherit;
  color: var(--ink);
  padding: 0 .4em;
  border: 1px solid rgba(246, 239, 217, .4);
  border-bottom-width: 2px;
  border-radius: 4px;
}

/* ゲームオーバー／一時停止：中央のカード */
.dim { background: rgba(27, 34, 22, .5); }
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.3cqh;
  text-align: center;
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  border-radius: 14px;
  padding: 4.2cqh 4.4cqw 3.2cqh;
  box-shadow: 0 .6cqh 0 rgba(0, 0, 0, .35);
  max-width: 88cqw;
  max-height: 94cqh;
  box-sizing: border-box;
  animation: pop .28s cubic-bezier(.2, 1.4, .4, 1) both;
}
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.reason {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(18px, min(4.2cqw, 8cqh), 46px);
  line-height: 1.1;
  color: var(--ink);
  text-shadow: .06em .06em 0 var(--danger);
}
.reason.win { text-shadow: .06em .06em 0 var(--accent-deep); color: var(--accent); }
.sub { margin: 0; font-size: clamp(11px, 1.8cqw, 16px); color: var(--muted); }
.result {
  margin: 0;
  font-size: clamp(30px, min(7cqw, 15cqh), 88px);
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.result small { font-size: .38em; color: var(--ink); margin-left: .15em; }
.ribbon {
  position: absolute;
  top: -1.1em;
  left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(12px, 2.2cqw, 20px);
  color: #fff;
  background: var(--danger);
  padding: .2em 1em;
  border-radius: 4px;
  white-space: nowrap;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .3);
}
.rank { margin: 0; font-size: clamp(11px, min(1.8cqw, 3.6cqh), 17px); color: var(--muted); }
.rank b { font-weight: normal; color: var(--ink); padding: .1em .6em; margin-left: .3em; border: 1px solid var(--panel-edge); border-radius: 999px; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0 3cqw;
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.stats div { display: flex; flex-direction: column-reverse; align-items: center; }
.stats dt { font-size: clamp(9px, 1.4cqw, 13px); color: var(--muted); }
.stats dd { margin: 0; font-size: clamp(13px, min(2.4cqw, 4.8cqh), 24px); color: var(--ink); white-space: nowrap; }
.btn-row { display: flex; gap: 2cqw; flex-wrap: wrap; justify-content: center; margin-top: .6cqh; }
.card .btn { font-size: clamp(15px, min(2.7cqw, 5.4cqh), 26px); }
.kbd-hint { margin: 0; font-size: clamp(9px, 1.35cqw, 12px); color: var(--muted); }

/* 縦持ちのとき：ゲームの下を親指で押すパッドにする */
.pad {
  flex: 1;
  width: calc(100% - 32px);
  max-height: 420px;
  min-height: 120px;
  margin-inline: 16px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 2px dashed rgba(246, 239, 217, .28);
  border-radius: 20px;
  color: var(--muted);
  touch-action: none;
}
.pad.on { background: rgba(242, 179, 61, .12); border-color: var(--accent); }
.pad-main { font-family: var(--font-display); font-weight: 900; font-size: 22px; color: var(--ink); letter-spacing: .08em; }
.pad-sub { font-size: 13px; }
.rotate-hint {
  margin: 0;
  padding-inline: 16px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}
.rotate-hint b { color: var(--accent); font-weight: normal; }

.touch-only { display: none; }
@media (hover: none) and (pointer: coarse) {
  .touch-only { display: inline; }
  .kbd-only { display: none !important; }
}
/* 幅の狭い画面（縦持ちのスマホ）では説明を省く。障害物は走りながら吹き出しで説明する */
@container (max-width: 560px) {
  .legend, .mode-desc, .howto { display: none; }
  .title-col { gap: 3cqh; max-width: 92cqw; }
  .logo { font-size: 14cqw; }
  .mode { min-width: 0; font-size: 11px; }
  #title { background: linear-gradient(90deg, rgba(27, 34, 22, .85) 0%, rgba(27, 34, 22, .6) 60%, rgba(27, 34, 22, .1) 90%); }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="音を消す" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
          <path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
          <path class="mute" d="M16 9l6 6M22 9l-6 6" hidden/>
        </svg>
      </button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="一時停止" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>

    <div class="overlay" id="title">
      <div class="title-col">
        <p class="eyebrow">あぜ道ランナー</p>
        <h1 class="logo">軽トラ走!</h1>
        <ul class="legend">
          <li><canvas data-icon="gap" width="120" height="72"></canvas><span><b>泥の斜面</b>落ちたら転がって終わり</span></li>
          <li><canvas data-icon="boar" width="120" height="72"></canvas><span><b>イノシシ</b>ぶつかったら終わり</span></li>
          <li><canvas data-icon="puddle" width="120" height="72"></canvas><span><b>水たまり</b>滑って減速</span></li>
          <li><canvas data-icon="bump" width="120" height="72"></canvas><span><b>ボコボコ道</b>減速。3回乗るとパンク</span></li>
        </ul>
        <div class="modes">
          <button class="mode" type="button" data-mode="endless">
            <span class="mode-name">エンドレス</span>
            <span class="mode-desc">どこまで走れるか</span>
            <span class="mode-best" id="bestEndless">記録なし</span>
          </button>
          <button class="mode" type="button" data-mode="ta">
            <span class="mode-name">タイムアタック</span>
            <span class="mode-desc">1,000 m を最速で</span>
            <span class="mode-best" id="bestTa">記録なし</span>
          </button>
        </div>
        <p class="howto"><span class="touch-only">画面をタップで</span><span class="kbd-only">クリック か <kbd>Space</kbd> で</span>ジャンプ。長押しで高く跳ぶ</p>
      </div>
    </div>

    <div class="overlay dim" id="over" hidden>
      <div class="card">
        <span class="ribbon" id="newrec" hidden>自己ベスト更新!</span>
        <p class="reason" id="reason">泥の斜面を転げ落ちた!</p>
        <p class="sub" id="reasonSub"></p>
        <p class="result" id="result">0<small>m</small></p>
        <p class="rank" id="rankLine">称号 <b id="rankName">見習い運転手</b></p>
        <p class="sub" id="bestLine"></p>
        <dl class="stats" id="stats"></dl>
        <div class="btn-row">
          <button class="btn" id="retryBtn" type="button">もう一回</button>
          <button class="btn ghost" id="toTitleBtn" type="button">タイトル</button>
        </div>
        <p class="kbd-hint kbd-only">Space でもう一回 ／ Esc でタイトル</p>
      </div>
    </div>

    <div class="overlay dim" id="pause" hidden>
      <div class="card">
        <p class="reason">一時停止</p>
        <p class="sub" id="pauseM">0 m 地点</p>
        <div class="btn-row">
          <button class="btn" id="resumeBtn" type="button">再開</button>
          <button class="btn ghost" id="quitBtn" type="button">やめる</button>
        </div>
        <p class="kbd-hint kbd-only">P か Esc でも再開</p>
      </div>
    </div>
  </div>
  <div class="pad" id="pad" hidden>
    <span class="pad-main">タップでジャンプ</span>
    <span class="pad-sub">長押しで高く跳ぶ</span>
  </div>
  <p class="rotate-hint" id="rotateHint" hidden>横向きにすると<b>大きな画面</b>で遊べます</p>
</div>

<script>
(() => {
  'use strict';

  // ---- 定数 ----
  const W = 800, H = 450;        // 論理座標。縦に長い画面では空を上に足す
  const GROUND = 330;            // 道の表面
  const ROAD_H = 24;             // あぜ道の厚み
  const PIT_D = 46;              // 泥の穴の深さ
  const GRAV = 2300;
  const JUMP_V = 780;
  const AIR = 2 * JUMP_V / GRAV; // 目いっぱい跳んだときの滞空時間
  const TRUCK_X = 140;           // 画面上の軽トラの左端
  const TRUCK_W = 96;
  const TRUCK_FRONT = TRUCK_X + TRUCK_W;
  const PX_PER_M = 25;           // 25px = 1m
  const SLIP_TIME = 0.6;
  const MAX_SPEED = 760;
  const ACCEL = 170;             // 減速から立ち直る加速（px/s²）
  const BUMP_LIMIT = 3;          // ボコボコ道に何回乗るとパンクするか
  const GOAL_M = 1000;           // タイムアタックの距離

  const $ = id => document.getElementById(id);
  const app = $('app'), stage = $('stage'), cv = $('cv');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const titleEl = $('title'), overEl = $('over'), pauseEl = $('pause');
  const soundBtn = $('soundBtn'), pauseBtn = $('pauseBtn');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 保存 ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
  };
  let best = Number(store.get('keitora-best', 0)) || 0;               // エンドレスの最長距離（m）
  let bestTime = Number(store.get('keitora-best-time', 0)) || 0;      // タイムアタックの最速（秒）
  let soundOn = store.get('keitora-sound', '1') === '1';
  let mode = store.get('keitora-mode', 'endless') === 'ta' ? 'ta' : 'endless';

  const fmtM = m => m.toLocaleString('ja-JP');
  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = sec - m * 60;
    return m + ':' + s.toFixed(2).padStart(5, '0');
  }

  // ---- 音 ----
  let ac = null;
  function initAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol, freq, type = 'lowpass', delay = 0) {
    const t = ac.currentTime + delay;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(ac.destination);
    src.start(t);
  }
  function sfx(k) {
    if (!ac || !soundOn) return;
    try {
      if (k === 'jump') tone('square', 260, 620, 0.14, 0.07);
      else if (k === 'bump') tone('square', 140, 90, 0.06, 0.04);
      else if (k === 'clunk') { tone('square', 120, 60, 0.18, 0.09); noise(0.12, 0.15, 600); }
      else if (k === 'slip') { tone('sawtooth', 600, 140, 0.35, 0.05); noise(0.25, 0.12, 2500); }
      else if (k === 'warn') { tone('square', 900, 900, 0.08, 0.06); tone('square', 900, 900, 0.08, 0.06, 0.13); }
      else if (k === 'crash') { noise(0.5, 0.4, 900); tone('square', 180, 40, 0.4, 0.09); noise(0.3, 0.2, 3000, 'highpass', 0.05); }
      else if (k === 'mud') { noise(0.6, 0.3, 500); tone('sine', 220, 50, 0.5, 0.12); }
      else if (k === 'roll') { noise(0.18, 0.12, 400); }
      else if (k === 'pop') { noise(0.12, 0.45, 2000); noise(1.2, 0.12, 5000, 'highpass', 0.1); }
      else if (k === 'land') tone('square', 110, 70, 0.05, 0.04);
      else if (k === 'mile') { tone('square', 660, 660, 0.09, 0.05); tone('square', 990, 990, 0.14, 0.05, 0.09); }
      else if (k === 'record') { [523, 659, 784, 1046].forEach((f, i) => tone('square', f, f, 0.12, 0.05, i * 0.08)); }
      else if (k === 'goal') { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone('square', f, f, i === 5 ? 0.4 : 0.12, 0.06, i * 0.1)); }
      else if (k === 'dodge') tone('triangle', 500, 900, 0.1, 0.06);
      else if (k === 'ui') tone('square', 440, 440, 0.04, 0.03);
    } catch (e) {}
  }
  function renderSoundBtn() {
    soundBtn.querySelector('.wave').toggleAttribute('hidden', !soundOn);
    soundBtn.querySelector('.mute').toggleAttribute('hidden', soundOn);
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? '音を消す' : '音を出す');
  }

  // ---- 画面サイズ ----

  function resize() {

    const portrait = ah0 > aw0 * 1.1;
    const compact = Math.min(aw0, ah0) < 560 || portrait;

    let sw = aw, sh = aw * viewH / W;
    if (sh > ah) { sh = ah; sw = ah * W / viewH; }

    sw = Math.floor(sw); sh = Math.floor(sh);

    stage.style.height = sh + 'px';

    $('rotateHint').hidden = !portrait;

  // ---- ゲーム状態 ----

  let cam, speed, vel, runTime, truck, obs, parts, nextX, slip, shake, flash, jumpBuf, holding, dieT, wheelA;

  const seenTypes = new Set();   // このセッションで説明済みの障害物
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function reset() {

  const meters = () => Math.floor(cam / PX_PER_M);
  const kmh = v => Math.round(v / PX_PER_M * 3.6);
  const goalX = () => GOAL_M * PX_PER_M + TRUCK_FRONT;   // ゴールラインの位置（軽トラの鼻先が越えたらゴール）
  function cruise(m) {
    return m < 1700 ? Math.min(MAX_SPEED, 250 + m * 0.3) : Math.min(900, MAX_SPEED + (m - 1700) * 0.04);
  }

  // ---- コース生成 ----
  // 泥の穴の幅は「踏み切りの猶予時間」から決める。距離が伸びるほど猶予が短くなる
  function jumpWindow(m) {
    return m < 1150 ? 0.38 - m * 0.0002 : Math.max(0.1, 0.15 - (m - 1150) * 0.00003);
  }
  function spacing() {
    const m = cam / PX_PER_M;
    const dense = Math.max(0.62, 1 - m / 3500);
    return (170 + speed * 0.25 + Math.random() * speed * 0.9) * dense;
  }
  function pick(list) {
    let sum = 0; for (const [, w] of list) sum += w;
    let r = Math.random() * sum;
    for (const [k, w] of list) { if ((r -= w) < 0) return k; }
    return list[0][0];
  }
  function generate() {
    const limit = mode === 'ta' ? goalX() - 350 : Infinity;
    while (nextX < cam + W + 900 && nextX < limit) {
      const m = nextX / PX_PER_M;
      const sp = cruise(m);
      const type = m < 80
        ? pick([['gap', 70], ['puddle', 30]])
        : pick([['gap', 40], ['puddle', 20], ['bump', m > 150 ? 16 : 8], ['boar', m > 200 ? 18 : 0]]);
      if (type === 'gap') {
        // 減速していても跳べるよう、少し控えめの速度で幅を決める
        const w = Math.max(72, sp * 0.92 * (AIR - jumpWindow(m)) * rand(0.7, 1));
        if (nextX + w > limit) break;
        obs.push({ t: 'gap', x: nextX, w });
        nextX += w + spacing();
      } else if (type === 'puddle') {
        const w = rand(60, 130);
        obs.push({ t: 'puddle', x: nextX, w });
        nextX += w + sp * SLIP_TIME + 250 + Math.random() * sp * 0.5;
      } else if (type === 'bump') {
        // 跳び越えられる長さにする（上手に跳べばパンクしない）
        const w = sp * AIR * rand(0.35, 0.78);
        obs.push({ t: 'bump', x: nextX, w, seed: Math.random() * 100, hit: false });
        nextX += w + spacing() * 0.8 + sp * 0.8;
      } else {
        // イノシシは画面の右端から出てくるので、その手前を空けておく
        const bx = nextX + 650;
        if (bx + 220 > limit) break;
        obs.push({ t: 'boar', x: bx, w: 0, state: 'pending', px: 0, vx: 0, leg: 0, wt: 0, counted: false, fy: 0, fvy: 0, rot: 0 });
        nextX = bx + 220 + spacing();
      }
    }
    obs = obs.filter(o => (o.t === 'boar' ? (o.state !== 'gone') : (o.x + o.w > cam - 200)));
  }

  function find(t, wx) {
    for (const o of obs) if (o.t === t && wx > o.x && wx < o.x + o.w) return o;
    return null;
  }
  // 泥の穴の斜面の横幅と、x での泥の表面の高さ
  const pitRun = w => Math.min(34, w * 0.3);
  function pitSurface(pit, x) {
    const r = pitRun(pit.w), rel = x - pit.x;
    if (rel < r) return GROUND + clamp(rel / r, 0, 1) * PIT_D;
    if (rel > pit.w - r) return GROUND + clamp((pit.w - rel) / r, 0, 1) * PIT_D;
    return GROUND + PIT_D;
  }

  // ---- パーティクル・表示 ----
  function emit(n, wx, y, opt) {
    for (let i = 0; i < n; i++) {
      const life = rand(opt.life[0], opt.life[1]);
      parts.push({
        x: wx, y, vx: rand(opt.vx[0], opt.vx[1]), vy: rand(opt.vy[0], opt.vy[1]),
        life, max: life, r: rand(opt.r[0], opt.r[1]), col: opt.col, g: opt.g ?? 900, tomato: !!opt.tomato,
      });
    }
  }
  const spillTomatoes = (n, wx, y, vx) => emit(n, wx, y, { vx, vy: [-420, -150], life: [0.8, 1.4], r: [4, 6], col: '#e0392b', tomato: true });
  function showBanner(text, color, sub) { banner = { text, sub, color, t: 1.6 }; }
  function popup(text, color) { popups.push({ text, color, t: 1.1 }); }

  // ---- 入力 ----
  function press() {
    initAudio();
    if (paused) return;
    if (state === 'play') { jumpBuf = 0.12; holding = true; }
    else if (state === 'title') start(mode);
    else if (state === 'over' && dieT > 0.7) start(mode);
  }
  function release() {
    holding = false;
    if (state === 'play' && truck.jumped && truck.vy < -250) truck.vy *= 0.45;
  }
  app.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (state === 'over' && e.target.closest('.card')) return;
    if (paused) return;
    e.preventDefault();
    if (state === 'play') $('pad').classList.add('on');
    press();
  });
  const up = () => { $('pad').classList.remove('on'); release(); };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'play') { e.preventDefault(); setPaused(!paused); }
      else if (state === 'over' && e.code === 'Escape') toTitle();
      return;
    }
    if (state === 'title' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      setMode(mode === 'ta' ? 'endless' : 'ta');
      return;
    }
    if (JUMP_KEYS.includes(e.code) || (e.code === 'Enter' && !(e.target.closest && e.target.closest('button')))) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') release(); });
  for (const b of document.querySelectorAll('.mode')) {
    b.addEventListener('click', () => { initAudio(); start(b.dataset.mode); });
  }
  $('retryBtn').addEventListener('click', () => { initAudio(); start(mode); });
  $('toTitleBtn').addEventListener('click', () => toTitle());
  $('resumeBtn').addEventListener('click', () => setPaused(false));
  $('quitBtn').addEventListener('click', () => { setPaused(false); toTitle(); });
  pauseBtn.addEventListener('click', () => setPaused(!paused));
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPaused(true); });

  function setPaused(p) {
    if (state !== 'play') p = false;
    paused = p;
    pauseEl.hidden = !p;
    pauseBtn.hidden = p || state !== 'play';
    holding = false;
    if (p) $('pauseM').textContent = (mode === 'ta' ? fmtTime(runTime) + ' ／ ' : '') + fmtM(meters()) + ' m 地点';
    last = performance.now();
    sfx('ui');
  }
  function setMode(m) {
    mode = m;

    renderPad();
  }

  function start(m) {
    setMode(m);
    reset();
    state = 'play';
    paused = false;
    titleEl.hidden = true;
    overEl.hidden = true;
    pauseEl.hidden = true;
    pauseBtn.hidden = false;
    if (mode === 'ta') showBanner('スタート!', '#fffbea', 'ゴールまで 1,000 m');
    renderPad();
  }
  function toTitle() {
    reset();
    state = 'title';
    overEl.hidden = true;
    pauseEl.hidden = true;
    pauseBtn.hidden = true;
    renderTitleBest();
    titleEl.hidden = false;
    renderPad();
    focusIfKeyboard(document.querySelector('.mode.selected'));
  }
  function renderTitleBest() {
    $('bestEndless').innerHTML = best > 0 ? `ベスト <b>${fmtM(best)} m</b>` : '記録なし';
    $('bestTa').innerHTML = bestTime > 0 ? `ベスト <b>${fmtTime(bestTime)}</b>` : '記録なし';
  }

  // 称号
  const RANKS = [
    [0, '見習い運転手'], [150, '若葉マーク'], [300, '田植え帰り'], [500, 'あぜ道の常連'],
    [800, 'トマト運び名人'], [1200, '農道の韋駄天'], [1800, 'あぜ道マスター'], [2600, '伝説の軽トラ乗り'],
  ];
  const rankOf = m => RANKS.filter(([d]) => m >= d).pop()[1];
  const TA_RANKS = [[66.3, '伝説の軽トラ乗り'], [67.5, 'あぜ道マスター'], [69, '農道の韋駄天'], [71, 'トマト運び名人'], [74, 'あぜ道の常連'], [Infinity, '若葉マーク']];
  const taRankOf = t => TA_RANKS.find(([s]) => t <= s)[1];

  const REASONS = {
    fall: ['泥の斜面を転げ落ちた!', 'トマトが泥だらけ…'],
    boar: ['イノシシに激突!', '軽トラがボコボコ…'],
    flat: ['タイヤがパンクした!', 'ボコボコ道に 3 回乗り上げた'],
  };
  function die(kind) {
    if (state !== 'play') return;
    state = 'dying';
    dieT = 0;
    truck.dead = true;
    truck.deathKind = kind;
    pauseBtn.hidden = true;
    if (kind === 'boar') {

    } else if (kind === 'flat') {

    }
  }
  function finish() {
    state = 'goal';

  function statHTML(items) {

  }
  function showOver() {
    const endState = state;
    state = 'over';

    const reasonEl = $('reason');

      if (rec) { bestTime = goalTime; store.set('keitora-best-time', bestTime.toFixed(3)); }
      reasonEl.textContent = 'ゴール!';
      reasonEl.classList.add('win');
      $('reasonSub').textContent = '1,000 m 走りきった';

      $('bestLine').textContent = rec ? (prev > 0 ? `これまでのベスト ${fmtTime(prev)} を ${(prev - goalTime).toFixed(2)} 秒 縮めた` : 'はじめての記録')
        : `ベスト ${fmtTime(bestTime)}（+${(goalTime - bestTime).toFixed(2)} 秒）`;
      $('stats').innerHTML = statHTML([['最高速度', stats.maxKmh + ' km/h'], ['減速', stats.slows + ' 回'], ['イノシシ回避', stats.boars + ' 頭']]);
    } else {
      reasonEl.classList.remove('win');
      reasonEl.textContent = REASONS[truck.deathKind][0];
      $('reasonSub').textContent = REASONS[truck.deathKind][1];
      $('result').innerHTML = `${fmtM(m)}<small>m</small>`;
      if (mode === 'ta') {
        $('rankLine').hidden = true;
        $('bestLine').textContent = `リタイア。ゴールまで あと ${fmtM(Math.max(0, GOAL_M - m))} m`;
      } else {
        const prev = best;
        rec = m > best;
        if (rec) { best = m; store.set('keitora-best', best); }
        $('rankLine').hidden = false;
        $('rankName').textContent = rankOf(m);
        $('bestLine').textContent = !rec ? `ベスト ${fmtM(best)} m（あと ${fmtM(best - m)} m）`
          : prev > 0 ? `これまでのベスト ${fmtM(prev)} m を ${fmtM(m - prev)} m 更新` : 'はじめての記録';
      }
      $('stats').innerHTML = statHTML([['タイム', fmtTime(runTime)], ['最高速度', stats.maxKmh + ' km/h'], ['イノシシ回避', stats.boars + ' 頭']]);
    }
    $('newrec').hidden = !rec;
    overEl.hidden = false;
    renderPad();
    focusIfKeyboard($('retryBtn'));
  }

  // ---- 更新 ----
  function update(dt) {
    const tx = state === 'title' ? 560 : TRUCK_X;
    truckX += (tx - truckX) * Math.min(1, dt * (reduceMotion ? 60 : 5));
    if (state === 'title') { cam += 70 * dt; wheelA += 70 * dt / 11; updateParts(dt); return; }
    if (state === 'over') {
      dieT += dt;
      if (truck.dent && Math.random() < dt * 6) steam();
      updateParts(dt);
      return;
    }

    const cx = cam + TRUCK_X + TRUCK_W / 2;

    if (state === 'play') {
      runTime += dt;
      speed = cruise(meters());
      generate();
      const m = meters();
      if (Math.floor(m / 100) > lastMile) {
        lastMile = Math.floor(m / 100);
        if (!(mode === 'ta' && m >= GOAL_M)) {
          const left = mode === 'ta' ? `残り ${fmtM(GOAL_M - lastMile * 100)} m` : (lastMile % 5 === 0 ? 'スピードアップ!' : null);
          showBanner(lastMile * 100 + ' m', '#fffbea', left);
          sfx('mile');
        }
      }
      if (mode === 'endless' && !passedBest && m > best) {
        passedBest = true;
        showBanner('ベスト更新!', '#f2b33d');
        sfx('record');
      }
      if (mode === 'ta' && cam + TRUCK_FRONT >= goalX()) finish();
    }

    // 前進：普段は巡航速度へ加速、ボコボコ道の上では減速
    if (state === 'play') {
      let target = speed;
      if (find('bump', cx) && GROUND - truck.y < 40) target = speed * 0.4;
      vel += clamp(target - vel, -900 * dt, ACCEL * dt);
    } else if (state === 'goal') {
      vel *= Math.pow(0.3, dt);
    } else if (truck.falling) {
      truck.fallV *= Math.pow(0.3, dt);
      vel = truck.fallV;
    } else if (truck.flat) {
      vel *= Math.pow(0.05, dt);
      if (vel > 60 && Math.random() < dt * 30) emit(1, cam + TRUCK_FRONT - 18, GROUND - 2, { vx: [-80, -20], vy: [-80, -20], life: [0.3, 0.6], r: [3, 6], col: '#c7a77c', g: 60 });
    } else if (truck.dead) {
      vel = 0;
    }
    cam += vel * dt;
    wheelA += vel * dt / 11;
    if (state === 'play') stats.maxKmh = Math.max(stats.maxKmh, kmh(vel));

    // ジャンプ
    jumpBuf -= dt;
    truck.coyote -= dt;
    slip -= dt;
    tireFlash = Math.max(0, tireFlash - dt);
    if (state === 'play' && jumpBuf > 0 && truck.coyote > 0 && slip <= 0) {
      truck.vy = -JUMP_V * (find('bump', cx) ? 0.8 : 1);
      truck.grounded = false;
      truck.jumped = true;
      truck.coyote = 0;
      jumpBuf = 0;
      stats.jumps++;
      sfx('jump');
      emit(6, cam + TRUCK_X + 16, GROUND, { vx: [-160, -40], vy: [-160, -40], life: [0.3, 0.6], r: [3, 6], col: '#b89468' });
    }

    truck.squash = Math.max(0, truck.squash - dt * 5);
    if (truck.falling) updateFall(dt, cx);
    else {
      truck.vy += GRAV * dt;
      truck.y += truck.vy * dt;
      const hole = state === 'play' ? find('gap', cx) : null;
      if (hole) {
        truck.grounded = false;
        if (truck.y > GROUND + 8) {

          truck.pit = hole;
          truck.fallV = vel;
          truck.fallT = 0;
          truck.vy = Math.max(truck.vy, 100);
          die('fall');
        }
      } else if (truck.y >= GROUND) {
        if (!truck.grounded && truck.vy > 500) {
          sfx('land');
          truck.squash = 1;
          emit(8, cam + TRUCK_X + 20, GROUND, { vx: [-200, 40], vy: [-120, -20], life: [0.3, 0.6], r: [3, 6], col: '#b89468' });
        }
        truck.y = GROUND; truck.vy = 0;
        truck.grounded = true; truck.jumped = false;
        truck.coyote = 0.09;
      } else {
        truck.grounded = false;
      }

      if (state === 'play') {
        // ボコボコ道：乗り上げたら回数を数え、3回目でパンク
        const bo = truck.grounded ? find('bump', cx) : null;
        if (bo && !bo.hit) {
          bo.hit = true;
          bumpHits++;
          stats.slows++;
          tireFlash = 1;
          sfx('clunk');
          if (bumpHits >= BUMP_LIMIT) die('flat');
          else popup(`ガタン! パンクまで あと ${BUMP_LIMIT - bumpHits} 回`, '#ffb49f');
        }
        if (bo && state === 'play') {
          truck.bumpT -= dt;
          if (truck.bumpT <= 0) {
            truck.vy = -rand(90, 240);
            truck.grounded = false;
            truck.jumped = false;
            truck.bumpT = rand(0.1, 0.26);
            sfx('bump');
            emit(3, cam + TRUCK_X + 76, GROUND, { vx: [-120, 20], vy: [-150, -60], life: [0.2, 0.4], r: [2, 5], col: '#8a6a45' });
          }
        }
        // 水たまり：滑って減速、少しの間ジャンプできない
        if (truck.grounded && slip <= 0 && find('puddle', cx)) {
          slip = SLIP_TIME;
          vel *= 0.45;
          stats.slows++;
          sfx('slip');
          emit(18, cx, GROUND, { vx: [-260, 120], vy: [-320, -90], life: [0.4, 0.8], r: [2, 5], col: '#7c9bb0' });
        }
      }
      if (truck.grounded && vel > 60 && Math.random() < dt * 18) {
        emit(1, cam + TRUCK_X + 8, GROUND - 2, { vx: [-90, -30], vy: [-60, -10], life: [0.3, 0.6], r: [3, 6], col: slip > 0 ? '#7c9bb0' : '#c7a77c', g: 60 });
      }
    }

    // 角度
    if (!truck.falling) {
      let target = 0;
      if (truck.deathKind === 'boar') target = -0.12;
      else if (truck.flat) target = 0.07;
      else if (!truck.grounded) target = clamp(truck.vy / 2500, -0.2, 0.3);
      truck.angle += (target - truck.angle) * Math.min(1, dt * 10);
    }
    if (truck.dent && Math.random() < dt * 10) steam();

    updateBoars(dt);

    // 初めて見る障害物は、軽トラを通り過ぎたら説明済みにする
    for (const o of obs) {
      if (o.t !== 'boar' && o.x + o.w < cam + TRUCK_X) seenTypes.add(o.t);
      if (o.t === 'boar' && o.counted) seenTypes.add('boar');
    }

    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    for (const p of popups) p.t -= dt;
    popups = popups.filter(p => p.t > 0);
    updateParts(dt);

    if (state === 'dying' || state === 'goal') {
      dieT += dt;
      const wait = state === 'goal' ? 1.6 : truck.deathKind === 'fall' ? 1.9 : 1.4;
      if (dieT > wait) showOver();
    }
  }

  // 泥の斜面を滑り落ちて、ごろごろ転がる
  function updateFall(dt, cx) {
    const pit = truck.pit;
    truck.fallT += dt;
    // 穴の向こう側の斜面の手前で止まる
    if (cx > pit.x + pit.w - pitRun(pit.w) - 46) { truck.fallV = 0; vel = 0; }
    const surf = pitSurface(pit, cx) - 2;
    truck.vy += GRAV * dt;
    truck.y = Math.min(truck.y + truck.vy * dt, surf);
    if (truck.y >= surf) {
      truck.vy = 0;
      if (!truck.splashed && surf >= GROUND + PIT_D - 4) {
        truck.splashed = true;
        sfx('mud');
        shake = 0.25;
        emit(26, cx, GROUND + PIT_D - 6, { vx: [-240, 240], vy: [-460, -140], life: [0.5, 1.1], r: [3, 7], col: '#5c3d20' });
      }
    }
    // 最初は斜面に沿って滑り、途中から1回転半して逆さまに止まる
    const t = clamp(truck.fallT / 1.3, 0, 1);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const prev = truck.angle;
    truck.angle = 3 * Math.PI * e;
    if (Math.floor(prev / Math.PI) !== Math.floor(truck.angle / Math.PI)) {
      sfx('roll');
      emit(8, cx, truck.y - 4, { vx: [-120, 120], vy: [-240, -60], life: [0.4, 0.8], r: [2, 5], col: '#6e4a2a' });
    }
    if (!truck.spilled && truck.fallT > 0.25) {
      truck.spilled = true;
      spillTomatoes(16, cx - 20, truck.y - 40, [-120, 220]);
    }
  }

  function steam() {
    emit(1, cam + TRUCK_FRONT - 10, truck.y - 30, { vx: [-20, 30], vy: [-90, -40], life: [0.6, 1.1], r: [4, 8], col: 'rgba(240,240,235,.8)', g: -20 });
  }

  function updateBoars(dt) {
    for (const o of obs) {
      if (o.t !== 'boar') continue;
      if (o.state === 'pending' && state === 'play' && cam + W >= o.x - speed * 0.9) {
        o.state = 'warn'; o.wt = 0.9; sfx('warn');
      }
      if (o.state === 'warn') {
        o.wt -= dt;
        if (o.wt <= 0) {
          o.state = 'run';
          o.px = cam + W + 40;
          o.vx = rand(170, 300) + Math.min(meters() * 0.04, 90);
        }
      }
      if (o.state === 'hit') {
        // はね飛ばされる
        o.px += o.fvx * dt;
        o.fvy += GRAV * 0.7 * dt;
        o.fy = Math.min(0, o.fy + o.fvy * dt);
        if (o.fy === 0 && o.fvy > 0) { o.fvy = 0; o.fvx *= Math.pow(0.02, dt); } else o.rot += 9 * dt;
      }
      if (o.state === 'run') {
        o.px -= o.vx * dt; o.leg += dt * 22;
        if (o.px < cam - 150) o.state = 'gone';
        if (state === 'play' && !truck.falling) {
          const bs = o.px - cam;
          const tl = TRUCK_X + 10, tr = TRUCK_FRONT - 4;
          const tb = truck.y - 4, tt = truck.y - 46;
          const bl = bs - 24, br = bs + 22, bt = GROUND - 30, bb = GROUND;
          if (tr > bl && tl < br && tb > bt && tt < bb) {
            o.state = 'hit';
            o.fvx = 260; o.fvy = -520; o.fy = 0; o.rot = 0;
            emit(20, o.px, GROUND - 20, { vx: [-200, 250], vy: [-450, -150], life: [0.4, 0.9], r: [2, 5], col: '#fff3c4' });
            die('boar');
          } else if (!o.counted && br < tl) {
            o.counted = true;
            stats.boars++;
            popup('かわした!', '#f2b33d');
            sfx('dodge');
          }
        }
      }
    }
  }

  function updateParts(dt) {
    for (const p of parts) {
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      // トマトは道で止まる
      if (p.tomato && p.y > GROUND - 4 && !find('gap', p.x)) { p.y = GROUND - 4; p.vy = 0; p.vx *= 0.8; }
    }
    parts = parts.filter(p => p.life > 0);
  }

  // ---- 描画 ----
  function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
  const FONT = '"DotGothic16", "MS Gothic", "Osaka-Mono", monospace';
  const bold = s => `900 ${s}px "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;

  function drawSky() {
    const top = -(VH - H);
    const g = ctx.createLinearGradient(0, top, 0, 250);
    g.addColorStop(0, '#5fb3dd');
    g.addColorStop(1, '#fbe8b8');
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, 260 - top);
    ctx.fillStyle = 'rgba(255, 240, 190, .9)';
    ctx.beginPath(); ctx.arc(600, 120, 32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const cOff = (cam * 0.05) % 1200;
    for (let i = 0; i < 4; i++) {
      const x = ((i * 330 - cOff) % 1200 + 1200) % 1200 - 200;
      const y = 110 + hash(i) * 60 + top * 0.4;
      for (const [dx, dy, rx, ry] of [[0, 0, 46, 14], [30, -8, 30, 14], [-26, -4, 24, 10]]) {
        ctx.beginPath(); ctx.ellipse(x + dx, y + dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawMountains(par, base, amp, col, seed) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, 260);
    const off = cam * par;
    for (let x = 0; x <= W + 20; x += 20) {
      const wx = (x + off) / 140 + seed;
      const y = base - amp * (0.55 * Math.sin(wx) + 0.3 * Math.sin(wx * 2.3 + 1) + 0.15 * Math.sin(wx * 5.1));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, 260);
    ctx.closePath();
    ctx.fill();
  }

  function drawFarField() {
    const top = 238;
    ctx.fillStyle = '#86b94c';
    ctx.fillRect(0, top, W, GROUND - top + 10);
    for (let row = 0; row < 7; row++) {
      const y = top + 4 + row * row * 1.8 + row * 3;
      ctx.fillStyle = row % 2 ? '#78ab41' : '#93c457';
      ctx.fillRect(0, y, W, 2 + row * 0.8);
    }
    ctx.fillStyle = '#a28a5c';
    ctx.fillRect(0, top + 22, W, 3);
    const poleGap = 380;
    const pOff = (cam * 0.6) % poleGap;
    ctx.strokeStyle = 'rgba(60,50,40,.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -1; i < 4; i++) {
      const x = i * poleGap - pOff;
      ctx.moveTo(x, 196);
      ctx.quadraticCurveTo(x + poleGap / 2, 214, x + poleGap, 196);
    }
    ctx.stroke();
    ctx.fillStyle = '#5b4a3a';
    for (let i = -1; i < 4; i++) {
      const x = i * poleGap - pOff;
      ctx.fillRect(x - 2, 188, 4, 70);
      ctx.fillRect(x - 10, 194, 20, 3);
    }
  }

  function drawForeField() {
    const top = GROUND + ROAD_H - 4;
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, '#6f9e8a');
    g.addColorStop(1, '#3e6a5c');
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, H - top + 2);
    ctx.strokeStyle = '#5fa032';
    ctx.lineWidth = 2;
    const rows = [[GROUND + 44, 30, 0.9], [GROUND + 72, 36, 1.0], [GROUND + 104, 42, 1.1]];
    for (const [y, sp, sc] of rows) {
      const off = (cam * sc) % sp;
      ctx.beginPath();
      for (let x = -sp - off; x < W + sp; x += sp) {
        const h = 10 * sc;
        ctx.moveTo(x, y); ctx.lineTo(x - 4 * sc, y - h);
        ctx.moveTo(x, y); ctx.lineTo(x, y - h * 1.2);
        ctx.moveTo(x, y); ctx.lineTo(x + 4 * sc, y - h);
      }
      ctx.stroke();
    }
  }

  function roadStrip(a, b) {
    ctx.fillStyle = '#b08a5a';
    ctx.fillRect(a, GROUND, b - a, ROAD_H);
    ctx.fillStyle = '#c9a473';
    ctx.fillRect(a, GROUND, b - a, 4);
    ctx.fillStyle = '#7a5a36';
    ctx.fillRect(a, GROUND + ROAD_H - 4, b - a, 4);
    ctx.fillStyle = 'rgba(90,64,38,.35)';
    ctx.fillRect(a, GROUND + 8, b - a, 2);
    ctx.fillRect(a, GROUND + 14, b - a, 2);
  }
  // 泥の穴：両側がぬかるんだ斜面、底に泥だまり
  function mudPit(a, b, seed = 0) {
    const r = pitRun(b - a);
    const bot = GROUND + PIT_D;
    // 奥の暗い泥
    ctx.fillStyle = '#3f2a16';
    ctx.beginPath();
    ctx.moveTo(a, GROUND); ctx.lineTo(b, GROUND); ctx.lineTo(b, bot + 6); ctx.lineTo(a, bot + 6);
    ctx.closePath(); ctx.fill();
    // 斜面
    const g = ctx.createLinearGradient(0, GROUND, 0, bot);
    g.addColorStop(0, '#8a5f36');
    g.addColorStop(1, '#5a3b1f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(a - 2, GROUND); ctx.lineTo(a + r, bot); ctx.lineTo(a - 2, bot + 6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(b + 2, GROUND); ctx.lineTo(b - r, bot); ctx.lineTo(b + 2, bot + 6);
    ctx.closePath(); ctx.fill();
    // 斜面のぬめり（滑った跡の筋）
    ctx.strokeStyle = 'rgba(190,150,105,.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 1; i <= 3; i++) {
      const f = i / 4;
      ctx.moveTo(a + r * f * 0.3, GROUND + 4 + f * 6); ctx.lineTo(a + r * (0.4 + f * 0.5), bot - 6);
      ctx.moveTo(b - r * f * 0.3, GROUND + 4 + f * 6); ctx.lineTo(b - r * (0.4 + f * 0.5), bot - 6);
    }
    ctx.stroke();
    // 底の泥だまり
    ctx.fillStyle = '#4b3220';
    ctx.beginPath();
    ctx.ellipse((a + b) / 2, bot, (b - a) / 2 - r * 0.6, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(230,200,160,.45)';
    ctx.fillRect(a + r + 6, bot - 3, Math.max(6, (b - a - 2 * r) * 0.3), 2);
    // 泥のあぶく
    ctx.fillStyle = '#6e4a2a';
    for (let i = 0; i < 3; i++) {
      const x = a + r + hash(seed + i) * Math.max(4, b - a - 2 * r);
      ctx.beginPath(); ctx.arc(x, bot - 2, 2 + hash(seed + i * 7) * 2, Math.PI, 0); ctx.fill();
    }
  }

  function drawRoad() {
    const holes = obs.filter(o => o.t === 'gap' && o.x + o.w > cam && o.x < cam + W)
      .map(o => [o.x - cam, o.x + o.w - cam, o.x]).sort((a, b) => a[0] - b[0]);
    const segs = [];
    let s = -10;
    for (const [a, b] of holes) { if (a > s) segs.push([s, a]); s = Math.max(s, b); }
    if (s < W + 10) segs.push([s, W + 10]);
    for (const [a, b] of segs) {
      roadStrip(a, b);
      ctx.strokeStyle = '#6e9e3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const off = cam % 14;
      for (let x = Math.ceil((a + off) / 14) * 14 - off; x < b; x += 14) {
        const h = 4 + hash(Math.floor((x + cam) / 14)) * 6;
        ctx.moveTo(x, GROUND + ROAD_H - 2); ctx.lineTo(x - 2, GROUND + ROAD_H - 2 - h);
      }
      ctx.stroke();
    }
    for (const [a, b, wx] of holes) mudPit(a, b, wx);
  }

  // 100m ごとの距離標、ベストの旗、タイムアタックのゴール
  function drawMarkers() {
    const first = Math.floor((cam - 60) / (100 * PX_PER_M));
    for (let k = Math.max(1, first); k <= first + 2; k++) {
      if (mode === 'ta' && k * 100 >= GOAL_M) continue;
      const sx = k * 100 * PX_PER_M + TRUCK_FRONT - cam;
      if (sx < -40 || sx > W + 40 || find('gap', sx + cam)) continue;
      ctx.fillStyle = '#e8e2d0';
      ctx.fillRect(sx - 7, GROUND - 26, 14, 26);
      ctx.fillStyle = '#b9b19a';
      ctx.fillRect(sx - 7, GROUND - 26, 14, 3);
      ctx.fillStyle = '#3b3326';
      ctx.font = '10px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText(String(k * 100), sx, GROUND - 9, 12);
    }
    if (state === 'title') return;
    if (mode === 'ta') {
      const sx = goalX() - cam;
      if (sx > -80 && sx < W + 80) drawGoal(sx);
    } else if (best > 0) {
      const sx = best * PX_PER_M + TRUCK_FRONT - cam;
      if (sx > -40 && sx < W + 60) {
        ctx.fillStyle = '#5b4a3a';
        ctx.fillRect(sx - 1.5, GROUND - 70, 3, 70);
        const wave = Math.sin(runTime * 8) * 3;
        ctx.fillStyle = '#e2543a';
        ctx.beginPath();
        ctx.moveTo(sx + 1.5, GROUND - 70);
        ctx.quadraticCurveTo(sx + 22, GROUND - 66 + wave, sx + 42, GROUND - 62);
        ctx.lineTo(sx + 42, GROUND - 46);
        ctx.quadraticCurveTo(sx + 22, GROUND - 50 + wave, sx + 1.5, GROUND - 52);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '11px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillText('BEST', sx + 7, GROUND - 56);
      }
    }
  }
  function drawGoal(sx) {
    // 市松模様の地面のライン
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = i % 2 ? '#222' : '#fff';
      ctx.fillRect(sx - 6 + (i % 2) * 6, GROUND + i * 4, 6, 4);
      ctx.fillStyle = i % 2 ? '#fff' : '#222';
      ctx.fillRect(sx - (i % 2) * 6, GROUND + i * 4, 6, 4);
    }
    // ゲート
    ctx.fillStyle = '#6a4b2a';
    ctx.fillRect(sx - 60, GROUND - 120, 6, 120);
    ctx.fillRect(sx + 54, GROUND - 120, 6, 120);
    ctx.fillStyle = '#e2543a';
    ctx.fillRect(sx - 66, GROUND - 132, 132, 28);
    ctx.fillStyle = '#fffbea';
    ctx.font = bold(18);
    ctx.textAlign = 'center';
    ctx.fillText('ゴール', sx, GROUND - 111);
  }

  function drawPuddle(sx, w) {
    ctx.fillStyle = '#5f7f96';
    ctx.beginPath();
    ctx.ellipse(sx + w / 2, GROUND + 3, w / 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(220,240,255,.7)';
    ctx.fillRect(sx + w * 0.25, GROUND + 1, w * 0.25, 2);
  }
  function drawBumps(sx, w, seed) {
    for (let x = 0; x < w; x += 16) {
      const h = 3 + hash(seed + x) * 6;
      ctx.fillStyle = '#8f6c44';
      ctx.beginPath();
      ctx.ellipse(sx + x + 8, GROUND + 1, 9, h, 0, Math.PI, 0);
      ctx.fill();
      if (hash(seed + x * 3) > 0.6) {
        ctx.fillStyle = '#9a9488';
        ctx.beginPath();
        ctx.ellipse(sx + x + 4, GROUND - 1, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  function drawHazards() {
    for (const o of obs) {
      const sx = o.x - cam;
      if (o.t === 'puddle') {
        if (sx > W || sx + o.w < 0) continue;
        drawPuddle(sx, o.w);
      } else if (o.t === 'bump') {
        if (sx > W || sx + o.w < 0) continue;
        drawBumps(sx, o.w, o.seed);
        if (sx - 30 > -50 && sx - 30 < W) {
          ctx.fillStyle = '#6a4b2a';
          ctx.fillRect(sx - 30, GROUND - 34, 3, 34);
          ctx.fillStyle = '#f0d27a';
          ctx.fillRect(sx - 46, GROUND - 48, 36, 18);
          ctx.fillStyle = '#3a2a14';
          ctx.font = '11px ' + FONT;
          ctx.textAlign = 'center';
          ctx.fillText('悪路', sx - 28, GROUND - 34);
        }
      }
    }
  }

  // 初めて出てきた障害物に吹き出しで説明を出す
  const CALLOUTS = { gap: 'タップでジャンプ!', puddle: '水たまり 滑って減速', bump: 'ボコボコ道 3回でパンク', boar: 'イノシシ! 跳び越えろ' };
  function drawCallouts() {
    if (state !== 'play') return;
    for (const o of obs) {
      if (seenTypes.has(o.t)) continue;
      let sx, y;
      if (o.t === 'boar') { if (o.state !== 'run') continue; sx = o.px - cam; y = GROUND - 58; }
      else { sx = o.x - cam + Math.min(o.w, 160) / 2; y = GROUND - 44; }
      const near = o.t === 'boar' ? sx - TRUCK_FRONT < 120 : o.x - cam - TRUCK_FRONT < 30;
      if (near || sx > W - 20) continue;
      ctx.font = '15px ' + FONT;
      const half = ctx.measureText(CALLOUTS[o.t]).width / 2 + 10;
      bubble(CALLOUTS[o.t], Math.min(W - half - 8, Math.max(TRUCK_FRONT + half + 8, sx)), y, sx);
      break;
    }
  }
  function bubble(text, x, y, tipX) {
    ctx.font = '15px ' + FONT;
    const w = ctx.measureText(text).width + 20;
    const h = 26;
    ctx.fillStyle = '#fffbea';
    ctx.strokeStyle = '#3a2a14';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x - w / 2, y - h - 8, w, h, 6);
    ctx.moveTo(tipX - 6, y - 8.5); ctx.lineTo(tipX, y); ctx.lineTo(tipX + 6, y - 8.5);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fffbea';
    ctx.fillRect(tipX - 5, y - 11, 10, 3);
    ctx.fillStyle = '#3a2a14';
    ctx.textAlign = 'center';
    ctx.fillText(text, x, y - 15);
  }

  function drawBoars() {
    for (const o of obs) {
      if (o.t !== 'boar') continue;
      if (o.state === 'warn') {
        if (Math.floor(o.wt * 10) % 2 === 0) {
          ctx.fillStyle = '#e2543a';
          ctx.strokeStyle = '#fffbea';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(W - 36, GROUND - 76); ctx.lineTo(W - 8, GROUND - 26); ctx.lineTo(W - 64, GROUND - 26);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#fffbea';
          ctx.font = bold(28);
          ctx.textAlign = 'center';
          ctx.fillText('!', W - 36, GROUND - 32);
        }
      } else if (o.state === 'run' || o.state === 'hit') {
        const sx = o.px - cam;
        if (sx < -80 || sx > W + 80) continue;
        const y = o.state === 'hit' ? GROUND + o.fy : (find('gap', o.px) ? GROUND - 26 : GROUND);
        drawBoar(sx, y, o.leg, o.state === 'hit' ? o.rot : 0);
        if (o.state === 'run' && Math.random() < 0.3) emit(1, o.px + 26, GROUND - 2, { vx: [20, 80], vy: [-50, -10], life: [0.2, 0.4], r: [2, 5], col: '#c7a77c', g: 50 });
        if (o.state === 'hit' && o.fy === 0) drawStars(sx, GROUND - 44);
      }
    }
  }
  function drawStars(x, y) {
    ctx.fillStyle = '#f2b33d';
    for (let i = 0; i < 3; i++) {
      const a = runTime * 4 + dieT * 6 + i * 2.1;
      const sx = x + Math.cos(a) * 18, sy = y + Math.sin(a) * 5;
      ctx.beginPath();
      for (let k = 0; k < 5; k++) {
        const r = k % 2 ? 2 : 5, t = k * Math.PI * 2 / 5 * 2;
        ctx.lineTo(sx + Math.cos(t) * r, sy + Math.sin(t) * r);
      }
      ctx.fill();
    }
  }

  function drawBoar(x, y, leg, rot) {
    ctx.save();
    ctx.translate(x, y - 16);
    ctx.rotate(rot);
    ctx.translate(0, 16);
    ctx.strokeStyle = '#3b2616';
    ctx.lineWidth = 4;
    ctx.beginPath();
    const s1 = Math.sin(leg) * 6, s2 = Math.sin(leg + Math.PI) * 6;
    ctx.moveTo(-14, -8); ctx.lineTo(-14 + s1, 0);
    ctx.moveTo(-6, -8); ctx.lineTo(-6 + s2, 0);
    ctx.moveTo(10, -8); ctx.lineTo(10 + s2, 0);
    ctx.moveTo(16, -8); ctx.lineTo(16 + s1, 0);
    ctx.stroke();
    ctx.fillStyle = '#6b4526';
    ctx.beginPath(); ctx.ellipse(2, -18, 26, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a2e18';
    ctx.beginPath(); ctx.ellipse(6, -27, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5e3b20';
    ctx.beginPath();
    ctx.moveTo(-18, -26); ctx.lineTo(-36, -14); ctx.lineTo(-34, -8); ctx.lineTo(-16, -8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c98a6a';
    ctx.fillRect(-38, -15, 4, 7);
    ctx.strokeStyle = '#fff6e0';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-30, -9); ctx.lineTo(-34, -16); ctx.stroke();
    ctx.fillStyle = '#111';
    if (rot) { ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-26, -22); ctx.lineTo(-22, -18); ctx.moveTo(-22, -22); ctx.lineTo(-26, -18); ctx.stroke(); }
    else ctx.fillRect(-25, -21, 3, 3);
    ctx.fillStyle = '#4a2e18';
    ctx.beginPath(); ctx.moveTo(-18, -26); ctx.lineTo(-14, -34); ctx.lineTo(-11, -25); ctx.fill();
    ctx.strokeStyle = '#4a2e18';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(27, -22); ctx.lineTo(33, -26 + Math.sin(leg) * 3); ctx.stroke();
    ctx.restore();
  }

  // 荷台のトマトの山
  const TOMATOES = [];
  for (const [y, xs] of [[-37, [8, 17, 26, 35, 44, 53]], [-45, [12, 21, 30, 39, 48]], [-53, [17, 26, 35, 43]], [-60, [22, 31]]]) {
    for (const x of xs) TOMATOES.push([x, y]);
  }
  function drawTomatoes(keep) {
    const n = Math.round(TOMATOES.length * keep);
    for (let i = 0; i < n; i++) {
      const [x, y] = TOMATOES[i];
      ctx.fillStyle = i % 3 === 1 ? '#c92f22' : '#e0392b';
      ctx.beginPath(); ctx.arc(x, y, 5.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillRect(x - 3, y - 3, 2, 2);
      if (i % 2 === 0 || y < -50) {
        ctx.fillStyle = '#3f8a2a';
        ctx.fillRect(x - 2, y - 6, 4, 2);
        ctx.fillRect(x - 0.5, y - 8, 1.5, 3);
      }
    }
  }

  function drawTruck() {
    const wob = slip > 0 ? Math.sin(runTime * 32) : 0;
    const sq = truck.squash;
    if (!truck.falling) {
      const lift = Math.max(0, GROUND - truck.y);
      ctx.fillStyle = `rgba(40,30,15,${0.25 * Math.max(0.2, 1 - lift / 160)})`;
      ctx.beginPath();
      ctx.ellipse(truckX + TRUCK_W / 2, GROUND + 1, 46 * Math.max(0.5, 1 - lift / 260), 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // 転がるときは車体の中心を軸に回す
    const pivot = truck.falling ? 26 : 0;
    ctx.save();
    ctx.translate(truckX + TRUCK_W / 2 + wob * 4, truck.y - pivot);
    ctx.rotate(truck.angle + wob * 0.05);
    ctx.scale(1 + sq * 0.06, 1 - sq * 0.1);
    ctx.translate(-TRUCK_W / 2, pivot);
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(4, -16, 90, 7);
    // トマトの山（荷台の後ろ側から描く）
    drawTomatoes(truck.spilled ? 0.35 : 1);
    // 荷台
    ctx.fillStyle = '#eef0f0';
    ctx.fillRect(2, -32, 58, 17);
    ctx.fillStyle = '#c9cfd1';
    ctx.fillRect(2, -32, 58, 3);
    ctx.fillRect(20, -32, 2, 17);
    ctx.fillRect(40, -32, 2, 17);
    // 鳥居
    ctx.fillStyle = '#9aa2a5';
    ctx.fillRect(58, -50, 4, 36);
    // キャブ（ぶつけると前がへこむ）
    const d = truck.dent;
    ctx.fillStyle = '#f7f8f8';
    ctx.beginPath();
    ctx.moveTo(61, -52); ctx.lineTo(84 - d * 3, -52 + d * 2); ctx.lineTo(93 - d * 8, -30); ctx.lineTo(96 - d * 7, -28 + d * 3);
    ctx.lineTo(96 - d * 9, -20); ctx.lineTo(96 - d * 5, -12); ctx.lineTo(61, -12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8cc3dc';
    ctx.beginPath();
    ctx.moveTo(65, -48); ctx.lineTo(82 - d * 3, -48 + d * 2); ctx.lineTo(89 - d * 8, -32); ctx.lineTo(65, -32);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(70, -46, 3, 12);
    ctx.fillStyle = '#c9cfd1';
    ctx.fillRect(64, -30, 1.5, 17);
    ctx.fillRect(68, -27, 6, 2);
    // バンパー・ライト
    ctx.fillStyle = '#9aa2a5';
    if (d) { ctx.save(); ctx.translate(88, -14); ctx.rotate(0.35); ctx.fillRect(-2, -2, 9, 5); ctx.restore(); }
    else ctx.fillRect(90, -16, 8, 5);
    ctx.fillStyle = d ? '#555' : '#ffe28a';
    ctx.fillRect(92 - d * 8, -26, 4, 5);
    // 運転手
    ctx.fillStyle = '#3b2a1e';
    ctx.beginPath(); ctx.arc(74, -40, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f6a3a';
    ctx.fillRect(68, -46, 12, 3);
    if (d) drawDents();
    // タイヤ（パンクすると前輪がつぶれる）
    for (const wx of [20, 78]) {
      const flat = truck.flat && wx === 78;
      ctx.fillStyle = '#1f1f1f';
      ctx.beginPath();
      if (flat) ctx.ellipse(wx, -6, 12, 6, 0, 0, Math.PI * 2);
      else ctx.arc(wx, -10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#b8bec0';
      ctx.beginPath(); ctx.arc(wx, flat ? -8 : -10, 4.5, 0, Math.PI * 2); ctx.fill();
      if (!flat) {
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k < 3; k++) {
          const a = wheelA + k * Math.PI * 2 / 3;
          ctx.moveTo(wx, -10); ctx.lineTo(wx + Math.cos(a) * 8, -10 + Math.sin(a) * 8);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  // ボコボコになった車体：へこみの影、窓のひび、荷台のゆがみ
  function drawDents() {
    ctx.strokeStyle = 'rgba(80,85,90,.75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(78, -26); ctx.quadraticCurveTo(82, -22, 78, -17);
    ctx.moveTo(67, -22); ctx.quadraticCurveTo(71, -19, 68, -15);
    ctx.moveTo(30, -29); ctx.quadraticCurveTo(34, -24, 29, -19);
    ctx.moveTo(8, -30); ctx.quadraticCurveTo(12, -26, 9, -21);
    ctx.stroke();
    ctx.fillStyle = 'rgba(80,85,90,.25)';
    ctx.beginPath(); ctx.ellipse(80, -21, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(32, -24, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    // 窓のひび
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(80, -40); ctx.lineTo(76, -44); ctx.lineTo(72, -42);
    ctx.moveTo(80, -40); ctx.lineTo(83, -35);
    ctx.moveTo(80, -40); ctx.lineTo(75, -36); ctx.lineTo(70, -37);
    ctx.moveTo(80, -40); ctx.lineTo(79, -47);
    ctx.stroke();
  }

  function drawParts() {
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * (p.tomato ? 3 : 1)));
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x - cam, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.tomato) { ctx.fillStyle = '#3f8a2a'; ctx.fillRect(p.x - cam - 1.5, p.y - p.r - 1, 3, 2); }
    }
    ctx.globalAlpha = 1;
  }

  // 縁取りつきの文字（空・雲・田んぼのどこでも読める）
  function label(text, x, y, font, fill, align = 'left', stroke = 'rgba(27,34,22,.85)', lw = 5) {
    ctx.font = font;
    ctx.textAlign = align;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawHUD() {
    if (state === 'title' || state === 'over') return;
    const m = meters();
    const t = state === 'goal' ? goalTime : runTime;
    if (mode === 'ta') {
      label(fmtTime(t), 22, 56, '44px ' + FONT, '#fffbea', 'left', 'rgba(27,34,22,.85)', 7);
      let sub, col = '#fffbea';
      if (state === 'goal') { sub = 'ゴール!'; col = '#f2b33d'; }
      else sub = `ゴールまで ${fmtM(Math.max(0, GOAL_M - m))} m`;
      label(sub, 24, 82, '15px ' + FONT, col, 'left', 'rgba(27,34,22,.85)', 4);
      drawProgress(Math.min(1, m / GOAL_M));
    } else {
      const ms = fmtM(m);
      label(ms, 22, 56, '44px ' + FONT, '#fffbea', 'left', 'rgba(27,34,22,.85)', 7);
      const numW = ctx.measureText(ms).width;
      label('m', 28 + numW, 56, '22px ' + FONT, '#fffbea');
      let sub, subCol = '#fffbea';
      if (best <= 0) sub = 'はじめての走行';
      else if (m <= best) sub = 'ベストまで あと ' + fmtM(best - m) + ' m';
      else { sub = 'ベスト更新中 +' + fmtM(m - best) + ' m'; subCol = '#f2b33d'; }
      label(sub + '  ' + fmtTime(t), 24, 82, '15px ' + FONT, subCol, 'left', 'rgba(27,34,22,.85)', 4);
    }
    drawTires();
    drawSpeedo();

    if (banner) {
      const bt = banner.t;
      const a = Math.min(1, bt / 0.3);
      const pop = reduceMotion ? 1 : 1 + Math.max(0, bt - 1.35) * 1.6;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.translate(W / 2, 150);
      ctx.scale(pop, pop);
      label(banner.text, 0, 0, bold(44), banner.color, 'center', 'rgba(27,34,22,.9)', 8);
      if (banner.sub) label(banner.sub, 0, 30, '18px ' + FONT, '#f2b33d', 'center', 'rgba(27,34,22,.9)', 5);
      ctx.restore();
    }
    const top = VH - H;
    let py = truck.y + top - 76;
    if (slip > 0 && state === 'play') { label('スリップ! 減速', TRUCK_X + TRUCK_W / 2, py, '20px ' + FONT, '#ffb49f', 'center'); py -= 24; }
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.t / 0.3);
      label(p.text, TRUCK_X + TRUCK_W / 2, py - (1.1 - p.t) * 30, '18px ' + FONT, p.color, 'center');
      ctx.globalAlpha = 1;
      py -= 24;
    }
  }

  // タイヤの残り（ボコボコ道に乗るたび1つ減る）
  function drawTires() {
    const x0 = 24, y0 = mode === 'ta' ? 112 : 106;
    label('タイヤ', x0, y0 + 5, '13px ' + FONT, '#fffbea', 'left', 'rgba(27,34,22,.85)', 4);
    const shakeX = tireFlash > 0 && !reduceMotion ? Math.sin(tireFlash * 40) * 2 : 0;
    for (let i = 0; i < BUMP_LIMIT; i++) {
      const cx = x0 + 60 + i * 22 + shakeX, cy = y0;
      const ok = i < BUMP_LIMIT - bumpHits;
      ctx.fillStyle = 'rgba(27,34,22,.85)';
      ctx.beginPath(); ctx.arc(cx, cy, 9.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = ok ? '#2a2a2a' : '#5b2a22';
      ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = ok ? '#c9cfd1' : '#e2543a';
      ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();
      if (!ok) {
        ctx.strokeStyle = '#e2543a';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx - 6, cy - 6); ctx.lineTo(cx + 6, cy + 6); ctx.stroke();
      }
    }
  }

  // タイムアタックの進み具合（画面上の中央）
  function drawProgress(f) {
    const x0 = 260, x1 = 540, y = 36;
    ctx.fillStyle = 'rgba(27,34,22,.7)';
    ctx.beginPath(); ctx.roundRect(x0 - 8, y - 9, x1 - x0 + 16, 18, 9); ctx.fill();
    ctx.fillStyle = 'rgba(246,239,217,.25)';
    ctx.fillRect(x0, y - 2, x1 - x0, 4);
    ctx.fillStyle = '#f2b33d';
    ctx.fillRect(x0, y - 2, (x1 - x0) * f, 4);
    for (let i = 1; i < 10; i++) { ctx.fillStyle = 'rgba(246,239,217,.4)'; ctx.fillRect(x0 + (x1 - x0) * i / 10 - 0.5, y - 5, 1, 10); }
    // ゴール旗
    ctx.fillStyle = '#e2543a';
    ctx.fillRect(x1, y - 14, 2, 16);
    ctx.beginPath(); ctx.moveTo(x1 + 2, y - 14); ctx.lineTo(x1 + 14, y - 10); ctx.lineTo(x1 + 2, y - 6); ctx.fill();
    // 軽トラの点
    ctx.fillStyle = '#fffbea';
    ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * f, y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e0392b';
    ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * f, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // 右下の速度計（0〜120 km/h）
  function drawSpeedo() {
    const k = kmh(vel);
    const cx = W - 70, cy = VH - 18, r = 46;
    ctx.fillStyle = 'rgba(27,34,22,.72)';
    ctx.beginPath(); ctx.arc(cx, cy, r + 8, Math.PI, 0); ctx.closePath(); ctx.fill();
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI + (i / 12) * Math.PI;
      const r0 = i % 2 === 0 ? r - 9 : r - 5;
      ctx.strokeStyle = i >= 10 ? '#e2543a' : 'rgba(246,239,217,.8)';
      ctx.lineWidth = i % 2 === 0 ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.stroke();
    }
    // 巡航速度の目印（減速していると針が下がる）
    if (state === 'play') {
      const ca = Math.PI + Math.min(1, kmh(speed) / 120) * Math.PI;
      ctx.fillStyle = 'rgba(246,239,217,.6)';
      ctx.beginPath(); ctx.arc(cx + Math.cos(ca) * (r + 3), cy + Math.sin(ca) * (r + 3), 2.5, 0, Math.PI * 2); ctx.fill();
    }
    const slowed = state === 'play' && vel < speed * 0.9;
    const na = Math.PI + Math.min(1, k / 120) * Math.PI;
    ctx.strokeStyle = slowed ? '#ff8f7a' : '#f2b33d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(na) * (r - 6), cy + Math.sin(na) * (r - 6));
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = slowed ? '#ff8f7a' : '#fffbea';
    ctx.textAlign = 'center';
    ctx.font = '18px ' + FONT;
    ctx.fillText(String(k), cx, cy - 16);
    ctx.font = '10px ' + FONT;
    ctx.fillStyle = 'rgba(246,239,217,.7)';
    ctx.fillText('km/h', cx, cy - 4);
  }

  function draw() {
    ctx = mainCtx;
    ctx.save();
    ctx.translate(0, VH - H);
    if (shake > 0 && !reduceMotion) ctx.translate(rand(-6, 6) * shake * 2, rand(-6, 6) * shake * 2);
    drawSky();
    drawMountains(0.08, 205, 50, '#9fb8b2', 0);
    drawMountains(0.18, 228, 34, '#6f9870', 3);
    drawFarField();
    drawForeField();
    drawRoad();
    drawMarkers();
    drawHazards();
    drawTruck();
    drawBoars();
    drawParts();
    drawCallouts();
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,250,235,${flash * 2})`;
      ctx.fillRect(0, 0, W, VH);
    }
    drawHUD();
  }

  // ---- タイトルの障害物アイコン ----
  function drawIcons() {
    const saveCam = cam;
    for (const c of document.querySelectorAll('canvas[data-icon]')) {
      ctx = c.getContext('2d');
      const kind = c.dataset.icon;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.translate(0, 44 - GROUND);   // 道の表面を y=44 に
      cam = 0;
      if (kind === 'gap') { roadStrip(-4, 30); roadStrip(92, 124); mudPit(30, 92, 3); }
      else if (kind === 'puddle') { roadStrip(-4, 124); drawPuddle(26, 70); }
      else if (kind === 'bump') { roadStrip(-4, 124); drawBumps(8, 104, 7); }
      else if (kind === 'boar') { roadStrip(-4, 124); drawBoar(64, GROUND, 1, 0); }
    }
    cam = saveCam;
    ctx = mainCtx;
  }

  // ---- ループ ----
  let last = performance.now();
  let simMode = false;   // 試運転用：true の間はループが更新しない
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!simMode && !paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // 試運転用のフック（URL末尾が #debug のときだけ）
  if (location.hash === '#debug') {
    window.__kt = {
      get state() { return state; }, get truck() { return truck; }, get obs() { return obs; },
      get cam() { return cam; }, get speed() { return speed; }, get vel() { return vel; }, get slip() { return slip; },
      get stats() { return stats; }, get paused() { return paused; }, get bumpHits() { return bumpHits; },
      get runTime() { return runTime; }, get goalTime() { return goalTime; }, get mode() { return mode; },
      TRUCK_X, TRUCK_W, W, JUMP_V, GRAV, meters, press, release, start, update, draw, setPaused,
      set sim(v) { simMode = v; }, set best(v) { best = v; },
    };
  }

  reset();
  setMode(mode);
  resize();
  renderTitleBest();
  drawIcons();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawIcons);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
