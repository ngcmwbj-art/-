<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>軽トラ走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap">
<style>
/* 画面いっぱいのゲーム。キャンバスの上にHTMLのメニューを重ねる。色は夕方の田んぼ道で統一（単一テーマ） */
:root {
  --night: #1b2216;       /* ページの地：暗いあぜの土色 */
  --panel: #26301d;
  --panel-edge: #4b5a36;
  --ink: #f6efd9;         /* 文字：わら色がかった白 */
  --muted: #bdb79c;
  --accent: #f2b33d;      /* 稲穂の黄色 */
  --accent-deep: #a8700f;
  --danger: #e2543a;      /* トマトの赤 */
  --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-pixel: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-pixel);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
[hidden] { display: none !important; }

.app {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.app.portrait { justify-content: flex-start; padding-top: max(24px, env(safe-area-inset-top, 0px)); }
.stage {
  position: relative;
  container-type: size;
  overflow: hidden;
  touch-action: none;
  background: #8fd0e8;
  border-radius: 8px;
  box-shadow: 0 14px 50px rgba(0, 0, 0, .5);
}
.stage.compact { border-radius: 0; box-shadow: none; }
canvas { display: block; width: 100%; height: 100%; }

/* ---- 右上のボタン ---- */
.tools {
  position: absolute;
  top: 2.2cqh;
  right: 1.6cqw;
  display: flex;
  gap: 1cqw;
  z-index: 3;
}
.icon-btn {
  width: max(34px, 5.4cqw);
  height: max(34px, 5.4cqw);
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--ink);
  background: rgba(27, 34, 22, .55);
  border: 2px solid rgba(246, 239, 217, .35);
  border-radius: 10px;
  cursor: pointer;
}
.icon-btn svg { width: 55%; height: 55%; }
.icon-btn:hover { background: rgba(27, 34, 22, .75); }
.icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---- 重ねるメニュー ---- */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4cqh 5cqw;
  box-sizing: border-box;
}
.btn {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(16px, 3.4cqw, 30px);
  letter-spacing: .08em;
  color: #2a1d08;
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  padding: .42em 1.5em;
  cursor: pointer;
  box-shadow: 0 .18em 0 var(--accent-deep);
}
.btn:active { transform: translateY(.14em); box-shadow: 0 .04em 0 var(--accent-deep); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.btn.ghost {
  color: var(--ink);
  background: transparent;
  box-shadow: inset 0 0 0 2px rgba(246, 239, 217, .45);
}

/* タイトル：左に寄せて、右側の軽トラと空を見せる */
#title {
  justify-content: flex-start;
  background: linear-gradient(90deg, rgba(27, 34, 22, .88) 0%, rgba(27, 34, 22, .7) 50%, rgba(27, 34, 22, 0) 80%);
}
.title-col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2.2cqh;
  max-width: 64cqw;
}
.eyebrow {
  margin: 0;
  font-size: clamp(10px, 1.7cqw, 15px);
  letter-spacing: .3em;
  color: var(--accent);
}
.logo {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(36px, 10cqw, 104px);
  line-height: .95;
  letter-spacing: -.01em;
  color: var(--ink);
  margin: 0;
  transform: skewX(-9deg);
  transform-origin: left bottom;
  text-shadow: .045em .045em 0 var(--danger), .09em .09em 0 rgba(0, 0, 0, .35);
}
.legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.1cqh 2.4cqw;
}
.legend li { display: flex; align-items: center; gap: 1.2cqw; min-width: 0; }
.legend canvas {
  flex: none;
  width: clamp(40px, 7.2cqw, 70px);
  height: auto;
  aspect-ratio: 5 / 3;
  background: rgba(143, 208, 232, .18);
  border-radius: 6px;
}
.legend span { font-size: clamp(10px, 1.55cqw, 14px); color: var(--muted); line-height: 1.35; }
.legend b { display: block; color: var(--ink); font-weight: normal; font-size: 1.12em; }

/* モード選択 */
.modes { display: flex; gap: 1.8cqw; flex-wrap: wrap; }
.mode {
  display: grid;
  gap: .2em;
  justify-items: start;
  text-align: left;
  min-width: 12em;
  font-family: var(--font-pixel);
  font-size: clamp(10px, 1.55cqw, 14px);
  color: var(--ink);
  background: rgba(27, 34, 22, .6);
  border: 2px solid rgba(246, 239, 217, .35);
  border-radius: 14px;
  padding: .7em 1.1em .75em;
  cursor: pointer;
  box-shadow: 0 .3em 0 rgba(0, 0, 0, .35);
}
.mode:active { transform: translateY(.2em); box-shadow: 0 .1em 0 rgba(0, 0, 0, .35); }
.mode:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.mode.selected { background: var(--accent); border-color: var(--accent); color: #2a1d08; box-shadow: 0 .3em 0 var(--accent-deep); }
.mode-name { font-family: var(--font-display); font-weight: 900; font-size: 1.75em; letter-spacing: .05em; line-height: 1.1; }
.mode-desc { opacity: .8; }
.mode-best { font-variant-numeric: tabular-nums; }
.mode-best b { font-weight: normal; }
.howto { margin: 0; font-size: clamp(10px, 1.5cqw, 14px); color: var(--muted); }
.howto kbd {
  font-family: inherit;
  color: var(--ink);
  padding: 0 .4em;
  border: 1px solid rgba(246, 239, 217, .4);
  border-bottom-width: 2px;
  border-radius: 4px;
}

/* ゲームオーバー／一時停止：中央のカード */
.dim { background: rgba(27, 34, 22, .5); }
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.3cqh;
  text-align: center;
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  border-radius: 14px;
  padding: 4.2cqh 4.4cqw 3.2cqh;
  box-shadow: 0 .6cqh 0 rgba(0, 0, 0, .35);
  max-width: 88cqw;
  max-height: 94cqh;
  box-sizing: border-box;
  animation: pop .28s cubic-bezier(.2, 1.4, .4, 1) both;
}
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.reason {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(18px, min(4.2cqw, 8cqh), 46px);
  line-height: 1.1;
  color: var(--ink);
  text-shadow: .06em .06em 0 var(--danger);
}
.reason.win { text-shadow: .06em .06em 0 var(--accent-deep); color: var(--accent); }
.sub { margin: 0; font-size: clamp(11px, 1.8cqw, 16px); color: var(--muted); }
.result {
  margin: 0;
  font-size: clamp(30px, min(7cqw, 15cqh), 88px);
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.result small { font-size: .38em; color: var(--ink); margin-left: .15em; }
.ribbon {
  position: absolute;
  top: -1.1em;
  left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(12px, 2.2cqw, 20px);
  color: #fff;
  background: var(--danger);
  padding: .2em 1em;
  border-radius: 4px;
  white-space: nowrap;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .3);
}
.rank { margin: 0; font-size: clamp(11px, min(1.8cqw, 3.6cqh), 17px); color: var(--muted); }
.rank b { font-weight: normal; color: var(--ink); padding: .1em .6em; margin-left: .3em; border: 1px solid var(--panel-edge); border-radius: 999px; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0 3cqw;
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.stats div { display: flex; flex-direction: column-reverse; align-items: center; }
.stats dt { font-size: clamp(9px, 1.4cqw, 13px); color: var(--muted); }
.stats dd { margin: 0; font-size: clamp(13px, min(2.4cqw, 4.8cqh), 24px); color: var(--ink); white-space: nowrap; }
.btn-row { display: flex; gap: 2cqw; flex-wrap: wrap; justify-content: center; margin-top: .6cqh; }
.card .btn { font-size: clamp(15px, min(2.7cqw, 5.4cqh), 26px); }
.kbd-hint { margin: 0; font-size: clamp(9px, 1.35cqw, 12px); color: var(--muted); }

/* 縦持ちのとき：ゲームの下を親指で押すパッドにする */
.pad {
  flex: 1;
  width: calc(100% - 32px);
  max-height: 420px;
  min-height: 120px;
  margin-inline: 16px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 2px dashed rgba(246, 239, 217, .28);
  border-radius: 20px;
  color: var(--muted);
  touch-action: none;
}
.pad.on { background: rgba(242, 179, 61, .12); border-color: var(--accent); }
.pad-main { font-family: var(--font-display); font-weight: 900; font-size: 22px; color: var(--ink); letter-spacing: .08em; }
.pad-sub { font-size: 13px; }
.rotate-hint {
  margin: 0;
  padding-inline: 16px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}
.rotate-hint b { color: var(--accent); font-weight: normal; }

.touch-only { display: none; }
@media (hover: none) and (pointer: coarse) {
  .touch-only { display: inline; }
  .kbd-only { display: none !important; }
}
/* 幅の狭い画面（縦持ちのスマホ）では説明を省く。障害物は走りながら吹き出しで説明する */
@container (max-width: 560px) {
  .legend, .mode-desc, .howto { display: none; }
  .title-col { gap: 3cqh; max-width: 92cqw; }
  .logo { font-size: 14cqw; }
  .mode { min-width: 0; font-size: 11px; }
  #title { background: linear-gradient(90deg, rgba(27, 34, 22, .85) 0%, rgba(27, 34, 22, .6) 60%, rgba(27, 34, 22, .1) 90%); }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="音を消す" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
          <path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
          <path class="mute" d="M16 9l6 6M22 9l-6 6" hidden/>
        </svg>
      </button>
      <button class="icon-btn" id="musicBtn" type="button" aria-label="BGMを止める" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l11-2v13"/>
          <circle cx="6" cy="18" r="3" fill="currentColor"/>
          <circle cx="17" cy="16" r="3" fill="currentColor"/>
          <path class="slash" d="M3 3l18 18" hidden/>
        </svg>
      </button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="一時停止" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>

    <div class="overlay" id="title">
      <div class="title-col">
        <p class="eyebrow">あぜ道ランナー</p>
        <h1 class="logo">軽トラ走!</h1>
        <ul class="legend">
          <li><canvas data-icon="gap" width="120" height="72"></canvas><span><b>泥の斜面</b>落ちたら転がって終わり</span></li>
          <li><canvas data-icon="boar" width="120" height="72"></canvas><span><b>イノシシ</b>ぶつかったら終わり</span></li>
          <li><canvas data-icon="puddle" width="120" height="72"></canvas><span><b>水たまり</b>滑って減速。トマトが落ちる</span></li>
          <li><canvas data-icon="bump" width="120" height="72"></canvas><span><b>ボコボコ道</b>減速。3回乗るとパンク</span></li>
        </ul>
        <div class="modes">
          <button class="mode" type="button" data-mode="endless">
            <span class="mode-name">エンドレス</span>
            <span class="mode-desc">トマトを運んだ距離で勝負</span>
            <span class="mode-best" id="bestEndless">記録なし</span>
          </button>
          <button class="mode" type="button" data-mode="ta">
            <span class="mode-name">タイムアタック</span>
            <span class="mode-desc">毎回同じコース 1,000 m</span>
            <span class="mode-best" id="bestTa">記録なし</span>
          </button>
        </div>
        <p class="howto"><span class="touch-only">画面をタップで</span><span class="kbd-only">クリック か <kbd>Space</kbd> で</span>ジャンプ。長押しで高く、空中でもう一度で2段ジャンプ</p>
      </div>
    </div>

    <div class="overlay dim" id="over" hidden>
      <div class="card">
        <span class="ribbon" id="newrec" hidden>自己ベスト更新!</span>
        <p class="reason" id="reason">泥の斜面を転げ落ちた!</p>
        <p class="sub" id="reasonSub"></p>
        <p class="result" id="result">0<small>m</small></p>
        <p class="rank" id="rankLine">称号 <b id="rankName">見習い運転手</b></p>
        <p class="sub" id="bestLine"></p>
        <dl class="stats" id="stats"></dl>
        <div class="btn-row">
          <button class="btn" id="retryBtn" type="button">もう一回</button>
          <button class="btn ghost" id="toTitleBtn" type="button">タイトル</button>
        </div>
        <p class="kbd-hint kbd-only">Space でもう一回 ／ Esc でタイトル</p>
      </div>
    </div>

    <div class="overlay dim" id="pause" hidden>
      <div class="card">
        <p class="reason">一時停止</p>
        <p class="sub" id="pauseM">0 m 地点</p>
        <div class="btn-row">
          <button class="btn" id="resumeBtn" type="button">再開</button>
          <button class="btn ghost" id="quitBtn" type="button">やめる</button>
        </div>
        <p class="kbd-hint kbd-only">P か Esc でも再開</p>
      </div>
    </div>
  </div>
  <div class="pad" id="pad" hidden>
    <span class="pad-main">タップでジャンプ</span>
    <span class="pad-sub">長押しで高く跳ぶ</span>
  </div>
  <p class="rotate-hint" id="rotateHint" hidden>横向きにすると<b>大きな画面</b>で遊べます</p>
</div>

<script>
(() => {
  'use strict';

  // ---- 定数 ----
  const W = 800, H = 450;        // 論理座標。縦に長い画面では空を上に足す
  const GROUND = 330;            // 道の表面
  const ROAD_H = 24;             // あぜ道の厚み
  const PIT_D = 46;              // 泥の穴の深さ
  const GRAV = 2300;
  const JUMP_V = 780;
  const AIR = 2 * JUMP_V / GRAV; // 目いっぱい跳んだときの滞空時間
  const AIR2 = 0.95;             // 2段ジャンプを使ったときの、無理のない滞空時間
  const TRUCK_X = 140;           // 画面上の軽トラの左端
  const TRUCK_W = 96;
  const TRUCK_FRONT = TRUCK_X + TRUCK_W;
  const PX_PER_M = 25;           // 25px = 1m
  const SLIP_TIME = 0.6;
  const MAX_SPEED = 760;
  const ACCEL = 170;             // 減速から立ち直る加速（px/s²）
  const BUMP_LIMIT = 3;          // ボコボコ道に何回乗るとパンクするか
  const GOAL_M = 1000;           // タイムアタックの距離
  const STEP_LO = 56;            // 1回のジャンプで登れる段（土手）
  const STEP_HI = 150;           // 2段ジャンプでないと登れない段（石垣）。1回のジャンプの頂点は約132
  const TA_SEED = 20260929;      // タイムアタックは毎回同じコース
  const GHOST_DT = 1 / 30;       // ゴーストを記録する間隔（秒）

  const $ = id => document.getElementById(id);
  const app = $('app'), stage = $('stage'), cv = $('cv');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const titleEl = $('title'), overEl = $('over'), pauseEl = $('pause');
  const soundBtn = $('soundBtn'), pauseBtn = $('pauseBtn');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 保存 ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
  };
  let best = Number(store.get('keitora-best', 0)) || 0;               // エンドレスの最長距離（m）
  let bestTime = Number(store.get('keitora-best-time-6', 0)) || 0;      // タイムアタックの最速（秒）
  let soundOn = store.get('keitora-sound', '1') === '1';
  let mode = store.get('keitora-mode', 'endless') === 'ta' ? 'ta' : 'endless';
  let bestScore = Number(store.get('keitora-best-score', 0)) || 0;    // エンドレスの配達スコア
  function loadGhost() {
    try {
      const g = JSON.parse(store.get('keitora-ghost-6', 'null'));
      return g && g.seed === TA_SEED && Array.isArray(g.f) && g.f.length >= 6 ? g : null;
    } catch (e) { return null; }
  }
  let ghost = loadGhost();

  const fmtM = m => m.toLocaleString('ja-JP');
  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = sec - m * 60;
    return m + ':' + s.toFixed(2).padStart(5, '0');
  }

  // ---- 音 ----
  let ac = null, sfxBus = null, musicBus = null;
  function initAudio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(ac.destination);
        musicBus = ac.createGain(); musicBus.gain.value = 0; musicBus.connect(ac.destination);
        setInterval(musicTick, 30);
      } catch (e) { ac = null; }
    }
    // タブを切り替えたり、ページが新しい版に替わったりすると止まっていることがある（iPhone では interrupted）
    if (ac && ac.state !== 'running') { try { ac.resume(); } catch (e) {} }
  }
  // 画面に触れた・キーを押したら、いつでも音を起こし直す（ブラウザは操作のあとでないと音を出さない）
  for (const ev of ['pointerdown', 'touchend', 'keydown', 'click']) {
    window.addEventListener(ev, () => initAudio(), { capture: true, passive: true });
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(sfxBus);
    o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol, freq, type = 'lowpass', delay = 0) {
    const t = ac.currentTime + delay;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);

  const spillTomatoes = (n, wx, y, vx) => emit(n, wx, y, { vx, vy: [-420, -150], life: [0.8, 1.4], r: [4, 6], col: '#e0392b', tomato: true });
  function loseTomato(n, why) {
    if (tomatoes <= 0 || state !== 'play') return;
    const k = Math.min(n, tomatoes);
    tomatoes -= k;
    stats.lost += k;
    spillTomatoes(k, cam + TRUCK_X + 22, truck.y - 48, [-240, -80]);
    sfx('tomato');
    if (why) popup(tomatoes > 0 ? `${why} 残り ${tomatoes} 個` : 'トマトが空っぽ!', '#ff8f7a');
  }
  function showBanner(text, color, sub) { banner = { text, sub, color, t: 1.6 }; }
  function popup(text, color) { popups.push({ text, color, t: 1.1 }); }

  // ---- 入力 ----
  function press() {
    initAudio();
    if (paused) return;
    if (state === 'play') { jumpBuf = 0.12; holding = true; }
    else if (state === 'title') start(mode);
    else if (state === 'over' && dieT > 0.7) start(mode);
  }
  function release() {
    holding = false;
    if (state === 'play' && truck.jumped && truck.vy < -250) truck.vy *= 0.45;
  }
  app.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (state === 'over' && e.target.closest('.card')) return;
    if (paused) return;
    e.preventDefault();
    if (state === 'play') $('pad').classList.add('on');
    press();
  });
  const up = () => { $('pad').classList.remove('on'); release(); };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'play') { e.preventDefault(); setPaused(!paused); }
      else if (state === 'over' && e.code === 'Escape') toTitle();
      return;
    }
    if (state === 'title' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      setMode(mode === 'ta' ? 'endless' : 'ta');
      return;
    }
    if (JUMP_KEYS.includes(e.code) || (e.code === 'Enter' && !(e.target.closest && e.target.closest('button')))) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') release(); });
  for (const b of document.querySelectorAll('.mode')) {
    b.addEventListener('click', () => { initAudio(); start(b.dataset.mode); });
  }
  $('retryBtn').addEventListener('click', () => { initAudio(); start(mode); });
  $('toTitleBtn').addEventListener('click', () => toTitle());
  $('resumeBtn').addEventListener('click', () => { initAudio(); setPaused(false); });
  $('quitBtn').addEventListener('click', () => { setPaused(false); toTitle(); });
  pauseBtn.addEventListener('click', () => setPaused(!paused));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play') setPaused(true);
    // 戻ってきたら音を起こし直す（止まったままにならないように）
    if (!document.hidden && ac && ac.state !== 'running') { try { ac.resume(); } catch (e) {} }
  });
  window.addEventListener('pageshow', () => { if (ac && ac.state !== 'running') { try { ac.resume(); } catch (e) {} } });

  function setPaused(p) {
    if (state !== 'play') p = false;
    paused = p;
    pauseEl.hidden = !p;
    pauseBtn.hidden = p || state !== 'play';
    holding = false;
    if (p) $('pauseM').textContent = (mode === 'ta' ? fmtTime(runTime) + ' ／ ' : '') + fmtM(meters()) + ' m 地点';
    last = performance.now();
    sfx('ui');
  }
  function setMode(m) {
    mode = m;
    store.set('keitora-mode', m);
    for (const b of document.querySelectorAll('.mode')) b.classList.toggle('selected', b.dataset.mode === m);
    renderPad();
  }

  function start(m) {
    setMode(m);
    rng = mode === 'ta' ? seeded(TA_SEED) : Math.random;
    reset();
    state = 'play';
    paused = false;
    titleEl.hidden = true;
    overEl.hidden = true;
    pauseEl.hidden = true;
    pauseBtn.hidden = false;
    if (mode === 'ta') showBanner('スタート!', '#fffbea', 'ゴールまで 1,000 m');
    renderPad();
  }
  function toTitle() {
    reset();
    state = 'title';
    overEl.hidden = true;
    pauseEl.hidden = true;
    pauseBtn.hidden = true;
    renderTitleBest();
    titleEl.hidden = false;
    renderPad();
    focusIfKeyboard(document.querySelector('.mode.selected'));
  }
  function renderTitleBest() {
    $('bestEndless').innerHTML = bestScore > 0 ? `ベスト <b>${fmtM(bestScore)} 点</b>（${fmtM(best)} m）` : (best > 0 ? `ベスト <b>${fmtM(best)} m</b>` : '記録なし');
    $('bestTa').innerHTML = bestTime > 0 ? `ベスト <b>${fmtTime(bestTime)}</b>　ゴーストと競走` : '記録なし';
  }

  // 称号
  const RANKS = [
    [0, '見習い運転手'], [150, '若葉マーク'], [300, '田植え帰り'], [500, 'あぜ道の常連'],
    [800, 'トマト運び名人'], [1200, '農道の韋駄天'], [1800, 'あぜ道マスター'], [2600, '伝説の軽トラ乗り'],
  ];
  const rankOf = m => RANKS.filter(([d]) => m >= d).pop()[1];
  const TA_RANKS = [[66.3, '伝説の軽トラ乗り'], [67.5, 'あぜ道マスター'], [69, '農道の韋駄天'], [71, 'トマト運び名人'], [74, 'あぜ道の常連'], [Infinity, '若葉マーク']];
  const taRankOf = t => TA_RANKS.find(([s]) => t <= s)[1];

  const REASONS = {
    fall: ['泥の斜面を転げ落ちた!', 'トマトが泥だらけ…'],
    boar: ['イノシシに激突!', '軽トラがボコボコ…'],
    flat: ['タイヤがパンクした!', 'ボコボコ道に 3 回乗り上げた'],
    wall: ['あぜに激突!', '段差を登りきれなかった…'],
  };
  function die(kind) {
    if (state !== 'play') return;
    state = 'dying';
    dieT = 0;
    truck.dead = true;
    truck.deathKind = kind;
    pauseBtn.hidden = true;
    if (kind === 'boar') {
      shake = 0.5; flash = 0.25; truck.dent = 1; truck.spilled = true;
      sfx('boar');
      spillTomatoes(14, cam + TRUCK_X + 28, truck.y - 50, [-60, 260]);
    } else if (kind === 'wall') {
      shake = 0.45; flash = 0.2; truck.dent = 1; truck.spilled = true;
      truck.vy = -220;
      sfx('crash');
      spillTomatoes(12, cam + TRUCK_X + 28, truck.y - 50, [-40, 220]);
      emit(16, cam + TRUCK_FRONT, truck.y - 20, { vx: [-220, 60], vy: [-300, -60], life: [0.4, 0.8], r: [2, 5], col: '#8a6440' });
    } else if (kind === 'flat') {
      truck.flat = true; shake = 0.2;
      sfx('pop');
      emit(12, cam + TRUCK_FRONT - 18, GROUND - 6, { vx: [-40, 160], vy: [-260, -80], life: [0.3, 0.7], r: [2, 4], col: '#2a2a2a' });
    }
  }
  function finish() {
    state = 'goal';
    dieT = 0;
    goalTime = runTime;
    ghostRec.push(Math.round(cam), Math.round(truck.y), Math.round(truck.angle * 100));
    pauseBtn.hidden = true;
    sfx('goal');
    for (let i = 0; i < 4; i++) {
      emit(14, goalX() - 20 + i * 12, GROUND - 90, { vx: [-160, 200], vy: [-420, -120], life: [0.8, 1.6], r: [2, 4], col: ['#f2b33d', '#e2543a', '#fffbea', '#6aa23c'][i], g: 500 });
    }
  }
  function statHTML(items) {
    return items.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  }
  function showOver() {
    const endState = state;
    state = 'over';
    dieT = 0;
    const m = meters();
    const reasonEl = $('reason');
    let rec = false;
    if (mode === 'ta' && endState === 'goal') {
      const prev = bestTime;
      rec = prev === 0 || goalTime < prev;
      if (rec) {
        bestTime = goalTime;
        store.set('keitora-best-time-6', bestTime.toFixed(3));
        ghost = { seed: TA_SEED, dt: GHOST_DT, t: goalTime, f: ghostRec };
        store.set('keitora-ghost-6', JSON.stringify(ghost));
      }
      reasonEl.textContent = 'ゴール!';
      reasonEl.classList.add('win');
      $('reasonSub').textContent = '1,000 m 走りきった';
      $('result').innerHTML = `${fmtTime(goalTime)}`;
      $('rankLine').hidden = false;
      $('rankName').textContent = taRankOf(goalTime);
      $('bestLine').textContent = rec ? (prev > 0 ? `これまでのベスト ${fmtTime(prev)} を ${(prev - goalTime).toFixed(2)} 秒 縮めた` : 'はじめての記録')
        : `ベスト ${fmtTime(bestTime)}（+${(goalTime - bestTime).toFixed(2)} 秒）`;
      $('stats').innerHTML = statHTML([['運べたトマト', `${tomatoes} / ${TOMATO_MAX}`], ['減速', stats.slows + ' 回'], ['最高速度', stats.maxKmh + ' km/h']]);
    } else {
      reasonEl.classList.remove('win');
      reasonEl.textContent = REASONS[truck.deathKind][0];
      $('reasonSub').textContent = REASONS[truck.deathKind][1];
      if (mode === 'ta') {
        $('result').innerHTML = `${fmtM(m)}<small>m</small>`;
        $('rankLine').hidden = true;
        $('bestLine').textContent = `リタイア。ゴールまで あと ${fmtM(Math.max(0, GOAL_M - m))} m`;
        $('stats').innerHTML = statHTML([['タイム', fmtTime(runTime)], ['運べたトマト', `${tomatoes} / ${TOMATO_MAX}`], ['最高速度', stats.maxKmh + ' km/h']]);
      } else {
        // エンドレスは「運んだトマト × 距離」の合計が配達スコア
        const prev = bestScore;
        rec = score > bestScore;
        if (rec) { bestScore = score; store.set('keitora-best-score', bestScore); }
        if (m > best) { best = m; store.set('keitora-best', best); }
        $('result').innerHTML = `${fmtM(score)}<small>点</small>`;
        $('rankLine').hidden = false;
        $('rankName').textContent = rankOf(m);
        $('bestLine').textContent = `${fmtM(m)} m 走行　` + (!rec ? `ベスト ${fmtM(bestScore)} 点`
          : prev > 0 ? `ベストを ${fmtM(score - prev)} 点 更新` : 'はじめての記録');
        $('stats').innerHTML = statHTML([['タイム', fmtTime(runTime)], ['落としたトマト', stats.lost + ' 個'], ['イノシシ回避', stats.boars + ' 頭']]);
      }
    }
    $('newrec').hidden = !rec;
    overEl.hidden = false;
    renderPad();
    focusIfKeyboard($('retryBtn'));
  }

  // ---- 更新 ----
  function update(dt) {
    const tx = state === 'title' ? 560 : TRUCK_X;
    truckX += (tx - truckX) * Math.min(1, dt * (reduceMotion ? 60 : 5));
    if (state === 'title') { cam += 70 * dt; wheelA += 70 * dt / 11; updateParts(dt); return; }
    if (state === 'over') {
      dieT += dt;
      if (truck.dent && Math.random() < dt * 6) steam();
      updateParts(dt);
      return;
    }

    const cx = cam + TRUCK_X + TRUCK_W / 2;

    if (state === 'play') {
      runTime += dt;
      speed = cruise(meters());
      generate();
      const m = meters();
      if (Math.floor(m / 100) > lastMile) {
        lastMile = Math.floor(m / 100);
        if (!(mode === 'ta' && m >= GOAL_M)) {
          const left = mode === 'ta' ? `残り ${fmtM(GOAL_M - lastMile * 100)} m` : (lastMile % 5 === 0 ? 'スピードアップ!' : null);
          showBanner(lastMile * 100 + ' m', '#fffbea', left);
          sfx('mile');
        }
      }
      if (mode === 'endless' && !passedBest && m > best) {
        passedBest = true;
        showBanner('ベスト更新!', '#f2b33d');
        sfx('record');
      }
      if (mode === 'ta') {
        while (recT <= runTime) { ghostRec.push(Math.round(cam), Math.round(truck.y), Math.round(truck.angle * 100)); recT += GHOST_DT; }
        if (cam + TRUCK_FRONT >= goalX()) finish();
      }
      // 配達スコア：1 m 進むごとに、積んでいるトマトの数だけ加点
      if (m > scoreM) { score += (m - scoreM) * tomatoes; scoreM = m; }
      // エンドレスは 500 m ごとのトマト畑で満杯に積み直す
      if (mode === 'endless' && Math.floor(m / REFILL_M) > lastRefill) {
        lastRefill = Math.floor(m / REFILL_M);
        const add = TOMATO_MAX - tomatoes;
        tomatoes = TOMATO_MAX;
        popup(add > 0 ? `トマト畑で積み直し +${add} 個` : 'トマト畑を通過 全部無事!', '#a8e27f');
        sfx('dodge');
      }
      const si = seasonAt(m).i;
      if (si !== seasonIdx) {
        seasonIdx = si;
        // 2,000 m で季節が一巡しても、コースは続いている。2周目からは「2年目の田植え」
        const year = Math.floor(m / SEASON_LEN) + 1;
        const name = si === 0 && year > 1 ? `${year}年目の${SEASONS[si].name}` : SEASONS[si].name;
        if (!banner || banner.t < 0.8) showBanner(name, '#fffbea', SEASONS[si].sub);
      }
    }

    // 前進：普段は巡航速度へ加速、ボコボコ道の上では減速
    if (state === 'play') {
      let target = speed;
      const bmp = find('bump', cx);
      if (bmp && GROUND - bmp.lv - truck.y < 40) target = speed * 0.4;
      vel += clamp(target - vel, -900 * dt, ACCEL * dt);
    } else if (state === 'goal') {
      vel *= Math.pow(0.3, dt);
    } else if (truck.falling) {
      truck.fallV *= Math.pow(0.3, dt);
      vel = truck.fallV;
    } else if (truck.flat) {
      vel *= Math.pow(0.05, dt);
      if (vel > 60 && Math.random() < dt * 30) emit(1, cam + TRUCK_FRONT - 18, GROUND - 2, { vx: [-80, -20], vy: [-80, -20], life: [0.3, 0.6], r: [3, 6], col: '#c7a77c', g: 60 });
    } else if (truck.dead) {
      vel = 0;
    }
    cam += vel * dt;
    wheelA += vel * dt / 11;
    if (state === 'play') stats.maxKmh = Math.max(stats.maxKmh, kmh(vel));

    // ジャンプ
    jumpBuf -= dt;
    truck.coyote -= dt;
    slip -= dt;
    tireFlash = Math.max(0, tireFlash - dt);
    const lift = GROUND - supportY();
    camY += (lift - camY) * Math.min(1, dt * 3.5);
    if (state === 'play' && jumpBuf > 0 && truck.coyote > 0 && slip <= 0) {
      truck.vy = -JUMP_V * (find('bump', cx) ? 0.8 : 1);
      truck.grounded = false;
      truck.jumped = true;
      truck.coyote = 0;
      jumpBuf = 0;
      stats.jumps++;
      sfx('jump');
      emit(6, cam + TRUCK_X + 16, truck.y, { vx: [-160, -40], vy: [-160, -40], life: [0.3, 0.6], r: [3, 6], col: '#b89468' });
    } else if (state === 'play' && jumpBuf > 0 && !truck.grounded && truck.airJumps < 1 && slip <= 0) {
      // 2段ジャンプ：空中でもう一度だけ跳べる（1回目より少し弱い）
      truck.vy = -JUMP_V * 0.82;
      truck.airJumps = 1;
      truck.jumped = true;
      truck.squash = 0.6;
      jumpBuf = 0;
      stats.jumps++;
      sfx('jump2');
      // 空気を蹴った輪
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        emit(1, cam + TRUCK_X + TRUCK_W / 2 + Math.cos(a) * 20, truck.y + 2 + Math.sin(a) * 5,
          { vx: [Math.cos(a) * 170, Math.cos(a) * 170], vy: [Math.sin(a) * 40, Math.sin(a) * 40], life: [0.25, 0.35], r: [2, 3], col: 'rgba(255,255,255,.85)', g: 0 });
      }
    }

    truck.squash = Math.max(0, truck.squash - dt * 5);
    if (truck.falling) updateFall(dt, cx);
    else {
      truck.vy += GRAV * dt;
      truck.y += truck.vy * dt;
      const hole = state === 'play' ? find('gap', cx) : null;
      if (hole) {
        truck.grounded = false;
        if (truck.y > GROUND - (hole.lv || 0) + 8) {
          truck.falling = true;
          truck.pit = hole;
          truck.fallV = vel;
          truck.fallT = 0;
          sfx('slide');
          truck.vy = Math.max(truck.vy, 100);
          die('fall');
        }
      } else if (state === 'play' && groundAt(cam + TRUCK_FRONT - 6) < groundAt(cam + TRUCK_X + 18) - 1
        && truck.y > groundAt(cam + TRUCK_FRONT - 6) + 6) {
        // 前に登りの段があって、その壁に届かなかった
        const gF = groundAt(cam + TRUCK_FRONT - 6), rise = groundAt(cam + TRUCK_X + 18) - gF;
        const tol = rise > 100 ? 26 : 20;
        if (truck.y - gF <= tol) {
          // 少し足りないだけなら、前輪で縁をつかんで乗り上げる
          truck.y = gF;
          truck.vy = Math.min(truck.vy, -140);
          truck.squash = 0.7;
          truck.grounded = false;
          sfx('clunk');
          popup('ギリギリ!', '#f2b33d');
          emit(8, cam + TRUCK_FRONT - 6, gF, { vx: [-160, 40], vy: [-160, -40], life: [0.3, 0.6], r: [2, 5], col: '#8a6440' });
        } else die('wall');
      } else if (truck.y >= supportY()) {
        if (!truck.grounded && truck.vy > 500) {
          // 目いっぱい跳んでドスンと着地すると、ときどきトマトが落ちる
          // 着地の衝撃が強いほど落ちやすい。石垣から飛び降りるような強い衝撃なら2個
          const hit = truck.vy;
          if (Math.random() < clamp((hit - 600) / 400, 0, 0.95)) loseTomato(hit > 900 ? 2 : 1, 'ドスン! トマトが落ちた');
          sfx('land');
          truck.squash = 1;
          emit(8, cam + TRUCK_X + 20, supportY(), { vx: [-200, 40], vy: [-120, -20], life: [0.3, 0.6], r: [3, 6], col: '#b89468' });
        }
        truck.y = supportY(); truck.vy = 0;
        truck.grounded = true; truck.jumped = false; truck.airJumps = 0;
        truck.coyote = 0.09;
      } else {
        truck.grounded = false;
      }

      if (state === 'play') {
        // ボコボコ道：乗り上げたら回数を数え、3回目でパンク
        const bo = truck.grounded ? find('bump', cx) : null;
        if (bo && !bo.hit) {
          bo.hit = true;
          bumpHits++;
          stats.slows++;
          tireFlash = 1;
          sfx('clunk');
          if (bumpHits >= BUMP_LIMIT) die('flat');
          else popup(`ガタン! パンクまで あと ${BUMP_LIMIT - bumpHits} 回`, '#ffb49f');
        }
        if (find('bump', cx) && vel > 40) {
          truck.rattleT = (truck.rattleT || 0) - dt;
          if (truck.rattleT <= 0) { sfx('rattle'); truck.rattleT = 0.055 + Math.random() * 0.03; }
        }
        if (bo && state === 'play') {
          truck.bumpT -= dt;
          if (truck.bumpT <= 0) {
            truck.vy = -rand(90, 240);
            truck.grounded = false;
            truck.jumped = false;
            truck.bumpT = rand(0.1, 0.26);
            if (Math.random() < 0.45) loseTomato(1, 'ガタガタ! トマトが落ちた');
            sfx('bump');
            emit(3, cam + TRUCK_X + 76, GROUND, { vx: [-120, 20], vy: [-150, -60], life: [0.2, 0.4], r: [2, 5], col: '#8a6a45' });
          }
        }
        // 水たまり：滑って減速、少しの間ジャンプできない
        if (truck.grounded && slip <= 0 && find('puddle', cx)) {
          slip = SLIP_TIME;
          vel *= 0.45;
          stats.slows++;
          loseTomato(2, 'ツルッ! トマトが落ちた');
          sfx('slip');
          emit(18, cx, GROUND, { vx: [-260, 120], vy: [-320, -90], life: [0.4, 0.8], r: [2, 5], col: '#7c9bb0' });
        }
      }
      if (truck.grounded && vel > 60 && Math.random() < dt * 18) {
        emit(1, cam + TRUCK_X + 8, truck.y - 2, { vx: [-90, -30], vy: [-60, -10], life: [0.3, 0.6], r: [3, 6], col: slip > 0 ? '#7c9bb0' : '#c7a77c', g: 60 });
      }
    }

    // 角度
    if (!truck.falling) {
      let target = 0;
      if (truck.deathKind === 'boar' || truck.deathKind === 'wall') target = -0.12;
      else if (truck.flat) target = 0.07;
      else if (!truck.grounded) target = clamp(truck.vy / 2500, -0.2, 0.3);
      truck.angle += (target - truck.angle) * Math.min(1, dt * 10);
    }
    if (truck.dent && Math.random() < dt * 10) steam();

    updateBoars(dt);

    // 初めて見る障害物は、軽トラを通り過ぎたら説明済みにする
    for (const st of steps) if (st.x < cam + TRUCK_X) seenTypes.add(stepKind(st));
    for (const o of obs) {
      if (o.t !== 'boar' && o.x + o.w < cam + TRUCK_X) seenTypes.add(o.t);
      if (o.t === 'boar' && o.counted) seenTypes.add('boar');
    }

    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    for (const p of popups) p.t -= dt;
    popups = popups.filter(p => p.t > 0);
    updateParts(dt);

    if (state === 'dying' || state === 'goal') {
      dieT += dt;
      const wait = state === 'goal' ? 1.6 : truck.deathKind === 'fall' ? 1.9 : 1.4;
      if (dieT > wait) showOver();
    }
  }

  // 段の種類：登る段は高さで土手か石垣か、下りる段は 'down'
  function stepKind(st) {
    const i = steps.indexOf(st);
    const prev = i > 0 ? steps[i - 1].h : 0;
    const dh = st.h - prev;
    return dh <= 0 ? 'down' : dh > 100 ? 'stepHi' : 'stepLo';
  }
  // 泥の斜面を滑り落ち、車体の前後の軸でごろごろ横転する
  const MUD_COLS = ['#3e2814', '#4f341b', '#5f4124', '#6e4c2b'];
  function mudSplash(n, wx, y, spread, up) {
    for (let i = 0; i < n; i++) {
      emit(1, wx, y, { vx: [-spread, spread], vy: [-up, -up * 0.3], life: [0.6, 1.2], r: [1.5, 4.5], col: MUD_COLS[i % MUD_COLS.length], stick: true });
    }
  }
  function updateFall(dt, cx) {
    const pit = truck.pit;
    truck.fallT += dt;
    // 穴の向こう側の斜面の手前で止まる
    if (cx > pit.x + pit.w - pitRun(pit.w) - 40) { truck.fallV = 0; vel = 0; }
    const surf = pitSurface(pit, cx);
    truck.vy += GRAV * dt;
    truck.y = Math.min(truck.y + truck.vy * dt, surf);
    if (truck.y >= surf) {
      truck.vy = 0;
      const wy = WATER_Y - (pit.lv || 0);
      if (!truck.splashed && truck.y >= wy + 10) {
        truck.splashed = true;
        truck.splashT = truck.fallT;
        truck.mud = 1;
        sfx('mud');
        shake = 0.25;
        mudSplash(22, cx, wy, 240, 480);
        emit(14, cx, wy, { vx: [-200, 200], vy: [-340, -120], life: [0.4, 0.8], r: [1.5, 3], col: 'rgba(200,215,205,.8)' });
      }
    }
    // 斜面では鼻先から突っ込み、転がり始めたら水平に戻る
    const slide = clamp(truck.fallT / 0.3, 0, 1);
    const t = clamp((truck.fallT - 0.12) / 1.4, 0, 1);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const prev = truck.roll || 0;
    truck.roll = 3 * Math.PI * e;
    truck.angle = 0.42 * slide * (1 - Math.min(1, e * 2.5));
    if (Math.floor(prev / (Math.PI / 2)) !== Math.floor(truck.roll / (Math.PI / 2))) {
      sfx('roll');
      mudSplash(4, cx, truck.y - 6, 130, 260);
    }
    if (!truck.spilled && truck.fallT > 0.3) {
      truck.spilled = true;
      spillTomatoes(Math.min(16, tomatoes + 2), cx - 10, truck.y - 44, [-140, 240]);
    }
  }

  function steam() {
    emit(1, cam + TRUCK_FRONT - 10, truck.y - 30, { vx: [-20, 30], vy: [-90, -40], life: [0.6, 1.1], r: [4, 8], col: 'rgba(240,240,235,.8)', g: -20 });
  }

  function updateBoars(dt) {
    for (const o of obs) {
      if (o.t !== 'boar') continue;
      if (o.state === 'pending' && state === 'play' && cam + W >= o.x - speed * 0.9) {
        o.state = 'warn'; o.wt = 0.9; sfx('warn');
      }
      if (o.state === 'warn') {
        o.wt -= dt;
        if (o.wt <= 0) {
          o.state = 'run';
          o.px = cam + W + 40;
          o.vx = o.vx0;
        }
      }
      if (o.state === 'hit') {
        // はね飛ばされる
        o.px += o.fvx * dt;
        o.fvy += GRAV * 0.7 * dt;
        o.fy = Math.min(0, o.fy + o.fvy * dt);
        if (o.fy === 0 && o.fvy > 0) { o.fvy = 0; o.fvx *= Math.pow(0.02, dt); } else o.rot += 9 * dt;
      }
      if (o.state === 'run') {
        o.px -= o.vx * dt; o.leg += dt * 22;
        if (o.px < cam - 150) o.state = 'gone';
        if (state === 'play' && !truck.falling) {
          const bs = o.px - cam;
          const tl = TRUCK_X + 10, tr = TRUCK_FRONT - 4;
          const tb = truck.y - 4, tt = truck.y - 46;
          const bg = GROUND - (o.lv || 0);
          const bl = bs - 24, br = bs + 22, bt = bg - 30, bb = bg;
          if (tr > bl && tl < br && tb > bt && tt < bb) {
            o.state = 'hit';
            o.fvx = 260; o.fvy = -520; o.fy = 0; o.rot = 0;
            emit(20, o.px, bg - 20, { vx: [-200, 250], vy: [-450, -150], life: [0.4, 0.9], r: [2, 5], col: '#fff3c4' });
            die('boar');
          } else if (!o.counted && br < tl) {
            o.counted = true;
            stats.boars++;
            popup('かわした!', '#f2b33d');
            sfx('dodge');
          }
        }
      }
    }
  }

  function updateParts(dt) {
    for (const p of parts) {
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      // トマトは道で止まる
      if (p.tomato || p.stick) {
        const pit = find('gap', p.x);
        const floor = (pit ? Math.min(pitSurface(pit, p.x), WATER_Y - (pit.lv || 0) + 2) : groundAt(p.x)) - (p.tomato ? 4 : 1);
        if (p.y > floor) { p.y = floor; p.vy = 0; p.vx *= p.stick ? 0.2 : 0.8; if (p.stick) p.flat = true; }
      }
    }
    parts = parts.filter(p => p.life > 0);
  }

  // ---- 季節と時間帯（距離で移り変わり、2,000 m で一巡する） ----
  const SEASON_LEN = 2000;
  const SEASONS = [
    { m: 0, name: '田植え', sub: '水を張った田んぼ', skyTop: '#6ec3ea', skyBot: '#f4f1dc', sun: '#fff3c8', sunY: 120, sunR: 32,
      mtnFar: '#a9c1bb', mtnNear: '#7fa37e', field: '#9cc3b0', stripeA: '#8db8a3', stripeB: '#b3d5c5',
      water1: '#86b5ab', water2: '#4d7d71', rice: '#86c45a', riceH: 0.55, grain: 0, night: 0, cloud: 0.85, duck: 1, harvest: 0 },
    { m: 350, name: '青田', sub: '稲がぐんぐん伸びる', skyTop: '#5fb3dd', skyBot: '#fbe8b8', sun: '#fff0be', sunY: 120, sunR: 32,
      mtnFar: '#9fb8b2', mtnNear: '#6f9870', field: '#86b94c', stripeA: '#78ab41', stripeB: '#93c457',
      water1: '#6f9e8a', water2: '#3e6a5c', rice: '#5fa032', riceH: 1, grain: 0, night: 0, cloud: 0.85, duck: 1, harvest: 0 },
    { m: 750, name: '黄金の稲穂', sub: '稲刈りの季節', skyTop: '#6fb0da', skyBot: '#fde2a4', sun: '#fff0be', sunY: 120, sunR: 32,
      mtnFar: '#b0b597', mtnNear: '#8c9352', field: '#d8b449', stripeA: '#c7a03a', stripeB: '#e7c75c',
      water1: '#9a9a62', water2: '#5d5f3b', rice: '#c9a238', riceH: 2.0, grain: 1, night: 0, cloud: 0.85, duck: 0, harvest: 1 },
    { m: 1150, name: '夕焼け', sub: '日が傾いてきた', skyTop: '#3c5b92', skyBot: '#f7a25c', sun: '#ff8a4a', sunY: 210, sunR: 40,
      mtnFar: '#8a7890', mtnNear: '#5f5a5c', field: '#b98a3c', stripeA: '#a77a32', stripeB: '#c99a48',
      water1: '#8a6f55', water2: '#4a3d35', rice: '#ab812e', riceH: 1.9, grain: 1, night: 0.15, cloud: 0.6, duck: 0, harvest: 1 },
    { m: 1550, name: '夜', sub: 'ライトを点けて走れ', skyTop: '#0b1430', skyBot: '#2a3a68', sun: '#f4f1d8', sunY: 90, sunR: 20,
      mtnFar: '#26324d', mtnNear: '#1c2630', field: '#2f4030', stripeA: '#283828', stripeB: '#36483a',
      water1: '#2a3d48', water2: '#122029', rice: '#3c5a33', riceH: 1.1, grain: 0, night: 1, cloud: 0.12, duck: 0, harvest: 0 },
  ];
  const COLOR_KEYS = ['skyTop', 'skyBot', 'sun', 'mtnFar', 'mtnNear', 'field', 'stripeA', 'stripeB', 'water1', 'water2', 'rice'];
  const NUM_KEYS = ['sunY', 'sunR', 'riceH', 'grain', 'night', 'cloud', 'duck', 'harvest'];
  const toRGB = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  for (const se of SEASONS) for (const k of COLOR_KEYS) se['_' + k] = toRGB(se[k]);
  // 次の季節の 120 m 手前から少しずつ色が移る
  function seasonAt(m) {
    const mm = ((m % SEASON_LEN) + SEASON_LEN) % SEASON_LEN;
    let i = 0;
    for (let k = 0; k < SEASONS.length; k++) if (mm >= SEASONS[k].m) i = k;
    const nextM = i + 1 < SEASONS.length ? SEASONS[i + 1].m : SEASON_LEN;
    return { i, j: (i + 1) % SEASONS.length, t: clamp((mm - (nextM - 120)) / 120, 0, 1) };
  }
  function envAt(m) {
    const { i, j, t } = seasonAt(m);
    const a = SEASONS[i], b = SEASONS[j], e = {};
    for (const k of COLOR_KEYS) {
      const x = a['_' + k], y = b['_' + k];
      e[k] = `rgb(${Math.round(x[0] + (y[0] - x[0]) * t)},${Math.round(x[1] + (y[1] - x[1]) * t)},${Math.round(x[2] + (y[2] - x[2]) * t)})`;
    }
    for (const k of NUM_KEYS) e[k] = a[k] + (b[k] - a[k]) * t;
    return e;
  }
  let env = envAt(350);

  // ---- 描画 ----
  function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
  const FONT = '"DotGothic16", "MS Gothic", "Osaka-Mono", monospace';
  const bold = s => `900 ${s}px "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;

  function drawSky() {
    const top = -(VH - H) - 10;
    const g = ctx.createLinearGradient(0, top, 0, 250);
    g.addColorStop(0, env.skyTop);
    g.addColorStop(1, env.skyBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, 260 - top);
    // 星
    if (env.night > 0.05) {
      ctx.fillStyle = `rgba(255,250,230,${env.night * 0.9})`;
      for (let i = 0; i < 46; i++) {
        const x = hash(i * 3.1) * W, y = top + hash(i * 7.7) * (210 - top);
        const r = hash(i * 1.3) > 0.8 ? 2.2 : 1.4;
        ctx.fillRect(x, y, r, r);
      }
    }
    // 太陽（夜は三日月）
    ctx.fillStyle = env.sun;
    ctx.beginPath(); ctx.arc(600, env.sunY, env.sunR, 0, Math.PI * 2); ctx.fill();
    if (env.night > 0.5) {
      ctx.globalAlpha = (env.night - 0.5) * 2;
      ctx.fillStyle = env.skyTop;
      ctx.beginPath(); ctx.arc(608, env.sunY - 5, env.sunR * 0.88, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = `rgba(255,255,255,${env.cloud})`;
    const cOff = (cam * 0.05) % 1200;
    for (let i = 0; i < 4; i++) {
      const x = ((i * 330 - cOff) % 1200 + 1200) % 1200 - 200;
      const y = 110 + hash(i) * 60 + top * 0.4;
      for (const [dx, dy, rx, ry] of [[0, 0, 46, 14], [30, -8, 30, 14], [-26, -4, 24, 10]]) {
        ctx.beginPath(); ctx.ellipse(x + dx, y + dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawMountains(par, base, amp, col, seed) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, 260);
    const off = cam * par;
    for (let x = 0; x <= W + 20; x += 20) {
      const wx = (x + off) / 140 + seed;
      const y = base - amp * (0.55 * Math.sin(wx) + 0.3 * Math.sin(wx * 2.3 + 1) + 0.15 * Math.sin(wx * 5.1));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, 260);
    ctx.closePath();
    ctx.fill();
  }

  function drawFarField() {
    const top = 238;
    ctx.fillStyle = env.field;
    ctx.fillRect(0, top, W, GROUND - top + 10);
    for (let row = 0; row < 7; row++) {
      const y = top + 4 + row * row * 1.8 + row * 3;
      ctx.fillStyle = row % 2 ? env.stripeA : env.stripeB;
      ctx.fillRect(0, y, W, 2 + row * 0.8);
    }
    ctx.fillStyle = '#a28a5c';
    ctx.fillRect(0, top + 22, W, 3);
    const poleGap = 380;
    const pOff = (cam * 0.6) % poleGap;
    ctx.strokeStyle = 'rgba(60,50,40,.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -1; i < 4; i++) {
      const x = i * poleGap - pOff;
      ctx.moveTo(x, 196);
      ctx.quadraticCurveTo(x + poleGap / 2, 214, x + poleGap, 196);
    }
    ctx.stroke();
    ctx.fillStyle = '#5b4a3a';
    for (let i = -1; i < 4; i++) {
      const x = i * poleGap - pOff;
      ctx.fillRect(x - 2, 188, 4, 70);
      ctx.fillRect(x - 10, 194, 20, 3);
    }
    if (env.harvest > 0.02) drawHarvest();
  }

  // 収穫の時期：奥の田んぼに、コンバイン・はさ掛け・稲束を運ぶ人。奥行きを2層にしてにぎやかに
  function drawHarvest() {
    ctx.save();
    // いちばん奥の層（小さく、ゆっくり流れる）
    drawHarvestLayer(0.38, 262, 0.55, 300, 11);
    // 手前寄りの層
    drawHarvestLayer(0.5, 300, 1, 470, 0);
    ctx.restore();
  }
  function drawHarvestLayer(par, y, sc, gap, seed) {
    const far = cam * par;
    const k0 = Math.floor((far - 200) / gap);
    for (let k = k0; k <= k0 + Math.ceil(W / gap) + 2; k++) {
      const x = k * gap + hash(k * 4.1 + seed) * gap * 0.4 - far;
      if (x < -200 || x > W + 200) continue;
      const kind = ((k % 4) + 4) % 4;   // 0:コンバイン 1:はさ掛け（人つき） 2:長いはさ掛け 3:稲束を運ぶ人
      ctx.globalAlpha = env.harvest;
      if (kind === 0) {
        // コンバインは少しずつ右へ刈り進む。端まで行ったら薄く消えて、また左から
        const run = (clock * 12 + k * 97) % 360;
        ctx.globalAlpha = env.harvest * Math.min(1, run / 50, (360 - run) / 50);
        drawCombine(x + (run - 180) * sc, y, k, sc);
      } else if (kind === 1) {
        drawHazakake(x, y - 4 * sc, k, sc, 120, 1, true);
      } else if (kind === 2) {
        drawHazakake(x, y - 4 * sc, k, sc, 170, 2, hash(k * 2.3 + seed) > 0.5);
      } else {
        // 稲束を肩にかついで、はさ掛けへ運ぶ人（2人組のことも）
        const walk = (clock * 16 + k * 53) % 140;
        drawFarmer(x + walk * sc, y, k, sc, 'carry');
        if (hash(k * 7.7 + seed) > 0.4) drawFarmer(x + walk * sc - 26 * sc, y, k + 1, sc, 'carry');
      }
    }
    ctx.globalAlpha = 1;
  }
  // コンバイン：赤い車体、刈り取り部、ガラスの運転席、黒いクローラ、もみを出す筒
  function drawCombine(x, y, k, sc = 1, stubble = true) {
    if (x < -160 * sc || x > W + 160 * sc) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    // 刈ったあとの切り株（後ろに帯）
    if (stubble) { ctx.fillStyle = 'rgba(150,120,60,.55)'; ctx.fillRect(-160, -2, 150, 5); }
    // クローラ
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.roundRect(-32, -8, 52, 9, 4); ctx.fill();
    ctx.fillStyle = '#555';
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-26 + i * 10, -3.5, 2.2, 0, Math.PI * 2); ctx.fill(); }
    // 車体
    ctx.fillStyle = '#d8452e';
    ctx.fillRect(-34, -30, 46, 22);
    ctx.fillStyle = '#b8381f';
    ctx.fillRect(-34, -30, 46, 4);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(-30, -22, 20, 3);
    // もみタンクと排出オーガ
    ctx.fillStyle = '#c63f27';
    ctx.fillRect(-30, -40, 22, 10);
    ctx.strokeStyle = '#8c8c8c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-26, -40); ctx.lineTo(-40, -50); ctx.lineTo(-52, -50); ctx.stroke();
    // 運転席
    ctx.fillStyle = '#e8ecec';
    ctx.fillRect(2, -46, 16, 16);
    ctx.fillStyle = '#8cc3dc';
    ctx.fillRect(4, -44, 12, 9);
    ctx.fillStyle = '#3b2a1e';
    ctx.beginPath(); ctx.arc(9, -38, 2.6, 0, Math.PI * 2); ctx.fill();
    // 刈り取り部（前）と回るリール
    ctx.fillStyle = '#e6b43a';
    ctx.beginPath(); ctx.moveTo(12, -16); ctx.lineTo(36, -10); ctx.lineTo(36, -2); ctx.lineTo(12, -6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7a6a3a'; ctx.lineWidth = 1.5;
    const r = clock * 5;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = r + i * 2.1; ctx.moveTo(26, -12); ctx.lineTo(26 + Math.cos(a) * 7, -12 + Math.sin(a) * 7); }
    ctx.stroke();
    // 排気の煙と、後ろに吐き出すわらくず
    ctx.fillStyle = 'rgba(120,120,120,.35)';
    const puff = (clock * 2 + k) % 1;
    ctx.beginPath(); ctx.arc(-10 - puff * 10, -54 - puff * 14, 3 + puff * 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(230,200,120,.7)';
    for (let i = 0; i < 6; i++) { const t = (clock * 1.5 + i * 0.17) % 1; ctx.fillRect(-38 - t * 26, -12 + Math.sin(t * 6 + i) * 4 + t * 8, 3, 1.5); }
    ctx.restore();
  }
  // はさ掛け：竿に稲束を掛けて干す。長いものは2段。農家の人が稲束を持ち上げて掛けている
  function drawHazakake(x, y, k, sc = 1, len = 110, tiers = 1, farmer = true) {
    if (x < -220 * sc || x > W + 60) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    const barY = tiers === 2 ? [-44, -24] : [-26];
    const topY = barY[0] - 6;
    // 支柱と竿
    ctx.strokeStyle = '#6b5236'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    const n = Math.max(2, Math.round(len / 55));
    for (let i = 0; i <= n; i++) { const px = (len * i) / n; ctx.moveTo(px - 6, 0); ctx.lineTo(px, topY); ctx.lineTo(px + 6, 0); }
    for (const by of barY) { ctx.moveTo(-4, by); ctx.lineTo(len + 4, by); }
    ctx.stroke();
    // 掛けてある稲束（逆V字に垂れる）。すき間なくぎっしり
    for (const by of barY) {
      for (let bx = 5, i = 0; bx < len - 2; bx += 7, i++) {
        const tone = hash(k * 1.3 + i * 0.7 + by) * 0.18;
        ctx.fillStyle = `rgb(${Math.round(215 - tone * 90)},${Math.round(174 - tone * 80)},${Math.round(74 - tone * 40)})`;
        const hang = 17 + hash(i + k) * 3;
        ctx.beginPath(); ctx.moveTo(bx - 4.5, by + hang); ctx.lineTo(bx, by - 1); ctx.lineTo(bx + 4.5, by + hang); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#9c7a2e';
        ctx.fillRect(bx - 1, by - 2, 2, 3);
      }
    }
    ctx.restore();
    if (farmer) drawFarmer(x + (len + 18) * sc, y, k, sc, 'hang');
    // 足元に置いた稲束の山
    ctx.save();
    ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.fillStyle = '#c9a040';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(len + 30 + i * 5, -2 - (i % 2) * 3, 5, 3, -0.3, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  // 農家の人（麦わら帽子・手ぬぐい・作業着）。'hang' は稲束を竿に掛ける、'carry' は肩にかついで歩く
  function drawFarmer(x, y, k, sc, pose) {
    if (x < -40 || x > W + 40) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    const shirt = ['#5f7fa3', '#8a5a44', '#6f8a4a', '#9a7fb0'][((k % 4) + 4) % 4];
    const stepT = clock * 6 + k;
    const legA = pose === 'carry' ? Math.sin(stepT) * 3 : 0;
    ctx.fillStyle = '#3f4a5a';                       // もんぺ
    ctx.fillRect(-4 + legA, -12, 3, 12); ctx.fillRect(1 - legA, -12, 3, 12);
    ctx.fillStyle = shirt;                           // 上着
    ctx.fillRect(-5, -24, 10, 13);
    ctx.fillStyle = '#e8c9a4';                       // 顔
    ctx.beginPath(); ctx.arc(0, -28, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e9e2cf';                       // 手ぬぐい
    ctx.fillRect(-3.6, -31, 7.2, 2);
    ctx.fillStyle = '#e3c170';                       // 麦わら帽子
    ctx.beginPath(); ctx.ellipse(0, -31, 7.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -32, 3.6, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = shirt; ctx.lineWidth = 2.4;
    if (pose === 'hang') {
      // 腕を上げ下げして、稲束を竿へ
      const lift = (Math.sin(clock * 2.2 + k) + 1) / 2;
      const hx = -8 - lift * 3, hy = -20 - lift * 10;
      ctx.beginPath(); ctx.moveTo(-3, -21); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = '#d7ae4a';
      ctx.beginPath(); ctx.moveTo(hx - 4, hy + 2); ctx.lineTo(hx, hy - 12); ctx.lineTo(hx + 4, hy + 2); ctx.closePath(); ctx.fill();
    } else {
      // 肩にかついだ稲束
      ctx.beginPath(); ctx.moveTo(2, -21); ctx.lineTo(6, -27); ctx.stroke();
      ctx.fillStyle = '#d2a845';
      ctx.save(); ctx.translate(4, -27); ctx.rotate(-0.25);
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b08a35'; ctx.fillRect(-2, -3.5, 3, 7);
      ctx.restore();
    }
    ctx.restore();
  }

  // 手前の田んぼの稲刈り：コンバインが通ったあとは切り株になり、その先はまだ稲穂が立っている
  const CUT_ZONE = 1500;          // 手前の田んぼの区画（稲の列と同じ流れ方の座標）
  const cutT0 = new Map();        // 区画が初めて見えた時刻（コンバインはそこから刈り進む）
  function harvestIntervals() {
    const out = [];
    if (env.harvest < 0.5) return out;
    const k0 = Math.floor((cam - 400) / CUT_ZONE);
    for (let k = k0; k <= k0 + 2; k++) {
      const r = hash(k * 3.3);
      const z0 = k * CUT_ZONE + 150, zLen = 1000;
      if (r < 0.2) continue;                                 // まだ手つかずの田んぼ
      if (r > 0.82) { out.push({ a: z0, b: z0 + zLen, k, combine: null }); continue; }   // 刈り終わった田んぼ
      if (!cutT0.has(k)) cutT0.set(k, clock);
      const prog = Math.min(zLen, zLen * (0.2 + hash(k * 5.9) * 0.5) + (clock - cutT0.get(k)) * 26);
      out.push({ a: z0, b: z0 + prog, k, combine: z0 + prog });
    }
    if (cutT0.size > 40) cutT0.clear();
    return out;
  }

  function drawForeField() {
    const top = GROUND + ROAD_H - 4;
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, env.water1);
    g.addColorStop(1, env.water2);
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, H - top + 2);
    ctx.fillStyle = env.water2;
    ctx.fillRect(0, H, W, 600);
    ctx.strokeStyle = env.rice;
    ctx.lineWidth = 2;
    const rows = [[GROUND + 44, 30, 0.9], [GROUND + 72, 36, 1.0], [GROUND + 104, 42, 1.1]];
    const tips = [];
    const cuts = harvestIntervals();
    // 刈ったところ（画面の x）かどうか。区画は真ん中の列の流れ方で決める
    const isCut = sx => { const wx = sx + cam; for (const c of cuts) if (wx >= c.a && wx <= c.b) return true; return false; };
    const stubble = [];
    for (const [y, sp, sc] of rows) {
      const off = (cam * sc) % sp;
      const h = 10 * sc * env.riceH;
      ctx.beginPath();
      for (let x = -sp - off; x < W + sp; x += sp) {
        if (cuts.length && isCut(x)) { stubble.push(x, y, sc); continue; }
        ctx.moveTo(x, y); ctx.lineTo(x - 4 * sc, y - h);
        ctx.moveTo(x, y); ctx.lineTo(x, y - h * 1.2);
        ctx.moveTo(x, y); ctx.lineTo(x + 4 * sc, y - h);
        if (env.grain > 0.3) tips.push(x - 4 * sc, y - h, -1, x, y - h * 1.2, 1, x + 4 * sc, y - h, 1);
      }
      ctx.stroke();
    }
    // 切り株と、散らばった稲わら
    if (stubble.length) {
      ctx.strokeStyle = '#b08a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < stubble.length; i += 3) {
        const x = stubble[i], y = stubble[i + 1], sc = stubble[i + 2];
        ctx.moveTo(x - 3 * sc, y); ctx.lineTo(x - 3.5 * sc, y - 4 * sc);
        ctx.moveTo(x, y); ctx.lineTo(x, y - 5 * sc);
        ctx.moveTo(x + 3 * sc, y); ctx.lineTo(x + 3.5 * sc, y - 4 * sc);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(226,196,120,.7)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i < stubble.length; i += 3) {
        const x = stubble[i], y = stubble[i + 1];
        const hh = hash(Math.floor(x + cam) * 0.37);
        ctx.moveTo(x + 6, y - 2 + hh * 6); ctx.lineTo(x + 14, y - 3 + hh * 4);
      }
      ctx.stroke();
    }
    // 実った稲穂：粒の重みで穂先が垂れる。風で少し揺れる
    if (tips.length) {
      const a = env.grain;
      const len = 6 + env.riceH * 3;
      const sway = Math.sin(clock * 1.6) * 1.5;
      ctx.lineCap = 'round';
      for (let i = 0; i < tips.length; i += 3) {
        const x = tips[i], y = tips[i + 1], d = tips[i + 2];
        const ex = x + d * len * 0.55 + sway, ey = y + len * 0.75;
        ctx.strokeStyle = `rgba(214,170,58,${a})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + d * len * 0.6 + sway * 0.5, y - 2, ex, ey); ctx.stroke();
        ctx.fillStyle = `rgba(244,210,96,${a})`;
        for (let k = 1; k <= 3; k++) {
          const t = k / 4;
          const gx = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * (x + d * len * 0.6) + t * t * ex;
          const gy = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * (y - 2) + t * t * ey;
          ctx.beginPath(); ctx.ellipse(gx + d * 1.5, gy, 1.6, 1.1, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.lineCap = 'butt';
    }
    if (env.duck > 0.02) drawDucks();
    // 手前の田んぼで稲を刈っているコンバイン（稲の列の間を進む）
    for (const c of cuts) {
      if (c.combine === null) continue;
      const sx = c.combine - cam;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (env.harvest - 0.5) * 2);
      drawCombine(sx - 38 * 1.3, GROUND + 96, c.k, 1.3, false);
      ctx.restore();
    }
  }

  // アイガモ農法：田植え〜青田の間、親子で列になって田んぼを泳ぐ
  const DUCK_GAP = 620;
  function drawDucks() {
    ctx.save();
    ctx.globalAlpha = env.duck;
    const k0 = Math.floor((cam - 200) / DUCK_GAP);
    for (let k = k0; k <= k0 + 2; k++) {
      const n = 3 + Math.floor(hash(k * 3.7) * 3);            // 親1羽＋ひな
      const dir = hash(k * 5.3) > 0.5 ? 1 : -1;               // 泳ぐ向き（1 = 右）
      const y = WATER_Y + 30 + Math.floor(hash(k * 7.1) * 3) * 22;
      const baseX = k * DUCK_GAP + hash(k * 2.9) * 260 + Math.sin(clock * 0.25 + k) * 60;
      for (let i = 0; i < n; i++) {
        const x = baseX - dir * i * 26 - cam;
        if (x < -30 || x > W + 30) continue;
        drawDuck(x, y + Math.sin(clock * 2.6 + i + k) * 1.2, i === 0 ? 1.25 : 0.78, dir, clock + i * 0.7);
      }
    }
    ctx.restore();
  }
  function drawDuck(x, y, sc, dir, t) {
    ctx.save();
    ctx.translate(x, y);
    // 水の輪
    ctx.strokeStyle = 'rgba(235,245,240,.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(-dir * 3 * sc, 2, 15 * sc, 2.6 * sc, 0, 0, Math.PI * 2); ctx.stroke();
    // 後ろにできる航跡
    ctx.beginPath(); ctx.moveTo(-dir * 12 * sc, 1); ctx.lineTo(-dir * 26 * sc, 3.5); ctx.stroke();
    ctx.scale(dir * sc, sc);
    // 体（水面から上だけ）
    ctx.fillStyle = '#7b5a3c';
    ctx.beginPath(); ctx.ellipse(-1, 0, 11, 6, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10, -1); ctx.lineTo(-15, -5 + Math.sin(t * 5) * 0.8); ctx.lineTo(-8, -3); ctx.fill();   // しっぽ
    ctx.fillStyle = '#5e422a';
    ctx.beginPath(); ctx.ellipse(-2, -2.5, 6.5, 3, -0.1, 0, Math.PI * 2); ctx.fill();   // 羽
    // 首と頭（緑がかった頭に白い首輪）
    ctx.fillStyle = '#7b5a3c';
    ctx.fillRect(5, -9, 4, 8);
    ctx.fillStyle = '#e9e6da';
    ctx.fillRect(5, -5, 4, 1.6);
    ctx.fillStyle = '#2f4a38';
    ctx.beginPath(); ctx.arc(8, -10, 3.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9a23a';
    ctx.beginPath(); ctx.ellipse(12.4, -9.4, 2.8, 1.3, 0.15, 0, Math.PI * 2); ctx.fill();   // くちばし
    ctx.fillStyle = '#111';
    ctx.fillRect(8.6, -11.2, 1.4, 1.4);
    ctx.restore();
  }

  function roadStrip(a, b, top = GROUND) {
    ctx.fillStyle = '#b08a5a';
    ctx.fillRect(a, top, b - a, ROAD_H);
    ctx.fillStyle = '#c9a473';
    ctx.fillRect(a, top, b - a, 4);
    ctx.fillStyle = '#7a5a36';
    ctx.fillRect(a, top + ROAD_H - 4, b - a, 4);
    ctx.fillStyle = 'rgba(90,64,38,.35)';
    ctx.fillRect(a, top + 8, b - a, 2);
    ctx.fillRect(a, top + 14, b - a, 2);
  }
  // あぜが崩れた所：切れ目の両端がぬかるんだ泥の斜面になり、その先は田んぼの水。
  // 崩れた土で田んぼが濁り、苗が倒れている。水の色は季節に合わせる
  const WATER_Y = GROUND + ROAD_H - 4;   // 手前の田んぼの水面
  function mudPit(a, b, seed = 0) {
    const w = b - a, r = pitRun(w);
    const rw = r * (WATER_Y - GROUND) / PIT_D;   // 水面までの斜面の横幅
    const hs = k => hash(seed * 0.013 + k);
    const cx = (a + b) / 2;
    // 崩れた土で濁った田んぼの水（まわりの水に溶けこむように、ふちは透明）
    ctx.save();
    ctx.beginPath(); ctx.rect(a - 80, WATER_Y, w + 160, 90); ctx.clip();
    ctx.translate(cx, WATER_Y);
    ctx.scale(1, 0.32);
    const R = w / 2 + 46;
    const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    pg.addColorStop(0, 'rgba(86,60,34,.9)');
    pg.addColorStop(0.55, 'rgba(104,78,48,.6)');
    pg.addColorStop(1, 'rgba(110,86,56,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // 水面の泥の筋と、浮いた泥のかたまり
    ctx.strokeStyle = 'rgba(70,46,24,.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const y = WATER_Y + 4 + i * 5;
      const half = (w / 2 + 30) * (1 - i * 0.18);
      ctx.moveTo(cx - half, y); ctx.quadraticCurveTo(cx, y + 2 + hs(i + 200) * 2, cx + half, y);
    }
    ctx.stroke();
    ctx.fillStyle = '#5a3d22';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.ellipse(cx + (hs(i + 210) - 0.5) * (w + 40), WATER_Y + 3 + hs(i + 220) * 16, 3 + hs(i + 230) * 4, 1.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // 泥をかぶって倒れた苗
    ctx.strokeStyle = env.rice;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const x = cx + (hs(i + 240) - 0.5) * (w + 60), y = WATER_Y + 10 + hs(i + 250) * 18;
      const dir = hs(i + 260) > 0.5 ? 1 : -1;
      ctx.moveTo(x, y); ctx.lineTo(x + dir * 11, y - 3);
      ctx.moveTo(x, y); ctx.lineTo(x + dir * 9, y - 6);
    }
    ctx.stroke();
    // 水面の光
    ctx.strokeStyle = 'rgba(235,228,210,.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - w * 0.3, WATER_Y + 2); ctx.lineTo(cx + w * 0.05, WATER_Y + 2); ctx.stroke();

    // 切れ目の両端：あぜが崩れてできた泥の斜面
    for (const side of [-1, 1]) {
      const x0 = side < 0 ? a : b;                 // 道の端
      const x1 = x0 - side * rw;                   // 水面に着くところ
      const g = ctx.createLinearGradient(0, GROUND, 0, WATER_Y + 4);
      g.addColorStop(0, '#8a6440');
      g.addColorStop(1, '#5c3f24');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x0 + side * 3, GROUND);
      ctx.quadraticCurveTo(x0 - side * rw * 0.2, GROUND + 1, x0 - side * rw * 0.5, GROUND + (WATER_Y - GROUND) * 0.5);
      ctx.quadraticCurveTo(x1 + side * rw * 0.15, WATER_Y - 1, x1 - side * 4, WATER_Y + 3);
      ctx.lineTo(x0 + side * 3, WATER_Y + 3);
      ctx.closePath();
      ctx.fill();
      // 斜面の表面：どろっとした泥の層とぬめりの光
      ctx.strokeStyle = '#4a311b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x0 + side * 1, GROUND + 1);
      ctx.quadraticCurveTo(x0 - side * rw * 0.2, GROUND + 1, x0 - side * rw * 0.5, GROUND + (WATER_Y - GROUND) * 0.5);
      ctx.quadraticCurveTo(x1 + side * rw * 0.15, WATER_Y - 1, x1 - side * 4, WATER_Y + 3);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,240,215,.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x0 - side * rw * 0.15, GROUND + 3);
      ctx.quadraticCurveTo(x0 - side * rw * 0.45, GROUND + 8, x0 - side * rw * 0.6, GROUND + 13);
      ctx.stroke();
      // 滑った跡の筋
      ctx.strokeStyle = 'rgba(40,24,10,.45)';
      ctx.beginPath();
      for (let i = 1; i <= 2; i++) {
        const f = i / 3;
        ctx.moveTo(x0 + side * 1 - side * f * 3, GROUND + 4 + f * 3);
        ctx.lineTo(x0 - side * rw * (0.5 + f * 0.3), WATER_Y - 1);
      }
      ctx.stroke();
      // 稲わらのくず
      ctx.strokeStyle = '#cdb46a';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      const sx = x0 - side * rw * (0.2 + hs(side + 270) * 0.3), sy = GROUND + 6 + hs(side + 280) * 8;
      ctx.moveTo(sx, sy); ctx.lineTo(sx + 6, sy + 2);
      ctx.stroke();
      // 崩れた縁の土くれ、道にしみ出した水気、垂れる泥
      const lg = ctx.createLinearGradient(x0 + side * 18, 0, x0, 0);
      lg.addColorStop(0, 'rgba(70,45,22,0)');
      lg.addColorStop(1, 'rgba(70,45,22,.5)');
      ctx.fillStyle = lg;
      ctx.fillRect(Math.min(x0, x0 + side * 18), GROUND, 18, ROAD_H - 4);
      ctx.fillStyle = '#5b3d22';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(x0 + side * (2 + i * 4), GROUND + 1 + hs(i + 290 + side) * 3, 2.4 + hs(i + 300) * 1.8, 1.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#4a311b';
      ctx.beginPath();
      ctx.ellipse(x0 - side * rw * 0.4, GROUND + 12 + (Math.sin(runTime * 2 + x0) + 1) * 1.5, 1.5, 2.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // 落ちた軽トラを半分沈める、手前の濁った水
  function drawPitWater() {
    const pit = truck.pit;
    if (!pit) return;
    const cx = truckX + TRUCK_W / 2;
    ctx.save();
    const R = 110;
    ctx.beginPath(); ctx.rect(cx - R - 4, WATER_Y, 2 * R + 8, 80); ctx.clip();
    ctx.translate(cx, WATER_Y);
    ctx.scale(1, 0.45);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, 'rgba(84,60,36,.9)');
    g.addColorStop(0.6, 'rgba(96,72,44,.75)');
    g.addColorStop(1, 'rgba(100,78,50,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(235,225,205,.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - 52, WATER_Y + 1); ctx.lineTo(cx + 40, WATER_Y + 1); ctx.stroke();
  }

  function drawRoad() {
    const holes = obs.filter(o => o.t === 'gap' && o.x + o.w > cam - 20 && o.x < cam + W + 20)
      .map(o => [o.x - cam, o.x + o.w - cam, o.x, o.lv || 0]).sort((a, b) => a[0] - b[0]);
    const lvls = levelSegments(cam - 40, cam + W + 40);
    for (let li = 0; li < lvls.length; li++) {
      const sg = lvls[li];
      const a0 = sg.a - cam, b0 = sg.b - cam, top = GROUND - sg.h;
      // この段の手前の田んぼ（水・苗・アイガモ）
      ctx.save();
      ctx.beginPath(); ctx.rect(a0, -4000, b0 - a0, 8000); ctx.clip();
      ctx.translate(0, -sg.h);
      drawForeField();
      ctx.restore();
      // あぜ道（泥の穴のところは切る）
      const pieces = [];
      let s0 = a0;
      for (const [a, b] of holes) {
        if (b <= a0 || a >= b0) continue;
        if (a > s0) pieces.push([s0, Math.min(a, b0)]);
        s0 = Math.max(s0, b);
      }
      if (s0 < b0) pieces.push([s0, b0]);
      for (const [a, b] of pieces) {
        roadStrip(a, b, top);
        ctx.strokeStyle = '#6e9e3a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const off = cam % 14;
        for (let x = Math.ceil((a + off) / 14) * 14 - off; x < b; x += 14) {
          const hh = 4 + hash(Math.floor((x + cam) / 14)) * 6;
          ctx.moveTo(x, top + ROAD_H - 2); ctx.lineTo(x - 2, top + ROAD_H - 2 - hh);
        }
        ctx.stroke();
      }
      // 段の境目：下の段から登る壁（低い段は草の土手、高い段は石垣）
      if (li > 0 && sg.h > lvls[li - 1].h) drawRiser(a0, lvls[li - 1].h, sg.h);
    }
    for (const [a, b, wx, lv] of holes) {
      ctx.save();
      ctx.translate(0, -lv);
      mudPit(a, b, wx);
      ctx.restore();
    }
  }
  // 棚田のあぜ：上の段の田んぼを支える壁。段の高さ分より下の田んぼの中まで続く
  function drawRiser(x, hLow, hHigh) {
    const stone = hHigh - hLow > 100;
    const top = GROUND - hHigh, bot = WATER_Y - hLow + 600;
    const wR = stone ? 26 : 18;
    // 左に落ちる影
    const sg = ctx.createLinearGradient(x - 14, 0, x, 0);
    sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.25)');
    ctx.fillStyle = sg; ctx.fillRect(x - 14, top, 14, bot - top);
    if (stone) {
      ctx.fillStyle = '#6d6252';
      ctx.fillRect(x, top, wR, bot - top);
      for (let r = 0, y = top; y < bot; r++, y += 13) {
        for (let c = 0; c < 2; c++) {
          const x0 = x + 1 + c * 12 + (r % 2) * 5, w0 = Math.min(11 + hash(r * 3.1 + c + x * 0.01) * 4, x + wR - x0 - 1);
          if (w0 <= 2) continue;
          const tone = 0.85 + hash(r * 1.7 + c * 5.3) * 0.3;
          ctx.fillStyle = `rgb(${Math.round(150 * tone)},${Math.round(140 * tone)},${Math.round(122 * tone)})`;
          ctx.beginPath(); ctx.roundRect(x0, y + 1, w0, 11, 3); ctx.fill();
        }
      }
    } else {
      const g = ctx.createLinearGradient(0, top, 0, bot);
      g.addColorStop(0, '#6f9a3e'); g.addColorStop(1, '#4a6d2d');
      ctx.fillStyle = g;
      ctx.fillRect(x, top, wR, bot - top);
      ctx.strokeStyle = 'rgba(40,70,25,.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let y = top + 6; y < bot; y += 7) { const d = hash(y * 0.37 + x) * 6; ctx.moveTo(x + 2 + d, y); ctx.lineTo(x + 5 + d, y + 6); }
      ctx.stroke();
    }
    // 上の段のあぜ道の角
    ctx.fillStyle = 'rgba(255,240,210,.25)';
    ctx.fillRect(x, top, wR, 3);
  }

  // 100m ごとの距離標、ベストの旗、タイムアタックのゴール
  function drawMarkers() {
    const first = Math.floor((cam - 60) / (100 * PX_PER_M));
    for (let k = Math.max(1, first); k <= first + 2; k++) {
      if (mode === 'ta' && k * 100 >= GOAL_M) continue;
      const sx = k * 100 * PX_PER_M + TRUCK_FRONT - cam;
      if (sx < -40 || sx > W + 40 || find('gap', sx + cam)) continue;
      ctx.save();
      ctx.translate(0, -levelAt(sx + cam));
      ctx.fillStyle = '#e8e2d0';
      ctx.fillRect(sx - 7, GROUND - 26, 14, 26);
      ctx.fillStyle = '#b9b19a';
      ctx.fillRect(sx - 7, GROUND - 26, 14, 3);
      ctx.fillStyle = '#3b3326';
      ctx.font = '10px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText(String(k * 100), sx, GROUND - 9, 12);

      const sx = best * PX_PER_M + TRUCK_FRONT - cam;

        ctx.save();
        ctx.translate(0, -levelAt(sx + cam));
        ctx.fillStyle = '#5b4a3a';
        ctx.fillRect(sx - 1.5, GROUND - 70, 3, 70);

  // トマト畑の直売所（道の奥）
  function drawStand(sx) {
    const y = GROUND - 2;

    for (let i = 0; i < 5; i++) {
      const x = sx - 110 + i * 16;
      ctx.fillStyle = '#7a6040'; ctx.fillRect(x, y - 44, 2, 44);
      ctx.fillStyle = '#4f8f36';
      ctx.beginPath(); ctx.ellipse(x + 1, y - 26, 7, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e0392b';

    }

    ctx.fillStyle = '#c9a05e'; ctx.fillRect(sx - 22, y - 12, 44, 12);
    ctx.fillStyle = '#e0392b';
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(sx - 16 + i * 6.4, y - 14, 3, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#fffbea'; ctx.fillRect(sx - 24, y - 58, 48, 13);
    ctx.fillStyle = '#3a2a14'; ctx.font = '10px ' + FONT; ctx.textAlign = 'center';

  function drawGoal(sx) {

  function drawPuddle(sx, w) {

  function drawBumps(sx, w, seed) {

  function drawHazards() {

  // 初めて出てきた障害物に吹き出しで説明を出す
  const CALLOUTS = { gap: 'タップでジャンプ!', puddle: '水たまり 滑って減速', bump: 'ボコボコ道 3回でパンク', boar: 'イノシシ! 跳び越えろ',
    stepLo: '段差! ジャンプで登れ', stepHi: '石垣! 2段ジャンプで登れ' };
  function drawCallouts() {
    if (state !== 'play') return;
    for (const st of steps) {
      const kind = stepKind(st);
      if (kind === 'down' || seenTypes.has(kind)) continue;
      const sx = st.x - cam;
      if (sx - TRUCK_FRONT < 40 || sx > W - 20) continue;
      ctx.font = '15px ' + FONT;
      const half = ctx.measureText(CALLOUTS[kind]).width / 2 + 10;
      bubble(CALLOUTS[kind], Math.min(W - half - 8, Math.max(TRUCK_FRONT + half + 8, sx)), GROUND - st.h - 12, sx);
      return;
    }
    for (const o of obs) {
      if (seenTypes.has(o.t)) continue;
      let sx, y;
      if (o.t === 'boar') { if (o.state !== 'run') continue; sx = o.px - cam; y = GROUND - (o.lv || 0) - 58; }
      else { sx = o.x - cam + Math.min(o.w, 160) / 2; y = GROUND - (o.lv || 0) - 44; }
      const near = o.t === 'boar' ? sx - TRUCK_FRONT < 120 : o.x - cam - TRUCK_FRONT < 30;
      if (near || sx > W - 20) continue;
      ctx.font = '15px ' + FONT;
      const half = ctx.measureText(CALLOUTS[o.t]).width / 2 + 10;
      bubble(CALLOUTS[o.t], Math.min(W - half - 8, Math.max(TRUCK_FRONT + half + 8, sx)), y, sx);
      break;
    }
  }
  // 段差の予告：壁が画面に入る前から、右端で「段差!」「石垣!!」を点滅させて知らせる
  function drawStepWarning() {
    if (state !== 'play') return;
    let prev = levelAt(cam + TRUCK_X);
    for (const st of steps) {
      if (st.x <= cam + TRUCK_FRONT) { prev = st.h; continue; }
      const rise = st.h - prev;
      if (rise <= 0) { prev = st.h; continue; }
      const tt = (st.x - cam - TRUCK_FRONT) / Math.max(60, vel);
      if (tt > 1.6) return;
      const hi = rise > 100;
      if (!st.warned) { st.warned = true; sfx(hi ? 'warnHi' : 'warnLo'); }
      const onScreen = st.x - cam < W - 30;
      const x = onScreen ? st.x - cam : W - 44;
      const y = GROUND - st.h - (onScreen ? 60 : 30);
      const blink = Math.floor(tt * 8) % 2 === 0;
      if (!onScreen || blink) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = hi ? '#e2543a' : '#f2b33d';
        ctx.strokeStyle = '#fffbea';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(-34, -24, 68, 42, 8); ctx.fill(); ctx.stroke();
        // 上向きの矢印（石垣は2本＝2段ジャンプ）
        ctx.fillStyle = '#fffbea';
        const arrows = hi ? [-8, 8] : [0];
        for (const ax of arrows) {
          ctx.beginPath(); ctx.moveTo(ax - 7, -8); ctx.lineTo(ax, -18); ctx.lineTo(ax + 7, -8); ctx.closePath(); ctx.fill();
          ctx.fillRect(ax - 2.5, -9, 5, 7);
        }
        ctx.font = bold(12);
        ctx.textAlign = 'center';
        ctx.fillText(hi ? '石垣!! 2段' : '段差!', 0, 12);

    }
  }
  function bubble(text, x, y, tipX) {
    ctx.font = '15px ' + FONT;

    ctx.moveTo(tipX - 6, y - 8.5); ctx.lineTo(tipX, y); ctx.lineTo(tipX + 6, y - 8.5);

  }

  function drawBoars() {
    for (const o of obs) {
      if (o.t !== 'boar') continue;
      ctx.save();
      ctx.translate(0, -(o.lv || 0));
      drawBoarObj(o);
      ctx.restore();

  function drawBoarObj(o) {

        drawBoar(sx, y, o.leg, o.state === 'hit' ? o.rot : 0);
        if (o.state === 'run' && Math.random() < 0.3) emit(1, o.px + 26, GROUND - (o.lv || 0) - 2, { vx: [20, 80], vy: [-50, -10], life: [0.2, 0.4], r: [2, 5], col: '#c7a77c', g: 50 });

  function drawStars(x, y) {

  }

  function drawBoar(x, y, leg, rot) {

    ctx.fillStyle = '#6b4526';
    ctx.beginPath(); ctx.ellipse(2, -18, 26, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a2e18';
    ctx.beginPath(); ctx.ellipse(6, -27, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5e3b20';
    ctx.beginPath();
    ctx.moveTo(-18, -26); ctx.lineTo(-36, -14); ctx.lineTo(-34, -8); ctx.lineTo(-16, -8);

  // 荷台のトマトの山
  const TOMATOES = [];
  for (const [y, xs] of [[-37, [8, 17, 26, 35, 44, 53]], [-45, [12, 21, 30, 39, 48]], [-53, [17, 26, 35, 43]], [-60, [22, 31]]]) {
    for (const x of xs) TOMATOES.push([x, y]);
  }
  const TOMATO_MAX = TOMATOES.length;
  function drawTomatoes(n) {
    for (let i = 0; i < n; i++) {
      const [x, y] = TOMATOES[i];
      ctx.fillStyle = i % 3 === 1 ? '#c92f22' : '#e0392b';
      ctx.beginPath(); ctx.arc(x, y, 5.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillRect(x - 3, y - 3, 2, 2);

        ctx.fillStyle = '#3f8a2a';
        ctx.fillRect(x - 2, y - 6, 4, 2);

      }
    }
  }

  function mainTruckSpec() {
    return {
      x: truckX, y: truck.y, angle: truck.angle, pivot: 0, roll: truck.falling ? (truck.roll || 0) : undefined, mud: truck.mud || 0,
      wob: slip > 0 ? Math.sin(runTime * 32) : 0, squash: truck.squash, dent: truck.dent, flat: truck.flat,
      load: truck.spilled ? Math.min(tomatoes, 5) : tomatoes, shadow: !truck.falling, gy: state === 'title' ? GROUND : supportY(),
    };
  }
  function drawTruck(sp) {
    const { x, y, angle, pivot, wob, squash: sq } = sp;
    if (sp.shadow) {
      const gy = sp.gy ?? GROUND;
      const lift = Math.max(0, gy - y);
      ctx.fillStyle = `rgba(40,30,15,${0.25 * Math.max(0.2, 1 - lift / 160)})`;
      ctx.beginPath();
      ctx.ellipse(x + TRUCK_W / 2, gy + 1, 46 * Math.max(0.5, 1 - lift / 260), 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    if (sp.roll !== undefined) { drawRolling(sp); ctx.restore(); return; }
    ctx.translate(x + TRUCK_W / 2 + wob * 4, y - pivot);
    ctx.rotate(angle + wob * 0.05);
    ctx.scale(1 + sq * 0.06, 1 - sq * 0.1);
    ctx.translate(-TRUCK_W / 2, pivot);
    drawTruckBody(sp);
    ctx.restore();
  }
  // 車体の側面（ローカル座標：左端 x=0、タイヤの接地 y=0）
  function drawTruckBody(sp) {
    const { dent: d, flat, load } = sp;
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(4, -16, 90, 7);
    drawTomatoes(load);
    // 荷台
    ctx.fillStyle = '#eef0f0';
    ctx.fillRect(2, -32, 58, 17);
    ctx.fillStyle = '#c9cfd1';
    ctx.fillRect(2, -32, 58, 3);
    ctx.fillRect(20, -32, 2, 17);
    ctx.fillRect(40, -32, 2, 17);
    // 鳥居

    ctx.fillRect(58, -50, 4, 36);
    // キャブ（ぶつけると前がへこむ）
    ctx.fillStyle = '#f7f8f8';
    ctx.beginPath();
    ctx.moveTo(61, -52); ctx.lineTo(84 - d * 3, -52 + d * 2); ctx.lineTo(93 - d * 8, -30); ctx.lineTo(96 - d * 7, -28 + d * 3);
    ctx.lineTo(96 - d * 9, -20); ctx.lineTo(96 - d * 5, -12); ctx.lineTo(61, -12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8cc3dc';
    ctx.beginPath();
    ctx.moveTo(65, -48); ctx.lineTo(82 - d * 3, -48 + d * 2); ctx.lineTo(89 - d * 8, -32); ctx.lineTo(65, -32);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(70, -46, 3, 12);
    ctx.fillStyle = '#c9cfd1';
    ctx.fillRect(64, -30, 1.5, 17);
    ctx.fillRect(68, -27, 6, 2);
    // バンパー・ライト
    ctx.fillStyle = '#9aa2a5';
    if (d) { ctx.save(); ctx.translate(88, -14); ctx.rotate(0.35); ctx.fillRect(-2, -2, 9, 5); ctx.restore(); }
    else ctx.fillRect(90, -16, 8, 5);
    ctx.fillStyle = d ? '#555' : '#ffe28a';
    ctx.fillRect(92 - d * 8, -26, 4, 5);

    ctx.beginPath(); ctx.arc(74, -40, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f6a3a';

      ctx.fillStyle = '#b8bec0';

      if (!isFlat) {
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k < 3; k++) {
          const a = wheelA + k * Math.PI * 2 / 3;
          ctx.moveTo(wx, -10); ctx.lineTo(wx + Math.cos(a) * 8, -10 + Math.sin(a) * 8);
        }
        ctx.stroke();
      }
    }
    if (sp.mud) drawMudOnBody(sp.mud);
  }
  // 泥だらけの車体
  function drawMudOnBody(k) {
    ctx.globalAlpha = 0.85 * k;
    for (let i = 0; i < 16; i++) {
      ctx.fillStyle = MUD_COLS[i % 4];
      const x = 4 + hash(i * 2.3) * 90, y = -4 - hash(i * 5.1) * 30 * (0.4 + hash(i * 1.7));
