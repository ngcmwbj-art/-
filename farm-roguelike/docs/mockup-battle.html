<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戦闘画面の見本</title>
<!-- 見た目の方向性を確かめるための静的な見本（動きはありません） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ── 色の約束ごと：水彩の淡い色＋焦げ茶のインク ───────────── */
:root {
  --sky-top: #8fc3e6;
  --sky-mid: #cfe6f2;
  --sky-low: #fbf1d9;
  --hill-far: #9cc3a4;
  --hill-mid: #79ad7e;
  --hill-near: #5d9466;
  --paper: #e9dfc6;       /* 古い和紙 */
  --paper-edge: #c9b894;
  --ink: #241c15;         /* 墨 */
  --ink-soft: #5e5040;
  --panel: rgba(22, 20, 16, .72);   /* 墨色の半透明パネル */
  --panel-line: rgba(214, 190, 140, .45);
  --panel-text: #efe4c8;
  --attack: #b5503a;   /* 攻撃：朱 */
  --skill: #4f6a7a;    /* 守り：藍 */
  --crop: #5d7a3c;     /* 作物：苔 */
  --energy: #d9a441;   /* エネルギー：灯火 */
  --hp: #a8442f;
  --block: #8fb3cf;
  --soil: #8a6a4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  color: var(--ink);
  background: var(--sky-low);
  overflow: hidden;
}
.title-font { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; }

/* ── 背景：深い山と森の1枚絵（assets/img/bg/） ─────── */
.scene { position: fixed; inset: 0; background: #2c3b44; }
.scene img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }

/* ── レイアウト ─────────────────────────────────────────── */
.app {
  position: relative; z-index: 1;
  height: 100%; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto;
  padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
  gap: 8px;
}

/* 上の帯：健康度・資金・季節 */
.topbar {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  border: 1px solid var(--panel-line); border-radius: 4px; color: var(--panel-text);
  padding: 6px 10px; font-size: 14px;
  box-shadow: 0 3px 0 rgba(74, 58, 42, .18);
}
.topbar .season { font-size: 17px; margin-right: auto; letter-spacing: .15em; }
.pill { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; }
.relics { font-size: 14px; color: #c9bc9c; }

/* 敵 */
.enemy-area { display: grid; place-items: center; align-content: center; gap: 4px; }
.intent {
  background: #7e2a1c; color: #f3e6c8; border: 1px solid #d6a86a;
  border-radius: 2px; padding: 2px 12px;
  font-family: "Shippori Mincho B1", serif; font-weight: 800; font-size: 15px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
}
.enemy {
  width: clamp(140px, 24vh, 300px); height: clamp(140px, 24vh, 300px); display: grid; place-items: center; position: relative;
}
/* 足もとの影（地面に立っているように） */
.enemy::after {
  content: ""; position: absolute; bottom: 6px; left: 25%; right: 25%; height: 12px;
  background: rgba(0, 0, 0, .35); border-radius: 50%; z-index: -1;
}
/* 敵の名前札：木の札のような小さな板 */
.plate {
  display: grid; justify-items: center; gap: 3px; padding: 4px 14px 5px;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 4px; color: var(--panel-text);
}
.enemy-name { font-size: 17px; font-weight: 600; }
.bar {
  width: 160px; height: 8px; border: 1px solid var(--panel-line); border-radius: 1px;
  background: rgba(0, 0, 0, .45); overflow: hidden; position: relative;
}
.bar > b { display: block; height: 100%; background: linear-gradient(180deg, #c0563c, #7e2a1c); }
.bar-label { font-size: 12px; color: #c9bc9c; }

/* 畑と畜舎 */
.field {
  display: grid; grid-template-columns: repeat(3, 1fr) 10px repeat(2, 1fr); gap: 6px;
  align-items: end;
}
.plot {
  height: 62px; border-radius: 3px;
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .08) 0 3px, transparent 3px 9px),
    linear-gradient(180deg, #4a3826, #2e2219);
  border: 1px solid var(--panel-line);
  display: grid; place-items: center; position: relative;
  font-size: 30px;
  box-shadow: inset 0 4px 6px rgba(0, 0, 0, .18);
}
.plot small {
  position: absolute; bottom: 2px; right: 5px; font-size: 11px; color: #f0dca8; font-weight: 700;
}
.plot.ripe { box-shadow: inset 0 4px 6px rgba(0, 0, 0, .3), 0 0 0 1px #e8c27a, 0 0 12px rgba(240, 190, 90, .6); }
.barn {
  height: 62px; border-radius: 2px; border: 1px solid var(--panel-line);
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 1px, transparent 1px 12px), linear-gradient(180deg, #6a5038, #4a3726);
  display: grid; place-items: center; font-size: 30px; position: relative;
}
.barn::before { /* 屋根 */
  content: ""; position: absolute; top: -12px; left: 8%; right: 8%; height: 14px;
  background: #3a2c20; border: 1px solid var(--panel-line); border-bottom: 0;
  clip-path: polygon(0 100%, 50% 0, 100% 100%);
}
.barn.empty { color: rgba(233, 223, 198, .4); font-size: 13px; }

/* プレイヤーの状態 */
.player {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  border: 1px solid var(--panel-line); border-radius: 4px; padding: 6px 10px; color: var(--panel-text);
}
.energy {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 40% 35%, #fff1c0, var(--energy) 55%, #7a4a14);
  border: 1px solid #f0d29a; display: grid; place-items: center; color: #2a1a08;
  font-family: "Shippori Mincho B1", serif; font-size: 22px; font-weight: 800;
  box-shadow: 0 0 16px rgba(240, 180, 80, .55);
}
.hp-wrap { flex: 1; }
.hp-wrap .bar { width: 100%; }
.hp-wrap .bar > b { background: linear-gradient(180deg, #8fae5a, #4f6f2e); }
.hp-text { font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 2px; }
.block { color: #a9c3d2; font-weight: 700; }
.end-turn {
  font-family: "Shippori Mincho B1", serif; font-weight: 700; font-size: 15px; color: #f3e6c8;
  background: linear-gradient(180deg, #4a3a2a, #2a2018);
  border: 1px solid #d6a86a; border-radius: 3px;
  padding: 9px 12px; box-shadow: 0 3px 8px rgba(0, 0, 0, .45);
}

/* 手札：紙のカードを扇に並べる */
.hand { display: flex; justify-content: center; height: 176px; padding-top: 10px; }
/* 5枚が画面幅に収まるように幅を画面に合わせる */
.card {
  width: min(104px, 21vw); height: 156px; flex: none; margin: 0 max(-14px, -2.2vw);
  background: linear-gradient(160deg, #efe6cf, var(--paper) 60%, #d9cba8);
  border: 1px solid #3a2c20; outline: 3px solid rgba(36, 28, 21, .85); outline-offset: -6px;
  border-radius: 3px;
  box-shadow: 0 6px 14px rgba(0, 0, 0, .5);
  display: grid; grid-template-rows: 22px 58px auto 1fr; position: relative;
  transform-origin: 50% 120%;
}
.card:nth-child(1) { transform: rotate(-12deg) translateY(16px); }
.card:nth-child(2) { transform: rotate(-6deg) translateY(4px); }
.card:nth-child(3) { transform: translateY(-14px); z-index: 2; box-shadow: 0 0 0 2px #e8c27a, 0 0 18px rgba(240, 190, 90, .55), 0 10px 20px rgba(0, 0, 0, .5); }
.card:nth-child(4) { transform: rotate(6deg) translateY(4px); }
.card:nth-child(5) { transform: rotate(12deg) translateY(16px); }
.card .cost {
  position: absolute; top: -9px; left: -9px; width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff1c0, var(--energy) 60%, #7a4a14);
  border: 1px solid #241c15; display: grid; place-items: center; z-index: 1;
  font-family: "Shippori Mincho B1", serif; font-weight: 800; font-size: 15px; color: #2a1a08;
}
.card .name { font-family: "Shippori Mincho B1", serif; font-weight: 800; font-size: 14px; text-align: center; padding-top: 6px; }
/* 絵の部分：水彩のにじみ */
.card .art {
  margin: 0 9px; border-radius: 1px; border: 1px solid var(--ink);
  display: grid; place-items: center; font-size: 34px;
}
.card.attack .art { background: #e2c2b0; }
.card.skill .art { background: #c6cfd2; }
.card.crop .art { background: #cfd6b4; }
/* 手描きの絵（SVG）を枠いっぱいに */
.enemy img { width: 100%; height: 100%; }
.plot img, .barn img { width: 52px; height: 52px; }
.card .art img { width: 54px; height: 54px; }
.card .kind { font-size: 10px; letter-spacing: .2em; text-align: center; color: var(--ink-soft); margin-top: 2px; }
.card .text { font-size: 11.5px; line-height: 1.35; text-align: center; padding: 2px 6px 0; }
.card .text b { color: #8e2f1e; }
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><img src="../assets/img/bg/forest.svg" alt=""></div>

<main class="app">
  <header class="topbar">
    <span class="season title-font">夏 ・ 三日目</span>
    <span class="pill title-font">銭 128</span>
    <span class="relics title-font" title="レリック">道具 2</span>
  </header>

  <section class="enemy-area">
    <div class="intent">突進 12</div>
    <div class="enemy"><img src="../assets/img/art/boar.svg" alt="イノシシ"></div>
    <div class="plate">
      <div class="enemy-name title-font">山の大猪</div>
      <div class="bar"><b style="width:62%"></b></div>
      <div class="bar-label">勢い 31 / 48</div>
    </div>
  </section>

  <section class="field" aria-label="畑と畜舎">
    <div class="plot ripe"><img src="../assets/img/art/cabbage.svg" alt="キャベツ"><small>実った</small></div>
    <div class="plot"><img src="../assets/img/art/sprout.svg" alt="芽"><small>2/3</small></div>
    <div class="plot"></div>
    <div></div>
    <div class="barn"><img src="../assets/img/art/calf.svg" alt="F1の子牛"></div>
    <div class="barn empty">空き</div>
  </section>

  <section class="player">
    <div class="energy">3</div>
    <div class="hp-wrap">
      <div class="hp-text"><span>農場の健康度 52 / 70</span><span class="block title-font">守り 5</span></div>
      <div class="bar"><b style="width:74%"></b></div>
    </div>
    <button class="end-turn">ターン<br>終了</button>
  </section>

  <section class="hand" aria-label="手札">
    <div class="card attack"><span class="cost">1</span><div class="name">除草</div><div class="art"><img src="../assets/img/art/weeding.svg" alt=""></div><div class="kind">攻撃</div><div class="text">勢いに<b>6</b></div></div>
    <div class="card skill"><span class="cost">1</span><div class="name">防鳥ネット</div><div class="art"><img src="../assets/img/art/net.svg" alt=""></div><div class="kind">守り</div><div class="text">守り<b>6</b>。鳥の攻撃をさらに半減</div></div>
    <div class="card crop"><span class="cost">0</span><div class="name">収穫</div><div class="art"><img src="../assets/img/art/basket.svg" alt=""></div><div class="kind">作物</div><div class="text">実った作物を収穫し<b>銭</b>と効果</div></div>
    <div class="card crop"><span class="cost">1</span><div class="name">水やり</div><div class="art"><img src="../assets/img/art/water.svg" alt=""></div><div class="kind">成長</div><div class="text">作物を<b>1</b>段育てる。カードを1枚引く</div></div>
    <div class="card attack"><span class="cost">2</span><div class="name">かかし</div><div class="art"><img src="../assets/img/art/scarecrow.svg" alt=""></div><div class="kind">攻撃</div><div class="text">勢いに<b>4</b>。3ターン毎回<b>4</b></div></div>
  </section>
</main>
</body>
</html>
