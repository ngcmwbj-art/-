<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a16">
<title>追い返せ！ボクらの防農作戦！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 背景：画面ごとに js/ui/screens.js の BG で選ぶ（assets/img/bg/ に置いた絵。なければ森の絵） -->
<div class="scene" aria-hidden="true"><img src="assets/img/bg/forest.svg" alt=""></div>

<!-- ── タイトル ───────────────────────────────── -->
<section class="screen" id="screen-title">
  <div class="title-wrap">
    <p class="title-sub" data-game-subtitle></p>
    <h1 class="game-title" data-game-title></h1>
    <div class="title-buttons">
      <button class="btn primary" id="btn-continue" hidden>つづきから</button>
      <button class="btn" id="btn-new">はじめから</button>
    </div>
    <div class="sound-row" id="title-sound"></div>
    <p class="title-best" id="title-best"></p>
    <p class="title-note">春・夏・秋・冬を乗り切り、一年の経営評価を受けよう</p>
  </div>
</section>

<!-- ── 農家タイプ選択 ────────────────────────────── -->
<section class="screen" id="screen-select">
  <div class="panel-page">
    <h2 class="page-title">どの農家として生きるか</h2>
    <div id="farmer-list" class="farmer-list"></div>
  </div>
</section>

<!-- ── 戦闘（横から見た舞台：左に農家、右に敵）──────────── -->
<section class="screen" id="screen-battle">
  <div class="battle">
    <header class="topbar">
      <div class="who"><span class="who-name" id="b-farmer"></span><span class="who-sub" id="b-season"></span></div>
      <span class="hud hp" title="農場の健康度"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 C4 15 2 11 2 8 C2 5 4.5 3 7 3 C9 3 11 4.5 12 6 C13 4.5 15 3 17 3 C19.5 3 22 5 22 8 C22 11 20 15 12 21Z" fill="currentColor"/></svg><b id="b-hp-top"></b></span>
      <span class="hud gold" title="銭">銭<b id="b-gold"></b></span>
      <span class="hud floor" id="b-floor"></span>
      <span class="spacer"></span>
      <button class="hud-btn" id="b-menu" aria-label="帳面（デッキとメニュー）">帳面<b id="b-deck-count"></b></button>
    </header>
    <div class="relic-row" id="b-relics"></div>

    <section class="stage" id="b-stage">
      <div class="unit player-unit" id="b-player">
        <div class="forecast" id="b-forecast" hidden></div>
        <div class="unit-art" id="b-player-art"></div>
        <div class="unit-bar">
          <span class="block-badge" id="b-block" hidden></span>
          <div class="bar"><b id="b-hp-bar"></b><i class="hp-loss" id="b-hp-loss"></i><span id="b-hp-text"></span></div>
        </div>
        <div class="statuses" id="b-statuses"></div>
      </div>
      <div class="enemies" id="b-enemies"></div>
    </section>

    <div class="field-row">
      <section class="field" id="b-field" aria-label="畑と畜舎"></section>
      <button class="harvest-btn" id="b-harvest">収穫</button>
    </div>

    <section class="bottom">
      <div class="energy" id="b-energy" aria-label="エネルギー"></div>
      <button class="pile draw" id="b-pile-draw" aria-label="山札"><span>山札</span><b id="b-draw"></b></button>
      <section class="hand" id="hand" aria-label="手札"></section>
      <button class="end-turn" id="b-end">ターン終了</button>
      <button class="pile discard" id="b-pile-discard" aria-label="捨て札"><span>捨て札</span><b id="b-discard"></b></button>
    </section>
  </div>
</section>

<!-- ── 報酬 ──────────────────────────────────── -->
<section class="screen" id="screen-reward">
  <div class="panel-page">
    <h2 class="page-title">追い払った</h2>
    <p class="reward-gold" id="reward-gold"></p>
    <div class="relic-pick" id="reward-relics"></div>
    <p class="reward-lead">1枚えらんでデッキに加える</p>
    <div class="terms" id="reward-terms"></div>
    <div class="reward-cards" id="reward-cards"></div>
    <div class="reward-actions">
      <button class="btn primary" id="reward-take" disabled>デッキに加える</button>
      <button class="btn" id="reward-skip">何も加えない</button>
    </div>
    <p class="reward-status" id="reward-status"></p>
  </div>
</section>

<!-- ── 行き先を選ぶ（分かれ道）──────────────────────────── -->
<section class="screen" id="screen-map">
  <div class="panel-page map-page">
    <p class="map-season" id="map-season"></p>
    <div class="map-progress" id="map-progress" aria-label="季節の進み具合"></div>
    <p class="map-lead" id="map-lead"></p>
    <div class="map-choices" id="map-choices"></div>
    <p class="map-status" id="map-status"></p>
    <button class="btn small" id="map-deck">デッキを見る</button>
  </div>
</section>

<!-- ── 出来事「？」──────────────────────────────── -->
<section class="screen" id="screen-event">
  <div class="panel-page event-page">
    <p class="map-season">出来事</p>
    <div class="event-art" id="event-art"></div>
    <h2 class="page-title" id="event-title"></h2>
    <p class="event-text" id="event-text"></p>
    <div class="rest-options" id="event-options"></div>
    <div class="event-log" id="event-log"></div>
    <div class="reward-actions"><button class="btn primary" id="event-next" hidden>先へ進む</button></div>
    <p class="map-status" id="event-status"></p>
  </div>
</section>

<!-- ── 休憩所 ─────────────────────────────────── -->
<section class="screen" id="screen-rest">
  <div class="panel-page rest-page">
    <h2 class="page-title">休憩所</h2>
    <p class="map-lead">ひと息つける。1つだけ選べる。</p>
    <div class="rest-options" id="rest-options"></div>
    <div id="rest-upgrade" hidden>
      <p class="map-lead">強化するカードを選ぶ（強化後の中身が下に出る）</p>
      <div class="market-grid" id="rest-upgrade-list"></div>
      <div class="reward-actions"><button class="btn" id="rest-upgrade-back">ほかのことをする</button></div>
    </div>
    <p class="map-status" id="rest-status"></p>
  </div>
</section>

<!-- ── 季節の終わり ────────────────────────────────── -->
<section class="screen" id="screen-season">
  <div class="panel-page">
    <h2 class="page-title" id="season-title"></h2>
    <p class="result-lead" id="season-lead"></p>
    <table class="result-parts"><tbody id="season-parts"></tbody></table>
    <div class="relic-pick" id="season-skill"></div>
    <div class="reward-actions"><button class="btn primary" id="season-next"></button></div>
  </div>
</section>

<!-- ── 市場（カードのお店）──────────────────────────── -->
<section class="screen" id="screen-market">
  <div class="panel-page market-page">
    <h2 class="page-title">市場</h2>
    <p class="market-lead">市が立っている。カードを買ったり、デッキのカードを売ったりできる。</p>
    <p class="market-gold">手元の銭 <b id="market-gold"></b></p>
    <div class="market-tabs" role="tablist">
      <button class="tab active" id="tab-buy" role="tab" aria-selected="true">買う</button>
      <button class="tab" id="tab-sell" role="tab" aria-selected="false">売る</button>
    </div>
    <div id="market-buy" class="market-grid"></div>
    <div id="market-sell" class="market-grid" hidden></div>
    <p class="market-note" id="market-note"></p>
    <div class="reward-actions"><button class="btn primary" id="market-leave">市場を出る</button></div>
  </div>
</section>

<!-- ── 経営評価 ───────────────────────────────── -->
<section class="screen" id="screen-result">
  <div class="panel-page">
    <h2 class="page-title">経営評価</h2>
    <p class="result-lead" id="result-lead"></p>
    <div class="result-rank" id="result-rank"></div>
    <p class="result-title" id="result-title"></p>
    <p class="result-total" id="result-total"></p>
    <table class="result-parts"><tbody id="result-parts"></tbody></table>
    <div class="reward-actions">
      <button class="btn primary" id="btn-again">もう一度</button>
      <button class="btn" id="btn-title">タイトルへ</button>
    </div>
  </div>
</section>

<!-- ダイアログとお知らせ -->
<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h3 class="modal-title"></h3><button class="modal-close" aria-label="閉じる">閉じる</button></div>
    <div class="modal-body"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="turn-banner" aria-hidden="true"></div>
<div id="card-preview" aria-hidden="true"></div>
<div id="tut-bubble" role="dialog" aria-live="polite" hidden></div>
<div id="ship-slip" role="status" aria-live="polite"></div>

<!-- データ（ここを足すだけでカード・敵・農家タイプが増える） -->
<script src="data/config.js"></script>
<script src="data/crops.js"></script>
<script src="data/animals.js"></script>
<script src="data/cards.js"></script>
<script src="data/statuses.js"></script>
<script src="data/enemies.js"></script>
<script src="data/encounters.js"></script>
<script src="data/seasons.js"></script>
<script src="data/glossary.js"></script>
<script src="data/relics.js"></script>
<script src="data/events.js"></script>
<script src="data/farmers.js"></script>
<!-- 仕組み -->
<script src="js/core/util.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/battle.js"></script>
<script src="js/reward.js"></script>
<script src="js/market.js"></script>
<script src="js/map.js"></script>
<script src="js/events.js"></script>
<script src="js/ui/tutorial.js"></script>
<script src="js/score.js"></script>
<script src="js/save.js"></script>
<!-- 画面 -->
<script src="js/ui/sound.js"></script>
<script src="js/ui/speed.js"></script>
<script src="js/ui/art.js"></script>
<script src="js/ui/render-card.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/input.js"></script>
<script src="js/ui/render-battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
