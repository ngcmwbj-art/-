<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a16">
<title>タイトル未定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 背景：深い山と森の1枚絵（季節ごとの絵は④で追加） -->
<div class="scene" aria-hidden="true"><img src="assets/img/bg/forest.svg" alt=""></div>

<!-- ── タイトル ───────────────────────────────── -->
<section class="screen" id="screen-title">
  <div class="title-wrap">
    <p class="title-sub" data-game-subtitle></p>
    <h1 class="game-title" data-game-title></h1>
    <div class="title-buttons">
      <button class="btn primary" id="btn-continue" hidden>つづきから</button>
      <button class="btn" id="btn-new">はじめから</button>
    </div>
    <p class="title-best" id="title-best"></p>
    <p class="title-note">試作版：野菜農家で、群れ鴉を何度追い払えるか</p>
  </div>
</section>

<!-- ── 農家タイプ選択 ────────────────────────────── -->
<section class="screen" id="screen-select">
  <div class="panel-page">
    <h2 class="page-title">どの農家として生きるか</h2>
    <div id="farmer-list" class="farmer-list"></div>
  </div>
</section>

<!-- ── 戦闘 ──────────────────────────────────── -->
<section class="screen" id="screen-battle">
  <div class="battle">
    <header class="topbar">
      <span class="season" id="b-season"></span>
      <span class="gold">銭 <b id="b-gold"></b></span>
      <span class="relics" id="b-relics"></span>
      <button class="icon-btn" id="b-menu" aria-label="帳面（デッキとメニュー）">帳面</button>
    </header>

    <section class="enemy-area" id="b-enemy">
      <div class="intent" id="b-intent"></div>
      <div class="enemy-art" id="b-enemy-art"></div>
      <div class="plate">
        <div class="enemy-name" id="b-enemy-name"></div>
        <div class="bar"><b id="b-enemy-bar"></b></div>
        <div class="bar-label"><span id="b-enemy-hp"></span> <span class="str" id="b-enemy-str"></span></div>
      </div>
    </section>

    <section class="field" id="b-field" aria-label="畑"></section>

    <section class="player" id="b-player">
      <div class="energy" id="b-energy" aria-label="エネルギー"></div>
      <div class="hp-wrap">
        <div class="hp-text"><span id="b-hp-text"></span><span class="block" id="b-block"></span></div>
        <div class="bar"><b id="b-hp-bar"></b></div>
        <div class="sub-row">
          <span class="statuses" id="b-statuses"></span>
          <button class="pile" id="b-pile-draw">山札 <b id="b-draw"></b></button>
          <button class="pile" id="b-pile-discard">捨て札 <b id="b-discard"></b></button>
        </div>
      </div>
      <button class="end-turn" id="b-end">ターン<br>終了</button>
    </section>

    <section class="hand" id="hand" aria-label="手札"></section>
  </div>
</section>

<!-- ── 報酬 ──────────────────────────────────── -->
<section class="screen" id="screen-reward">
  <div class="panel-page">
    <h2 class="page-title">群れを追い払った</h2>
    <p class="reward-gold" id="reward-gold"></p>
    <p class="reward-lead">1枚えらんでデッキに加える</p>
    <div class="reward-cards" id="reward-cards"></div>
    <div class="reward-actions">
      <button class="btn primary" id="reward-take" disabled>デッキに加える</button>
      <button class="btn" id="reward-skip">何も加えない</button>
    </div>
    <p class="reward-status" id="reward-status"></p>
  </div>
</section>

<!-- ── 経営評価 ───────────────────────────────── -->
<section class="screen" id="screen-result">
  <div class="panel-page">
    <h2 class="page-title">経営評価</h2>
    <p class="result-lead" id="result-lead"></p>
    <div class="result-rank" id="result-rank"></div>
    <p class="result-title" id="result-title"></p>
    <p class="result-total" id="result-total"></p>
    <table class="result-parts"><tbody id="result-parts"></tbody></table>
    <div class="reward-actions">
      <button class="btn primary" id="btn-again">もう一度</button>
      <button class="btn" id="btn-title">タイトルへ</button>
    </div>
  </div>
</section>

<!-- ダイアログとお知らせ -->
<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h3 class="modal-title"></h3><button class="modal-close" aria-label="閉じる">閉じる</button></div>
    <div class="modal-body"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- データ（ここを足すだけでカード・敵・農家タイプが増える） -->
<script src="data/config.js"></script>
<script src="data/crops.js"></script>
<script src="data/cards.js"></script>
<script src="data/statuses.js"></script>
<script src="data/enemies.js"></script>
<script src="data/relics.js"></script>
<script src="data/farmers.js"></script>
<!-- 仕組み -->
<script src="js/core/util.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/battle.js"></script>
<script src="js/reward.js"></script>
<script src="js/score.js"></script>
<script src="js/save.js"></script>
<!-- 画面 -->
<script src="js/ui/art.js"></script>
<script src="js/ui/render-card.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/input.js"></script>
<script src="js/ui/render-battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
