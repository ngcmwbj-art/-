<title>グソク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL aquarium; instrument HUD pinned top, dialogue console pinned bottom — like peering into a deep-sea research tank at night. */
:root{
  --abyss:#02080d;
  --panel:rgba(4,16,24,.62);
  --line:rgba(143,211,255,.16);
  --ink:#dbe7ec;
  --dim:#7e97a4;
  --glow:#8fd3ff;
  --lamp:#ff6f55;
  --amber:#e8c07a;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--ink);overflow:hidden;font-family:var(--f-body)}
[hidden]{display:none!important}
body{touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}

/* ---- HUD ---- */
.hud-top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
.brand{display:flex;gap:12px;align-items:flex-start}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.12em;margin:0;line-height:1;writing-mode:vertical-rl;text-shadow:0 0 18px rgba(143,211,255,.35)}
.log{font-family:var(--f-data);font-size:11px;line-height:1.7;color:var(--dim);letter-spacing:.04em}
.log b{color:var(--ink);font-weight:500}
.log .stage{color:var(--glow)}
.gauges{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-width:196px;font-family:var(--f-data);font-size:11px}
.gauges summary{list-style:none;cursor:pointer;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.gauges summary::-webkit-details-marker{display:none}
.gauges[open] summary{margin-bottom:8px}
.g-row{display:grid;grid-template-columns:44px 1fr 52px;align-items:center;gap:8px;padding-block:3px}
.g-row span:first-child{color:var(--dim);font-family:var(--f-body);font-size:11px}
.g-row output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.bar{height:3px;background:rgba(143,211,255,.12);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--glow);width:50%;transition:width .6s}
.bar.warn i{background:var(--lamp)}
.bar.ok i{background:#9fe0b6}
.ai-state{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--dim);font-size:10.5px;display:flex;justify-content:space-between;gap:8px}
.ai-state em{font-style:normal;color:var(--amber)}

/* ---- dialogue console ---- */
.console{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:5;pointer-events:none}
.bubble{pointer-events:auto;width:min(720px,100%);background:linear-gradient(180deg,rgba(3,14,22,.78),rgba(3,12,18,.86));border:1px solid var(--line);border-radius:4px;padding:14px 18px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:74px;box-sizing:border-box;position:relative}
.speaker{font-family:var(--f-data);font-size:10.5px;letter-spacing:.2em;color:var(--glow);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.speaker .emo{color:var(--dim);letter-spacing:.06em}
.line{font-family:var(--f-display);font-weight:500;font-size:clamp(16px,2.3vw,20px);line-height:1.7;letter-spacing:.04em;min-height:1.7em;white-space:pre-wrap;word-break:break-word}
.line.narr{font-family:var(--f-body);font-size:14px;color:var(--dim);font-style:italic}
.line .caret{display:inline-block;width:.5em;height:1em;background:var(--glow);opacity:.7;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.talk{pointer-events:auto;width:min(720px,100%);display:flex;gap:8px}
.talk input{flex:1;min-width:0;background:rgba(3,14,22,.8);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
.talk input:focus{border-color:rgba(143,211,255,.5);box-shadow:0 0 0 3px rgba(143,211,255,.12)}
.talk input::placeholder{color:#557080}
button{font:inherit;color:var(--ink);background:rgba(8,26,38,.82);border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
button:hover{background:rgba(20,48,66,.9);border-color:rgba(143,211,255,.4)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#16445e;border-color:rgba(143,211,255,.45)}
.actions{pointer-events:auto;width:min(720px,100%);display:flex;flex-wrap:wrap;gap:6px}
.actions button{font-size:13px;padding:7px 10px;display:flex;gap:6px;align-items:center}
.actions .sep{flex:1}
.actions small{font-family:var(--f-data);color:var(--dim);font-size:10.5px}
.menu{position:relative}
.pop{position:absolute;bottom:calc(100% + 6px);left:0;background:rgba(3,14,22,.95);border:1px solid var(--line);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:170px;z-index:9}
.pop button{text-align:left;width:100%}
.pop .note{font-size:11px;color:var(--dim);padding:4px 6px 2px}
.lampdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#dff3ff;box-shadow:0 0 8px currentColor}

/* ---- title ---- */
#title{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,rgba(10,40,58,.35),rgba(1,5,9,.92) 70%);transition:opacity 1.2s}
#title.gone{opacity:0;pointer-events:none}
.t-card{display:flex;gap:28px;align-items:stretch;padding:24px 16px;max-width:640px}
.t-name{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,13vw,120px);writing-mode:vertical-rl;letter-spacing:.2em;line-height:1;margin:0;text-shadow:0 0 40px rgba(143,211,255,.25)}
.t-body{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-width:0}
.label{border:1px solid rgba(219,231,236,.35);padding:12px 14px;font-size:12px;line-height:1.8;color:#b9cad2;max-width:34ch}
.label .sci{font-family:var(--f-display);font-style:italic;font-size:15px;color:var(--ink)}
.label dl{display:grid;grid-template-columns:auto 1fr;gap:0 12px;margin:8px 0 0;font-family:var(--f-data);font-size:11px}
.label dt{color:var(--dim)}
.label dd{margin:0}
.t-body p{margin:0;font-size:14px;line-height:1.9;color:#a9bcc6;max-width:34ch}
.t-go{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t-go button{font-size:15px;padding:12px 20px}
#loadmsg{font-family:var(--f-data);font-size:11px;color:var(--dim)}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:rgba(3,14,22,.9);border:1px solid var(--line);padding:8px 14px;border-radius:4px;font-size:13px;z-index:30;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
.confirm{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:640px){
  .brand h1{font-size:20px}
  .gauges{min-width:0;padding:8px 10px}
  .g-row{grid-template-columns:38px 1fr 46px;gap:6px}
  .log{font-size:10px}
  .t-card{gap:16px}
  .actions button{font-size:12px;padding:6px 8px}
  .actions small{display:none}
}
@media (prefers-reduced-motion:reduce){
  .line .caret{animation:none}
  #title{transition:none}
}
</style>

<canvas id="gl" aria-label="オオグソクムシの水槽"></canvas>

<div class="hud-top">
  <div class="brand">
    <h1>グソク</h1>
    <div class="log" id="log">
      <div>飼育 <b id="day">1</b> 日目</div>
      <div>状態 <span class="stage" id="stage">警戒</span></div>
      <div id="clock">--:--</div>
    </div>
  </div>
  <details class="gauges" id="gauges" open>
    <summary><span>Tank Monitor</span><span id="gsum">▾</span></summary>
    <div class="g-row"><span>水温</span><div class="bar" id="b-temp"><i></i></div><output id="o-temp">10.0℃</output></div>
    <div class="g-row"><span>水質</span><div class="bar" id="b-water"><i></i></div><output id="o-water">100%</output></div>
    <div class="g-row"><span>空腹</span><div class="bar" id="b-hunger"><i></i></div><output id="o-hunger">20</output></div>
    <div class="g-row"><span>機嫌</span><div class="bar" id="b-mood"><i></i></div><output id="o-mood">60</output></div>
    <div class="g-row"><span>信頼</span><div class="bar" id="b-trust"><i></i></div><output id="o-trust">0</output></div>
    <div class="ai-state"><span>会話エンジン</span><em id="aistate">簡易</em></div>
  </details>
</div>

<div class="console">
  <div class="bubble" id="bubble" aria-live="polite">
    <div class="speaker"><span id="who">グソク</span><span class="emo" id="emo"></span></div>
    <div class="line" id="line"></div>
  </div>
  <form class="talk" id="talk" autocomplete="off">
    <label for="say" style="position:absolute;left:-9999px">話しかける</label>
    <input id="say" type="text" maxlength="120" placeholder="話しかける（例：こんにちは）" enterkeyhint="send">
    <button class="primary" type="submit" id="sendbtn">話す</button>
  </form>
  <div class="actions" id="actions">
    <div class="menu">
      <button type="button" id="btn-feed" aria-haspopup="true">餌をやる</button>
      <div class="pop" id="pop-feed" hidden>
        <button type="button" data-food="aji">アジの切り身</button>
        <button type="button" data-food="ika">スルメイカの輪切り</button>
        <button type="button" data-food="krill">オキアミ</button>
        <div class="note">食べるかどうかは本人次第。</div>
      </div>
    </div>
    <button type="button" id="btn-light"><span class="lampdot" id="lampdot"></span><span id="lamplabel">白色灯</span></button>
    <button type="button" id="btn-water">水換え</button>
    <button type="button" id="btn-cool">水温 −</button>
    <button type="button" id="btn-warm">水温 ＋</button>
    <span class="sep"></span>
    <small>本体をタップ：つつく ／ 水槽をタップ：ガラスを叩く</small>
    <div class="menu">
      <button type="button" id="btn-set" aria-haspopup="true">設定</button>
      <div class="pop" id="pop-set" hidden style="left:auto;right:0">
        <button type="button" id="set-quality">画質：高</button>
        <button type="button" id="set-voice">声：オン</button>
        <button type="button" id="set-ai">AI会話：オン</button>
        <button type="button" id="set-reset">最初からやり直す</button>
        <div class="confirm" id="reset-confirm" hidden>
          <div class="note">記憶も消えます。</div>
          <button type="button" id="reset-yes">消去する</button>
          <button type="button" id="reset-no">やめる</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="title">
  <div class="t-card">
    <h2 class="t-name">グソク</h2>
    <div class="t-body">
      <div class="label">
        <div class="sci">Bathynomus doederleinii</div>
        <div>オオグソクムシ　等脚目スナホリムシ科</div>
        <dl>
          <dt>採集</dt><dd>駿河湾　水深 380 m</dd>
          <dt>体長</dt><dd>128 mm</dd>
          <dt>飼育水温</dt><dd>8〜12 ℃</dd>
          <dt>最終給餌</dt><dd>不明</dd>
        </dl>
      </div>
      <p>深海から来た同居人。話しかけ、餌をやり、水を守る。心を開くかどうかは、あなた次第。</p>
      <div class="t-go">
        <button class="primary" type="button" id="start" disabled>水槽をのぞく</button>
        <span id="loadmsg">水槽を準備しています…</span>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/BokehShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/BokehPass.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById('loadmsg').textContent='3Dエンジンを読み込めませんでした。通信環境を確認して再読み込みしてください。';return;}
const V3=THREE.Vector3, TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const IS_MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||Math.min(innerWidth,innerHeight)<560;

/* =====================================================================
   NOISE
   ===================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(380);
const PERM=new Uint8Array(512);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<512;i++)PERM[i]=p[i&255]}
const GX=[1,-1,0,0,.7071,-.7071,.7071,-.7071],GY=[0,0,1,-1,.7071,.7071,-.7071,-.7071];
const fade=t=>t*t*t*(t*(t*6-15)+10);
function perlin(x,y,per){
  per=per||256;
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const x0=((xi%per)+per)%per,y0=((yi%per)+per)%per,x1=(x0+1)%per,y1=(y0+1)%per;
  const h=(a,b)=>PERM[PERM[a&255]+(b&255)]&7;
  const g00=h(x0,y0),g10=h(x1,y0),g01=h(x0,y1),g11=h(x1,y1);
  const n00=GX[g00]*xf+GY[g00]*yf,n10=GX[g10]*(xf-1)+GY[g10]*yf,n01=GX[g01]*xf+GY[g01]*(yf-1),n11=GX[g11]*(xf-1)+GY[g11]*(yf-1);
  const u=fade(xf),v=fade(yf);
  return lerp(lerp(n00,n10,u),lerp(n01,n11,u),v)*1.4;
}
function fbm(x,y,oct,per){let s=0,a=.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*perlin(x*f,y*f,per?per*f:0);n+=a;a*=.5;f*=2}return s/n}
function hash3(x,y,z){return PERM[(PERM[(PERM[x&255]+y)&255]+z)&255]/255}
function vnoise3(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=fade(x-xi),yf=fade(y-yi),zf=fade(z-zi);
  const c=(a,b,d)=>hash3(xi+a,yi+b,zi+d);
  return lerp(lerp(lerp(c(0,0,0),c(1,0,0),xf),lerp(c(0,1,0),c(1,1,0),xf),yf),lerp(lerp(c(0,0,1),c(1,0,1),xf),lerp(c(0,1,1),c(1,1,1),xf),yf),zf)*2-1;
}
function fbm3(x,y,z,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise3(x*f,y*f,z*f);n+=a;a*=.5;f*=2.03}return s/n}

/* =====================================================================
   PROCEDURAL TEXTURES
   ===================================================================== */
function canvasTex(S,paint,srgb){
  const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const img=g.createImageData(S,S);paint(img.data,S);g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
function heightField(S,fn){const h=new Float32Array(S*S);for(let y=0;y<S;y++)for(let x=0;x<S;x++)h[y*S+x]=fn(x/S,y/S);return h}
function normalTex(h,S,str){
  return canvasTex(S,(d)=>{
    for(let y=0;y<S;y++)for(let x=0;x<S;x++){
      const dx=(h[y*S+(x+1)%S]-h[y*S+(x-1+S)%S])*str,dy=(h[((y+1)%S)*S+x]-h[((y-1+S)%S)*S+x])*str;
      const l=Math.hypot(dx,dy,1),i=(y*S+x)*4;
      d[i]=(-dx/l*.5+.5)*255;d[i+1]=(dy/l*.5+.5)*255;d[i+2]=(1/l*.5+.5)*255;d[i+3]=255;
    }
  },false);
}
const TEX={};
function buildTextures(){
  // ---- carapace: pale lilac-beige with brownish mottling and fine pits
  const S=512;
  const mott=heightField(S,(u,v)=>fbm(u*5,v*5,5,5));
  const fine=heightField(S,(u,v)=>fbm(u*48,v*48,3,48));
  const pit =heightField(S,(u,v)=>fbm(u*90,v*90,2,90));
  TEX.shell=canvasTex(S,(d)=>{
    for(let i=0;i<S*S;i++){
      const m=smooth(-.15,.45,mott[i]),f=fine[i],p=smooth(.25,.55,pit[i]);
      let r=lerp(196,142,m),g=lerp(178,114,m),b=lerp(180,112,m);
      const warm=smooth(.1,.6,fine[(i*7)%(S*S)]);r+=warm*10;g+=warm*4;
      const k=1+f*.18-p*.22;
      d[i*4]=clamp(r*k,0,255);d[i*4+1]=clamp(g*k,0,255);d[i*4+2]=clamp(b*k,0,255);d[i*4+3]=255;
    }
  },true);
  const sh=new Float32Array(S*S);for(let i=0;i<S*S;i++)sh[i]=mott[i]*.6+fine[i]*.35-smooth(.25,.6,pit[i])*.9;
  TEX.shellN=normalTex(sh,S,5);
  // ---- abyssal sediment: grey-olive silt, foram specks
  const T=512;
  const s1=heightField(T,(u,v)=>fbm(u*8,v*8,5,8));
  const s2=heightField(T,(u,v)=>fbm(u*64,v*64,3,64));
  const s3=heightField(T,(u,v)=>perlin(u*140,v*140,140));
  TEX.sand=canvasTex(T,(d)=>{
    for(let i=0;i<T*T;i++){
      const a=s1[i],b=s2[i],spk=s3[i];
      let r=78+a*22+b*12,g=74+a*19+b*10,bl=68+a*14+b*9;
      if(spk>.62){r+=60;g+=58;bl+=52}else if(spk<-.62){r-=40;g-=40;bl-=36}
      d[i*4]=clamp(r,0,255);d[i*4+1]=clamp(g,0,255);d[i*4+2]=clamp(bl,0,255);d[i*4+3]=255;
    }
  },true);
  const sn=new Float32Array(T*T);for(let i=0;i<T*T;i++)sn[i]=s2[i]*.7+s3[i]*.35+s1[i]*.4;
  TEX.sandN=normalTex(sn,T,4);
  // ---- rock
  const R=256;const r1=heightField(R,(u,v)=>fbm(u*16,v*16,5,16));
  TEX.rockN=normalTex(r1,R,6);
  // ---- compound eye: hexagonal facets
  const E=256,fac=26;
  const eh=new Float32Array(E*E),ee=new Float32Array(E*E);
  for(let y=0;y<E;y++)for(let x=0;x<E;x++){
    const px=x/E*fac,py=y/E*fac*1.1547;
    const row=Math.floor(py),ox=(row&1)?.5:0,fx=px-ox,cx=Math.floor(fx)+.5,cy=row+.5;
    let best=9;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const rr=row+dy,oo=(rr&1)?.5:0;const X=Math.floor(px-oo)+dx+.5+oo,Y=rr+.5;const dd=Math.hypot((px-X),(py-Y)*.866);if(dd<best)best=dd}
    eh[y*E+x]=Math.sqrt(Math.max(0,1-best*best*3.2));ee[y*E+x]=smooth(.55,.05,best);
  }
  TEX.eyeN=normalTex(eh,E,3.5);
  TEX.eyeE=canvasTex(E,(d)=>{for(let i=0;i<E*E;i++){const v=ee[i];d[i*4]=150*v;d[i*4+1]=190*v;d[i*4+2]=120*v;d[i*4+3]=255}},true);

}

/* ---- caustics / lamp shading injected into standard materials */
const U={time:{value:0},lamp:{value:1},lampCol:{value:new THREE.Color('#bfe4ff')},caus:{value:1},lampPos:{value:new V3(0,13,1.2)}};
const CAUSTIC_GLSL=`
uniform float uTime;uniform float uLamp;uniform float uCaus;uniform vec3 uLampCol;uniform vec3 uLampPos;
varying vec3 vWPos;varying vec3 vWN;
float causticF(vec2 uv,float t){
  vec2 p=mod(uv*6.28318,6.28318)-250.;vec2 i=p;float c=1.;float inten=.005;
  for(int n=0;n<4;n++){float tt=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}
  c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);
}
vec3 causticRGB(vec3 wp){
  vec2 uv=wp.xz*.19+wp.y*.03;float t=uTime*.42+23.;
  vec3 c=vec3(causticF(uv+vec2(.004,0.),t),causticF(uv,t),causticF(uv-vec2(.004,0.),t));
  float d=length(wp.xz-uLampPos.xz);float cone=smoothstep(8.5,1.5,d);
  float up=clamp(vWN.y*.8+.35,0.,1.);
  return c*cone*up*uCaus;
}`;
function addCaustics(mat,strength){
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.time;sh.uniforms.uLamp=U.lamp;sh.uniforms.uCaus=U.caus;sh.uniforms.uLampCol=U.lampCol;sh.uniforms.uLampPos=U.lampPos;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWPos;varying vec3 vWN;')
      .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWPos=(modelMatrix*vec4(transformed,1.)).xyz;\nvWN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\n'+CAUSTIC_GLSL)
      .replace('#include <dithering_fragment>',`#include <dithering_fragment>
        gl_FragColor.rgb+=causticRGB(vWPos)*diffuseColor.rgb*uLampCol*${strength.toFixed(2)};`);
  };
  mat.customProgramCacheKey=()=>'caus'+strength;
  return mat;
}

function heightAt(x,z){
  const dist=Math.hypot(x*.8,z);
  let h=fbm(x*.11+3.1,z*.11-1.7,4)*.9*(.35+.65*smooth(2.5,10,dist));
  h+=Math.sin(x*1.25+z*.35+fbm(x*.25,z*.25,2)*5)*.03*smooth(0,.3,fbm(x*.07+9,z*.07,2)+.3);
  const back=Math.max(0,-z-4.5);h+=back*back*.09;
  return h-.1;
}

/* =====================================================================
   THE ISOPOD
   ===================================================================== */
function gridSolid(nu,nv,fn,thick,uvOff){
  const O=[],SH=[];
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const r=fn(i/nu,j/nv);O.push(new V3(r[0],r[1],r[2]));SH.push(r[3])}
  const at=(i,j)=>O[clamp(j,0,nv)*(nu+1)+clamp(i,0,nu)];
  const N=[];for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const du=at(i+1,j).clone().sub(at(i-1,j)),dv=at(i,j+1).clone().sub(at(i,j-1));N.push(du.cross(dv).normalize())}
  const pos=[],uv=[],col=[],idx=[];
  const push=(p,u,v,s)=>{pos.push(p.x,p.y,p.z);uv.push(u*.5+uvOff[0],v*.22+uvOff[1]);col.push(s,s,s);return pos.length/3-1};
  const base0=pos.length/3;
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const k=j*(nu+1)+i;push(O[k],i/nu,j/nv,SH[k])}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=base0+j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;idx.push(a,b,c,b,d,c)}
  const base1=pos.length/3;
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const k=j*(nu+1)+i;push(O[k].clone().addScaledVector(N[k],-thick),i/nu,j/nv,SH[k]*.5)}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=base1+j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;idx.push(a,c,b,b,c,d)}
  const rim=(list)=>{const s=pos.length/3;list.forEach(([i,j])=>{const k=j*(nu+1)+i;push(O[k],i/nu,j/nv,SH[k]*.8);push(O[k].clone().addScaledVector(N[k],-thick),i/nu,j/nv,SH[k]*.6)});
    for(let q=0;q<list.length-1;q++){const a=s+q*2,b=a+1,c=a+2,d=a+3;idx.push(a,c,b,b,c,d)}};

  if(has(/深海|海|水深|水圧/))return R(['ワシがいたのは水深三百八十メートル。光は届かない。静かでいい場所だ。','深海には季節がない。上から死骸が降ってくるのを待つだけだ。それで十分だ。']);
  if(has(/何歳|年齢|とし|いくつ/))return R(['歳など数えていない。脱皮の回数なら覚えている。……忘れた。']);
  if(has(/名前|なまえ/)&&has(/あなた|きみ|君|おまえ|お前|グソク/))return R(['ワシはグソクだ。オオグソクムシのグソク。そのままだろう。']);
  if(has(/ありがと|サンキュ|感謝/))return R(['礼などいらん。……水を替えてくれたら、それでいい。'],'happy');
  if(has(/さようなら|またね|おやすみ|バイバイ|じゃあね/))return R(['行け。ワシはここにいる。どうせ動かん。','……また来い。来なくても、別に困らんが。'],'sad');
  if(has(/[?？]$|なに|何|どう|なぜ|なんで/))return R(['難しいことを聞くな。ワシの脳は小さい。','答えは砂の中だ。自分で掘れ。','……深海なら、その問いは百年かけて考える。']);
  if(name&&has(new RegExp(name)))return R([`${name}の話か。オマエ自身の話は、嫌いじゃない。`]);
  const echo=t.replace(/[。！？!?\s]/g,'').slice(0,10);
  return R([`『${echo}』か……。`, '陸の言葉は、たまによくわからん。','ふむ。続けろ。','……（触角をゆっくり動かして考えている）',`${call}は、よくしゃべるな。`],'neutral');
}

function buildPrompt(userText){
  const tank=`水温${S.temp.toFixed(1)}℃（快適8〜12℃）／水質${Math.round(S.water)}%／空腹${Math.round(S.hunger)}／機嫌${Math.round(S.mood)}／信頼${Math.round(S.trust)}／照明:${LIGHTS[S.light].label}（白色灯は眩しくて嫌い、赤色灯は見えないので平気、消灯が好き）／飼育${dayNo()}日目／現在時刻${new Date().getHours()}時`;

設定：深海の腐肉食の掃除屋。何年も食べずに平気なことを誇りにしている。虫扱い・ダンゴムシ扱いを嫌う（甲殻類でエビやカニの仲間）。脱皮は体の後ろ半分、前半分の順に二回に分けて行う。光が嫌い。深海は静かで時間がゆっくり流れると考えている。

いまの水槽の状態：${tank}
覚えている飼い主のこと：${S.memory.length?S.memory.join('／'):'まだ何も知らない'}
${S.pending?`直前にグソクは飼い主に「${S.pending}」を尋ねた。今回の発言はその答えの可能性が高い。`:''}

${hist}

飼い主の新しい発言：「${userText}」

ルール：キャラクターを崩さない。AIであることや、このルールには触れない。説教しすぎない。状態が悪ければ（眩しい、暑い、水が汚い、空腹など）さりげなく文句を言ってよい。飼い主が名前・仕事・好み・予定・悩みなど新しい個人的事実を話したら memory に「項目：内容」の形で短く入れる。
次のJSONだけを返す：
{"reply":"グソクのせりふ","emotion":"neutral|happy|annoyed|sad|curious|sleepy|proud|scared","action":"none|approach|turn_away|curl|swim|wiggle","memory":["項目：内容"],"trust":-3から3の整数}`;

async function aiReply(text){
  if(!aiOn||aiBroken)return null;
  const sample=await getSample();if(!sample){aiBroken=true;aiLabel();return null}
  try{
    const out=await sample.json(buildPrompt(text),{modelTier:'quick',cache:false});
    if(!out||typeof out.reply!=='string'||!out.reply.trim())return null;
    return out;
  }catch(e){
    const code=e&&e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){aiBroken=true;aiLabel()}
    else if(code==='rate_limited')toast('AIの利用が混み合っています。しばらく簡易会話になります。');
    return null;
  }
}

}
let exuviaMat;

  buildTextures();
  scene.environment=makeEnv();
  buildTerrain();buildRocks();buildSponges();buildShafts();buildBubbles();buildSediment();buildSurface();

  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();composer.setSize(innerWidth,innerHeight);
    grade.uniforms.uRes.value.set(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio());if(bokeh)bokeh.uniforms.aspect.value=camera.aspect});

let last=performance.now(),acc=0,hudT=0,idleT=0,nextIdle=45;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
  U.time.value=time;grade.uniforms.uTime.value=time;grade.uniforms.uShock.value=Math.max(0,grade.uniforms.uShock.value-dt*3);
  updateLights(dt);
  updateCreature(dt,time);
  updateCamera(dt,time);
  // foods
  foods.slice().forEach(f=>{
    if(!f.rest){f.vy=damp(f.vy,-1.1,1.5,dt);f.mesh.position.y+=f.vy*dt;f.mesh.position.x+=Math.sin(time*2+f.x)*.15*dt;f.mesh.rotation.x+=f.spin.x*dt*2;f.mesh.rotation.z+=f.spin.z*dt*2;
      if(f.mesh.position.y<=f.ground){f.mesh.position.y=f.ground;f.rest=true;f.x=f.mesh.position.x;f.z=f.mesh.position.z;f.mesh.rotation.x*=.1;f.mesh.rotation.z*=.1;puff(f.mesh.position,8)}}
    f.mesh.scale.setScalar(Math.max(.05,f.left));
    if(f.rotAt&&Date.now()>f.rotAt&&!f.rotten){f.rotten=true;if(S.stage>=2)say('……腐ってきたぞ。水が汚れる。',{emo:'annoyed'})}
  });
  // bubbles
  const dm=new THREE.Matrix4();
  bubbleData.forEach((b,i)=>{b.y+=dt*b.sp*(1+b.y*.05);if(b.y>10.4){b.y=0;b.r=.025+Math.random()*.07}
    const x=AIR.x+Math.sin(time*3+b.ph)*.06*b.y*.5,z=AIR.z+Math.cos(time*2.3+b.ph)*.06*b.y*.5;
    const s=b.r*(1+Math.sin(time*18+b.ph)*.08);dm.makeScale(s,s*.85,s).setPosition(x,AIR.y+.1+b.y,z);bubbles.setMatrixAt(i,dm)});
  bubbles.instanceMatrix.needsUpdate=true;
  // sediment
  const pa=sed.geometry.attributes.position,aa=sed.geometry.attributes.aA,sa=sed.geometry.attributes.aS;
  sedData.forEach((d,i)=>{if(d.life<d.max){d.life+=dt;d.v.multiplyScalar(1-dt*.9);d.v.y-=dt*.02;d.p.addScaledVector(d.v,dt);const k=d.life/d.max;aa.setX(i,Math.sin(Math.min(1,k)*Math.PI)*.9);sa.setX(i,d.s*(1+k*2.5))}else aa.setX(i,0);pa.setXYZ(i,d.p.x,d.p.y,d.p.z)});
  pa.needsUpdate=aa.needsUpdate=sa.needsUpdate=true;
  // sim
  if(started){
    acc+=dt;if(acc>5){tick(acc/60);acc=0;save()}
    hudT+=dt;if(hudT>1){hudT=0;refreshHUD()}
    idleT+=dt;
    if(idleT>nextIdle&&!typing&&!aiBusy){idleT=0;nextIdle=50+Math.random()*70;idleChatter()}
  }
  composer.render(dt);
}
function idleChatter(){
  if(Game.molting)return;
  if(S.stage>=1&&Math.random()<.45&&ask())return;
  const st=S.stage;
  if(st===0){say(pickR(['（グソクは砂の上でじっとしている）','（触角だけが、ゆっくり動いている）','（こちらの様子をうかがっているようだ）']),{narr:true});return}
  const c=[];
  if(S.light==='white'&&S.whiteMin>10)c.push(st===1?'……マブシイ。':'……いつまで照らしている。消せ。');
  if(S.temp>12.5)c.push(st===1?'……アツイ。':'水がぬるい。冷やせ。');
  if(S.temp<7.5)c.push(st===1?'……サムイ。':'冷えすぎだ。ワシでも固まる。');
  if(S.water<55)c.push(st===1?'……ミズ、クサイ。':'水が臭う。オマエの鼻は飾りか。');
  if(S.hunger>70)c.push(st===1?'……ハラ。':'……腹が、減ったかもしれん。');
  if(!c.length){
    const n=mem('名前'),w=mem('仕事');
    if(st===1)c.push('……シンカイ、シズカ。','……ヒカリ、キライ。','……ネムイ。');
    else{c.push('深海では、上から死んだ鯨が降ってくる。何十年に一度のごちそうだ。','ワシの眼は三千以上の個眼でできている。オマエの顔も三千個見えている。','何もしない時間を、陸の生き物は怖がりすぎる。','……海の底の音を知っているか。何も聞こえない音だ。');
      if(n)c.push(n+'。……呼んでみただけだ。');
      if(w&&/牛|肥育|畜産|牧場/.test(w))c.push('オマエの牛は元気か。よく食うやつは、よく育つ。ワシは例外だ。');
      else if(w)c.push(w+'は、はかどっているか。');
      if(st===3)c.push('脱皮して思った。捨てた殻の分だけ、軽くなれる。','時間は、深さに比例してゆっくり流れる。');
    }
  }
  say(pickR(c),{emo:S.mood<35?'annoyed':'neutral'});
}
function start(){
  if(started)return;started=true;Audio2.init();
  $('title').classList.add('gone');setTimeout(()=>$('title').hidden=true,1300);
  const away=(Date.now()-S.last)/60000;
  if(!S.talks&&!S.fed){
    say('——水槽の底に、何かがいる。',{narr:true});
    say('（深海から来たオオグソクムシ。まだこちらを警戒しているようだ。話しかけてみよう）',{narr:true});
  }else{
    const h=Math.round((Date.now()-S.last)/3600000);
    if(S.stage>=2)say(h>=1?`……戻ったか。${h}時間ぶりだな。`:'……まだいたのか。',{emo:'curious'});
    else if(S.stage===1)say('……キタ。',{emo:'curious'});
    else say('（グソクは砂の上でじっとしている）',{narr:true});
  }
  $('say').focus({preventScroll:true});
}

/* ---- UI wiring */
$('start').addEventListener('click',start);
$('talk').addEventListener('submit',e=>{e.preventDefault();if(!started)return;const v=$('say').value.trim();if(!v)return;$('say').value='';Game.talk(v)});
const pops=[['btn-feed','pop-feed'],['btn-set','pop-set']];
function closePops(){pops.forEach(([,p])=>$(p).hidden=true);$('reset-confirm').hidden=true}
pops.forEach(([b,p])=>$(b).addEventListener('click',e=>{e.stopPropagation();const h=$(p).hidden;closePops();$(p).hidden=!h}));
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closePops()});
document.querySelectorAll('[data-food]').forEach(b=>b.addEventListener('click',()=>{closePops();if(started)Game.feed(b.dataset.food)}));
$('btn-light').addEventListener('click',()=>started&&Game.light());
$('btn-water').addEventListener('click',()=>started&&Game.water());
$('btn-cool').addEventListener('click',()=>started&&Game.temp(-.5));
$('btn-warm').addEventListener('click',()=>started&&Game.temp(.5));
$('set-quality').addEventListener('click',()=>{qName=qName==='high'?'std':'high';try{localStorage.setItem('gusoku.q',qName)}catch(e){}applyQuality()});
$('set-voice').addEventListener('click',()=>{voiceOn=!voiceOn;try{localStorage.setItem('gusoku.voice',voiceOn?'on':'off')}catch(e){}$('set-voice').textContent='声：'+(voiceOn?'オン':'オフ');if(!voiceOn)try{speechSynthesis.cancel()}catch(e){}});
$('set-ai').addEventListener('click',()=>{aiOn=!aiOn;aiBroken=false;try{localStorage.setItem('gusoku.ai',aiOn?'on':'off')}catch(e){}aiLabel()});
$('set-reset').addEventListener('click',e=>{e.stopPropagation();$('reset-confirm').hidden=false});
$('reset-no').addEventListener('click',e=>{e.stopPropagation();$('reset-confirm').hidden=true});
$('reset-yes').addEventListener('click',()=>{try{localStorage.removeItem('gusoku.save')}catch(e){}location.reload()});
$('gauges').addEventListener('toggle',()=>$('gsum').textContent=$('gauges').open?'▾':'▸');
if(IS_MOBILE)$('gauges').open=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

window.gusoku={CAM,C,Game,get S(){return S},settle:()=>updateLights(10)};
setTimeout(()=>{try{boot()}catch(e){console.error(e);$('loadmsg').textContent='読み込みに失敗しました：'+e.message}},30);
})();
</script>
